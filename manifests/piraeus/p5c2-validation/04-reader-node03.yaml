# P5C2 — Reader pod node-03 (temporary), reads/verifies hashes
apiVersion: v1
kind: Pod
metadata:
  name: p5c2-reader-node03
  namespace: p5c2-validation
spec:
  nodeSelector:
    kubernetes.io/hostname: node-03
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: reader
      image: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "=== marker ==="; cat /data/P5C2_MARKER
          echo "=== hashes ==="
          sha256sum /data/P5C2_MARKER /data/payload.bin | tee /data/hashes-node03.txt
          echo "READER_NODE03_DONE"
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: p5c2-r2-test
