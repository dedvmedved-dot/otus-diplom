# P5C2 — Writer pod (pinned node-01), creates marker + 64MiB deterministic payload
apiVersion: v1
kind: Pod
metadata:
  name: p5c2-writer
  namespace: p5c2-validation
spec:
  nodeSelector:
    kubernetes.io/hostname: node-01
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: writer
      image: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "P5C2_MARKER RUN_ID=P5C2_RUN_ID_PLACEHOLDER" > /data/P5C2_MARKER
          dd if=/dev/zero of=/data/payload.bin bs=1M count=64 2>/dev/null
          sync
          sha256sum /data/P5C2_MARKER /data/payload.bin | tee /data/hashes.txt
          echo "WRITER_DONE"
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: p5c2-r2-test
