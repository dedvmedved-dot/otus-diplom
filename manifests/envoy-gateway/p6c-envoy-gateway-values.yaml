# P6C-R1 — Envoy Gateway 1.9.1 values (digest-pinned, HTTP-only foundation)
global:
  images:
    envoyGateway:
      image: docker.io/envoyproxy/gateway@sha256:2999d87c3a2b3e890e0ee1a2b11a159b60963aadb2cbb9f2c0a49e0197df3c72
      pullPolicy: IfNotPresent
    envoyProxy:
      image: docker.io/envoyproxy/envoy@sha256:9e24a3b459b463dd37e116a0f46d2abfcb6a1cb9897d87e85cf2ee25edbe373b
      pullPolicy: IfNotPresent
    ratelimit:
      image: docker.io/envoyproxy/ratelimit:8fe6ea42
      pullPolicy: IfNotPresent

crds:
  enabled: false

deployment:
  envoyGateway:
    image:
      repository: ""
      tag: ""
    replicas: 1
  pod:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

certgen:
  job:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    envoyProxy:
      provider:
        kubernetes:
          envoyDeployment:
            pod:
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
    logging:
      level:
        default: info

service:
  type: ClusterIP
