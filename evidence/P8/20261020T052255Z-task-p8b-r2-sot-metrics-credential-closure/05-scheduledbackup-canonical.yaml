apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: portal-db-daily
  namespace: portal
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: portal-db
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
