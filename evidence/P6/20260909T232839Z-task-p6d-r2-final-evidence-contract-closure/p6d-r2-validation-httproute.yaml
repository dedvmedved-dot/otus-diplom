# P6D-R2 — temporary validation HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p6d-r2-http
  namespace: p6d-r2-validation
spec:
  parentRefs:
    - name: p6d-r2-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: p6d-r2-backend
          port: 8080
