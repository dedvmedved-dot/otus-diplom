# P6C — temporary validation HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p6c-http
  namespace: p6c-validation
spec:
  parentRefs:
    - name: p6c-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: p6c-http-backend
          port: 8080
