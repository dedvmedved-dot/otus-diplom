# P6D — temporary validation HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p6d-http
  namespace: p6d-validation
spec:
  parentRefs:
    - name: p6d-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: p6d-backend
          port: 8080
