# P6C-R1 — temporary validation HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p6c-r1-http
  namespace: p6c-r1-validation
spec:
  parentRefs:
    - name: p6c-r1-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: p6c-r1-http-backend
          port: 8080
