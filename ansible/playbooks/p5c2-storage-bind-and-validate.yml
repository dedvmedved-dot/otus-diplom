    # ═══ PHASE 13 — RF=2 + 2 diskful + 1 diskless + UpToDate/Connected ═══
    - name: PHASE 13 — resolve test resource + wait RF=2 placement/state
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import subprocess, sys, time, json, re
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          # bind PVC -> PV -> volumeHandle
          pv = subprocess.run(KC+["get","pv","-o","json"], capture_output=True, text=True)
          pvlist = json.loads(pv.stdout).get("items",[])
          pvc = subprocess.run(KC+["get","pvc","p5c2-r2-test","-n","p5c2-validation","-o","json"], capture_output=True, text=True)
          pvname = json.loads(pvc.stdout)["spec"].get("volumeName","")
          testpv = next((p for p in pvlist if p["metadata"]["name"]==pvname), None)
          if not testpv: print("TEST_PV_NOT_FOUND"); sys.exit(1)
          handle = testpv["spec"]["csi"].get("volumeHandle","")
          # LINSTOR resource name == volumeHandle (CSI uses rsc name as volumeHandle)
          rsc_name = handle
          open("/tmp/p5c2_rsc_name.txt","w").write(rsc_name)
          print(f"TEST_RESOURCE={rsc_name}")
          lk = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","piraeus-datastore","exec","deploy/linstor-controller","--"]
          def linstor(*a):
              r = subprocess.run(lk+list(a), capture_output=True, text=True)
              return re.sub(r"\x1b\[[0-9;]*m","", r.stdout)
          for i in range(120):
              rl = linstor("linstor","resource","list")
              # parse resource rows
              diskful = 0; diskless = 0; not_uptodate = 0
              for l in rl.splitlines():
                  if rsc_name in l and l.strip().startswith("|"):
                      cols = [c.strip() for c in l.strip("|").split("|")]
                      # columns vary; detect pool and state
                      if "DfltDisklessStorPool" in l: diskless += 1
                      elif "piraeus-thin" in l:
                          diskful += 1
                          if "UpToDate" not in l: not_uptodate += 1
              if diskful==2 and diskless==1 and not_uptodate==0:
                  print(f"RF2_OK diskful={diskful} diskless={diskless}"); sys.exit(0)
              time.sleep(5)
          print(f"RF2_TIMEOUT diskful={diskful} diskless={diskless} not_uptodate={not_uptodate}"); sys.exit(1)
          PYEOF
      register: rf2gate
      changed_when: false
      run_once: true
      delegate_to: node-01

