              if len(m)!=1: print("CANDIDATE_MATCH_FAIL"); sys.exit(1)
              resolved.append(m[0])
          pvs = run(["pvs","--reportformat","json","-o","pv_name,vg_name,pv_uuid,pv_size"])
          pvlist = pvs["report"][0]["pv"]
          vgs = run(["vgs","--reportformat","json","-o","vg_name,vg_uuid,vg_free,pv_count"])
          vglist_raw = vgs["report"][0]["vg"]
          lvs = run(["lvs","--reportformat","json","-o","vg_name,lv_name,lv_uuid,lv_attr,lv_size,data_percent,metadata_percent"])
          lvlist = lvs["report"][0]["lv"]
          expected_paths = set("/dev/"+r["name"] for r in resolved)
          path_to_uuid = {p["pv_name"]: p["pv_uuid"] for p in pvlist}
          expected_uuids = set(path_to_uuid[p] for p in expected_paths if p in path_to_uuid)
          vg_rows = [v for v in vglist_raw if v.get("vg_name")=="vg_piraeus"]
          if len(vg_rows)!=1: print("VG_PIRAEUS_NOT_EXACT_ONE"); sys.exit(1)
          vg = vg_rows[0]
          thin = [l for l in lvlist if l["lv_name"]=="thin_piraeus" and l["vg_name"]=="vg_piraeus"]
          if len(thin)!=1: print("THIN_PIRAEUS_COUNT_FAIL"); sys.exit(1)
          attr = thin[0].get("lv_attr","")
          if attr[0:1]!="t" or attr[4:5]!="a": print("THIN_NOT_THIN_ACTIVE"); sys.exit(1)
          # no leaked test child LV (name contains r2-test)
          leaked = [l for l in lvlist if "test" in l.get("lv_name","").lower()]
          if leaked: print(f"LEAKED_TEST_LV {[l['lv_name'] for l in leaked]}"); sys.exit(1)
          def pct(x):
              try: return float(str(x).replace(",",".").strip())
              except: return None
          d_pct = pct(thin[0].get("data_percent","")); m_pct = pct(thin[0].get("metadata_percent",""))
          if d_pct is None or m_pct is None or not (0<=d_pct<100) or not (0<=m_pct<100): print("THIN_PCT_FAIL"); sys.exit(1)
          vg_free_m = re.search(r'(\d+(?:[.,]\d+)?)', str(vg.get("vg_free","0")))
          if not vg_free_m or float(vg_free_m.group(1).replace(",","."))<=0: print("VG_FREE_ZERO"); sys.exit(1)
          canon = {"host":host,"candidate_paths":sorted(expected_paths),"candidate_pv_uuids":sorted(expected_uuids),
                   "vg_piraeus_uuid":vg.get("vg_uuid",""),"vg_pv_count":vg.get("pv_count",""),
                   "thin_lv_uuid":thin[0].get("lv_uuid",""),"thin_lv_size":thin[0].get("lv_size",""),
                   "thin_lv_type":attr[0:1],"thin_lv_active":attr[4:5],"os_pv":os_pv}
          pre = json.loads(open("/tmp/p5c2_p5b_pre_{{ inventory_hostname }}.json").read())
          if pre != canon: print("P5B_MUTATED_FINAL"); sys.exit(1)
          print(f"P5B_POST_OK {host}")
          PYEOF
      register: p5bpost
      changed_when: false

    # ═══ PHASE 22 — final Piraeus/LINSTOR production-state Gate ═══
    - name: PHASE 22 — final production state (operator/linstor/ifaces/nodeconnection/pool/sc)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, re
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          lk = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","piraeus-datastore","exec","deploy/linstor-controller","--"]
          op = json.loads(subprocess.run(KC+["-n","piraeus-datastore","get","deployment","piraeus-operator-controller-manager","-o","json"], capture_output=True, text=True).stdout)
          if op.get("status",{}).get("readyReplicas")!=1: print("OP_NOT_READY"); sys.exit(1)
          nc = json.loads(subprocess.run(KC+["-n","piraeus-datastore","get","linstornodeconnection","p5c2-drbd-vlan141","-o","json"], capture_output=True, text=True).stdout)
          conds = {c.get("type"): c.get("status") for c in nc.get("status",{}).get("conditions",[])}
          if conds.get("Configured")!="True": print("NC_NOT_CONFIGURED"); sys.exit(1)
          for node, ip in {"node-01":"172.30.141.101","node-02":"172.30.141.102","node-03":"172.30.141.103"}.items():
              r = subprocess.run(lk+["linstor","node","interface","list",node], capture_output=True, text=True)
              raw = re.sub(r"\x1b\[[0-9;]*m","", r.stdout)
              if "drbd141" not in raw or ip not in raw: print(f"IFACE_FAIL {node}"); sys.exit(1)
          sp = subprocess.run(lk+["linstor","storage-pool","list"], capture_output=True, text=True)
          raw = re.sub(r"\x1b\[[0-9;]*m","", sp.stdout)
          pts = [l for l in raw.splitlines() if "piraeus-thin" in l and l.strip().startswith("|")]
          if len(pts)!=3: print("POOL_NOT_3OF3"); sys.exit(1)
          sc = subprocess.run(KC+["get","storageclass","piraeus-r2"], capture_output=True, text=True)
          if sc.returncode!=0: print("SC_MISSING"); sys.exit(1)
          print("FINAL_PRODUCTION_STATE_OK")
          PYEOF
      register: finalprod
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 23 — full P1-P4 POST + P4B fingerprint compare ═══
    - name: PHASE 23 — P1 POST
      ansible.builtin.shell:
        cmd: |
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] && [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_POST_FAIL"; exit 1; }
          echo "P1_POST_OK"
      register: p1post
      changed_when: false

    - name: PHASE 23 — P2 POST
      ansible.builtin.shell:
        cmd: |
          sw=$(cat /proc/swaps 2>/dev/null | grep -vc 'Filename')
          [ "$sw" = "0" ] || { echo "P2_POST_FAIL"; exit 1; }
          echo "P2_POST_OK"
      register: p2post
      changed_when: false

    - name: PHASE 23 — P3 POST
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          if h.stdout.count("is healthy")!=3: print("P3_POST_FAIL"); sys.exit(1)
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          if rz.stdout.strip()!="ok": print("P3_POST_FAIL_READYZ"); sys.exit(1)
          print("P3_POST_OK")
          PYEOF
      register: p3post
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: PHASE 23 — P4A POST
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          nodes = json.loads(subprocess.run(KC+["get","nodes","-o","json"], capture_output=True, text=True).stdout)
          n = [x for x in nodes.get("items",[]) if all(c.get("status")=="True" for c in x.get("status",{}).get("conditions",[]) if c.get("type")=="Ready")]
          calico = json.loads(subprocess.run(KC+["get","pods","-n","kube-system","-l","k8s-app=calico-node","-o","json"], capture_output=True, text=True).stdout)
          cp = [p for p in calico.get("items",[]) if p.get("status",{}).get("phase")=="Running"]
          if len(n)!=3 or len(cp)!=3: print("P4A_POST_FAIL"); sys.exit(1)
          print("P4A_POST_OK")
          PYEOF
      register: p4apost
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: PHASE 23 — P4B POST fingerprint compare
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation"], capture_output=True, text=True)
          nf = "NotFound" in r.stderr or r.returncode != 0
          rp = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          items = json.loads(rp.stdout).get("items",[])
          fp = hashlib.sha256(json.dumps(items, sort_keys=True).encode()).hexdigest()
          pre_fp = open("/tmp/p5c2_p4b_fp.txt").read().strip()
          if not nf or fp != pre_fp: print("P4B_POST_FAIL"); sys.exit(1)
          print(f"P4B_POST_OK fp_unchanged={fp==pre_fp}")
          PYEOF
      register: p4bpost
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: FINAL — P5C2 storage bind + CSI validation complete
      ansible.builtin.debug:
        msg: "P5C2 storage bind and replicated CSI validation completed"
