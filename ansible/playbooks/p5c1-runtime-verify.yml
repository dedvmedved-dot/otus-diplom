    # ═══ K8s storage boundary (structural) ═══
    - name: K8S-STORAGE-GATE — SC/PV/PVC structural semantic filter
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"KUBECTL_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          KW = ("linstor","piraeus","drbd","linbit")
          def rel(s): return any(k in str(s).lower() for k in KW)
          sc = kget("get","storageclass"); pv = kget("get","pv"); pvc = kget("get","pvc","-A")
          sc_rel = [i["metadata"]["name"] for i in sc.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("provisioner",""))]
          pv_rel = [i["metadata"]["name"] for i in pv.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("spec",{}).get("storageClassName","")) or rel(i.get("spec",{}).get("csi",{}).get("driver","")) or rel(json.dumps(i.get("spec",{}).get("csi",{})))]
          pvc_rel = [i["metadata"]["name"] for i in pvc.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("spec",{}).get("storageClassName",""))]
          print(f"project_sc={len(sc_rel)} project_pv={len(pv_rel)} project_pvc={len(pvc_rel)}")
          if sc_rel or pv_rel or pvc_rel: print("PROJECT_STORAGE_PRESENT"); sys.exit(1)
          print("K8S_STORAGE_GATE_OK")
          PYEOF
      register: k8sgate
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ D19 — image digest executable gate ═══
    - name: IMAGE-DIGEST-GATE — runtime imageID matches images.lock (15 entries)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, re
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","piraeus-datastore"]
          # images.lock expected digests (P5C1 verified:true entries)
          EXPECT = {
            "piraeus-operator": "sha256:25f9218209eadce0e4fff8ab13ca64b1f0fae3cab9ac5f44026eaaa5c929d438",
            "piraeus-server": "sha256:c7da2b35b5ce08dff31480d6951597fd479798831da318976f5bfbec6a47cd04",
            "piraeus-csi": "sha256:d79ebfa7e9ade09b49cbb60bce32c726b025033e786c9e3d8b99feb9191f3a4e",
            "drbd9-resolute": "sha256:9a7941e4e6e8fe750cc732753fdc4eb61a526506244bd4ac3d03d79ea272627c",
            "drbd-reactor": "sha256:0f22aa4c277231b4cb800b0f292da68c77913f6d03c7f1029312f8a00251aa93",
            "piraeus-ha-controller": "sha256:5faa4a59f990293a398c3cdee069ae7c03ecfd8c026f5a12c8eb72c0e3e1d06b",
            "drbd-shutdown-guard": "sha256:a4adba73d07f6ba2605d0594676df47ab143e004991caadea3b7b556ead2db6e",
            "linstor-affinity-controller": "sha256:9d9873a94c21aa7dba402d3ff745b45241f5b5d9a8123872f50648e007034f4c",
            "csi-attacher": "sha256:b74b05b39501565022883fc128002b4cb857a7bb6c858606bcb3fdedba0b0b80",
            "csi-provisioner": "sha256:6be9f63ca4caa6c46aae55aa372500949d8a21473d72f819da1f746076b32d4e",
            "csi-snapshotter": "sha256:da081c27e8a6d91f36042c1942362d0515ced8d06e18c11b8f893e58c4d6d797",
            "csi-resizer": "sha256:589e525cddef6d768e68da1f0bc9ffd0a24bf3add3dd010648eb7189976fde79",
            "csi-node-driver-registrar": "sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70",
            "livenessprobe": "sha256:c4cc074199c045dd73ab85f28897e2a32f4d6f38ffdba4f3b13b8007ccbd3570",
            "csi-external-health-monitor-controller": "sha256:25925b16d02f21949a5ac55f8c120e81acdf204fe3d1a1ae1ae3653392bd56ba",
          }
          r = subprocess.run(KC+["get","pods","-o","json"], capture_output=True, text=True)
          if r.returncode != 0: print("IMAGE_DIGEST_FAIL"); sys.exit(1)
          pods = json.loads(r.stdout).get("items",[])
          runtime = set()
          for p in pods:
              for c in p.get("status",{}).get("containerStatuses",[])+p.get("status",{}).get("initContainerStatuses",[]):
                  iid = c.get("imageID","")
                  m = re.search(r'(sha256:[0-9a-f]{64})', iid)
                  if m: runtime.add(m.group(1))
          matched = 0; mismatched = []
          for comp, dgst in EXPECT.items():
              if dgst in runtime:
                  matched += 1
              else:
                  mismatched.append(comp)
          print(f"image_digest matched={matched}/15 mismatched={mismatched}")
          if matched != 15: print("IMAGE_DIGEST_GATE_FAIL"); sys.exit(1)
          print("IMAGE_DIGEST_GATE_OK")
          PYEOF
      register: imggate
      changed_when: false
      run_once: true
      delegate_to: node-01

