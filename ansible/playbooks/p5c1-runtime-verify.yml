    # ═══ K8s storage boundary (structural) ═══
    - name: K8S-STORAGE-GATE — SC/PV/PVC structural semantic filter
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"KUBECTL_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          KW = ("linstor","piraeus","drbd","linbit")
          def rel(s): return any(k in str(s).lower() for k in KW)
          sc = kget("get","storageclass"); pv = kget("get","pv"); pvc = kget("get","pvc","-A")
          sc_rel = [i["metadata"]["name"] for i in sc.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("provisioner",""))]
          pv_rel = [i["metadata"]["name"] for i in pv.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("spec",{}).get("storageClassName","")) or rel(i.get("spec",{}).get("csi",{}).get("driver","")) or rel(json.dumps(i.get("spec",{}).get("csi",{})))]
          pvc_rel = [i["metadata"]["name"] for i in pvc.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("spec",{}).get("storageClassName",""))]
          print(f"project_sc={len(sc_rel)} project_pv={len(pv_rel)} project_pvc={len(pvc_rel)}")
          if sc_rel or pv_rel or pvc_rel: print("PROJECT_STORAGE_PRESENT"); sys.exit(1)
          print("K8S_STORAGE_GATE_OK")
          PYEOF
      register: k8sgate
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ D19 — image digest executable gate (parse images.lock) ═══
    - name: IMAGE-DIGEST-GATE — copy images.lock to node-01 (read-only)
      ansible.builtin.copy:
        src: /root/otus-diplom/images.lock
        dest: /tmp/p5c1-images.lock
        mode: "0644"
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: IMAGE-DIGEST-GATE — runtime imageID matches images.lock (parse lock)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, re, urllib.request, urllib.error
          # expected digests MUST come from images.lock (single SoT), not embedded
          lock = open("/tmp/p5c1-images.lock").read()
          blocks = re.split(r'\n  - component:', lock)
          expected = {}
          for b in blocks[1:]:
              nm = b.strip().split('\n')[0].strip()
              dig = re.search(r'digest:\s*"?(sha256:[0-9a-f]{64})"?', b)
              img = re.search(r'image:\s*"?([^"\s]+)"?', b)
              tag = re.search(r'tag:\s*"?([^"\s]+)"?', b)
              ver = re.search(r'verified:\s*(true|false)', b)
              full = img.group(1).strip() if img else ""
              # P5C1 components only (exclude calico/kube-vip)
              if full.startswith("quay.io/piraeusdatastore/") or full.startswith("registry.k8s.io/sig-storage/"):
                  expected[nm] = {"digest": dig.group(1) if dig else None,
                                  "image": full,
                                  "tag": tag.group(1).strip() if tag else None,
                                  "verified": ver.group(1) if ver else None}
          # D8: complete mandatory key set — every derived P5C1 entry present, verified:true, image/tag/digest present
          for nm, e in expected.items():
              if e["verified"] != "true" or not e["image"] or not e["tag"] or not re.fullmatch(r"sha256:[0-9a-f]{64}", e["digest"] or ""):
                  print(f"IMAGES_LOCK_ENTRY_FAIL {nm}"); sys.exit(1)
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","piraeus-datastore"]
          r = subprocess.run(KC+["get","pods","-o","json"], capture_output=True, text=True)
          if r.returncode != 0: print("IMAGE_DIGEST_FAIL"); sys.exit(1)
          pods = json.loads(r.stdout).get("items",[])
          # runtime mapping: configured image -> imageID digest (per container/initContainer)
          runtime = []  # list of (image, digest, pod, container)
          for p in pods:
              for c in p.get("spec",{}).get("containers",[])+p.get("spec",{}).get("initContainers",[]):
                  runtime.append({"image": c.get("image",""), "pod": p["metadata"]["name"], "digest": None})
              for c in p.get("status",{}).get("containerStatuses",[])+p.get("status",{}).get("initContainerStatuses",[]):
                  img = c.get("image",""); iid = c.get("imageID","")
                  m = re.search(r'(sha256:[0-9a-f]{64})', iid)
                  if img and m:
                      runtime.append({"image": img, "digest": m.group(1), "pod": p["metadata"]["name"]})
          # D9: component-bound running binding + registry-bound non-running proof
          running_bound = 0; non_running = []
          for nm, e in sorted(expected.items()):
              exp_img = f"{e['image']}:{e['tag']}"
              exp_dig = e["digest"]
              bound = [x for x in runtime if x.get("image")==exp_img and x.get("digest")==exp_dig]
              if bound:
                  running_bound += 1
                  print(f"  {nm}: {exp_img} -> {exp_dig} RUNNING_BOUND {len(bound)} container(s)")
              else:
                  non_running.append((nm, e))
                  print(f"  {nm}: {exp_img} -> {exp_dig} NON_RUNNING")
          print(f"RUNNING_COMPONENTS={running_bound} NON_RUNNING={[n for n,_ in non_running]}")
          # D9: non-running required components must be registry-bound (exact image/tag/digest + linux/amd64)
          def get_token(reg, repo):
              try:
                  urllib.request.urlopen(f"https://{reg}/v2/", timeout=20); return None
              except urllib.error.HTTPError as ex:
                  if ex.code != 401: raise
                  hdr = ex.headers.get("WWW-Authenticate","")
                  rm = re.search(r'realm="([^"]+)"', hdr)
                  if not rm: print(f"NO_REALM {reg}"); sys.exit(1)
                  sv = re.search(r'service="([^"]+)"', hdr)
                  service = sv.group(1) if sv else reg
                  url = f"{rm.group(1)}?service={service}&scope=repository:{repo}:pull"
                  with urllib.request.urlopen(url, timeout=20) as r2:
                      tok = json.loads(r2.read())
                  return tok.get("token") or tok.get("access_token")
          def amd64_digest(image_full, tag):
              reg, repo = image_full.split("/", 1)
              tok = get_token(reg, repo)
              hdrs = {"Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"}
              if tok: hdrs["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(f"https://{reg}/v2/{repo}/manifests/{tag}", headers=hdrs)
              with urllib.request.urlopen(req, timeout=30) as r3:
                  data = json.loads(r3.read())
                  cdig = r3.headers.get("Docker-Content-Digest")
              mt = data.get("mediaType","")
              if "index" in mt or "manifest.list" in mt:
                  for m in data.get("manifests",[]):
                      p = m.get("platform",{})
                      if p.get("os")=="linux" and p.get("architecture")=="amd64":
                          return m.get("digest")
                  return None
              return cdig
          for nm, e in non_running:
              dg = amd64_digest(e["image"], e["tag"])
              if dg != e["digest"]:
                  print(f"NON_RUNNING_REGISTRY_FAIL {nm} registry={dg} lock={e['digest']}"); sys.exit(1)
              print(f"  {nm}: REGISTRY_BOUND amd64={dg}")
          if running_bound + len(non_running) != len(expected):
              print("COMPONENT_IMAGE_DIGEST_GATE_FAIL"); sys.exit(1)
          print("COMPONENT_IMAGE_DIGEST_GATE_OK")
          PYEOF
      register: imggate
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ VLAN141 six-path gate ═══
    - name: VLAN141-GATE — six directed paths (per node)
      ansible.builtin.shell:
        cmd: |
          myip=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
          [ -n "$myip" ] || { echo "VLAN141_MISSING"; exit 1; }
          for tgt in 172.30.141.101 172.30.141.102 172.30.141.103; do
            [ "$tgt" = "$myip" ] && continue
            r=$(ping -c 1 -W 2 -I $myip $tgt 2>&1 | grep -c '1 received')
            [ "$r" = "1" ] || { echo "VLAN141_PATH_FAIL $myip->$tgt"; exit 1; }
          done
          echo "VLAN141_SIX_PATH_OK"
      register: v141gate
      changed_when: false

    # ═══ P5B LVM POST (D3: strict baseline assertion + semantic compare) ═══
    - name: P5B-BASELINE-POST — strict composite assertion + compare (per node)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, re
          host = "{{ inventory_hostname }}"
          expected = {{ p5b_candidates[inventory_hostname] | to_json }}
          os_pv = {{ os_pv_map[inventory_hostname] | to_json }}
          def run(cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0: print(f"CMD_FAIL {cmd}"); sys.exit(1)
              return json.loads(r.stdout)
          lb = run(["lsblk","--json","-b","-o","NAME,SERIAL,WWN,MODEL,SIZE,TYPE"])
          disks = [{"name": b.get("name",""),"serial": b.get("serial",""),"wwn": b.get("wwn",""),
                    "model": b.get("model",""),"size": b.get("size",""),"type": b.get("type","")}
                   for b in lb.get("blockdevices",[]) if b.get("type")=="disk"]
          def nw(w): return (w or "").strip().lower()
          def nm(m): return (m or "").strip().upper()
          resolved = []
          for cand in expected:
              m = [b for b in disks if b["type"]=="disk" and b["serial"]==cand["serial"] and nw(b["wwn"])==nw(cand["wwn"])
                   and nm(b["model"])==nm(cand["model"]) and str(b["size"])==str(cand["size"])]
              if len(m) != 1: print(f"CANDIDATE_MATCH_FAIL {cand['serial']}"); sys.exit(1)
              resolved.append(m[0])
          if len(set(r["name"] for r in resolved)) != 2: print("CANDIDATE_DUPLICATE"); sys.exit(1)
          pvs = run(["pvs","--reportformat","json","-o","pv_name,vg_name,pv_uuid,pv_size"])
          pvlist = pvs["report"][0]["pv"]
          vgs = run(["vgs","--reportformat","json","-o","vg_name,vg_uuid,vg_free,pv_count"])
          vglist = {v["vg_name"]: v for v in vgs["report"][0]["vg"]}
          lvs = run(["lvs","--reportformat","json","-o","vg_name,lv_name,lv_uuid,lv_attr,lv_size,data_percent,metadata_percent"])
          lvlist = lvs["report"][0]["lv"]
          expected_paths = set("/dev/"+r["name"] for r in resolved)
          path_to_uuid = {p["pv_name"]: p["pv_uuid"] for p in pvlist}
          actual_vg_paths = set(p["pv_name"] for p in pvlist if p["vg_name"]=="vg_piraeus")
          actual_vg_uuids = set(p["pv_uuid"] for p in pvlist if p["vg_name"]=="vg_piraeus")
          expected_uuids = set(path_to_uuid[p] for p in expected_paths if p in path_to_uuid)
          if expected_paths != actual_vg_paths: print("P5B_PV_PATH_SET_FAIL"); sys.exit(1)
          if expected_uuids != actual_vg_uuids: print("P5B_PV_UUID_SET_FAIL"); sys.exit(1)
          if len(actual_vg_paths) != 2 or len(actual_vg_uuids) != 2: print("P5B_PV_COUNT_FAIL"); sys.exit(1)
          os_pv_matches = [p for p in pvlist if p["pv_name"] == os_pv["path"]]
          if len(os_pv_matches) != 1: print(f"OS_PV_FOUND_FAIL {host}"); sys.exit(1)
          cand_paths = set("/dev/"+r["name"] for r in resolved)
          for p in pvlist:
              if p["pv_name"] == os_pv["path"]:
                  if p["vg_name"] != os_pv["vg"] or p["vg_name"] == "vg_piraeus": print("OS_PV_MAP_FAIL"); sys.exit(1)
              elif p["pv_name"] in cand_paths:
                  if p["vg_name"] != "vg_piraeus": print("CANDIDATE_NOT_IN_PIRAEUS"); sys.exit(1)
              else:
                  if p["vg_name"] == "vg_piraeus": print("NON_CANDIDATE_PV_IN_PIRAEUS"); sys.exit(1)
          vg = vglist.get("vg_piraeus")
          if vg is None: print("VG_PIRAEUS_MISSING"); sys.exit(1)
          vg_free_s = str(vg.get("vg_free","0"))
          vg_free_m = re.search(r'(\d+(?:[.,]\d+)?)', vg_free_s)
          vg_free = float(vg_free_m.group(1).replace(",", ".")) if vg_free_m else -1.0
          if vg_free <= 0: print("VG_FREE_ZERO"); sys.exit(1)
          thin = [l for l in lvlist if l["lv_name"]=="thin_piraeus" and l["vg_name"]=="vg_piraeus"]
          if len(thin) != 1: print("THIN_PIRAEUS_COUNT_FAIL"); sys.exit(1)
          attr = thin[0].get("lv_attr","")
          if attr[0:1] != "t": print("THIN_NOT_THINPOOL"); sys.exit(1)
          if attr[4:5] != "a": print("THIN_NOT_ACTIVE"); sys.exit(1)
          def pct(x):
              try: return float(str(x).replace(",", ".").strip())
              except: return None
          d_pct = pct(thin[0].get("data_percent","")); m_pct = pct(thin[0].get("metadata_percent",""))
          if d_pct is None or m_pct is None: print("THIN_PCT_UNPARSEABLE"); sys.exit(1)
          if not (0 <= d_pct < 100) or not (0 <= m_pct < 100): print("THIN_PCT_OUT_OF_RANGE"); sys.exit(1)
          print(f"P5B_BASELINE_ASSERT_OK {host}")
          canon_post = {
            "host": host,
            "candidate_paths": sorted(expected_paths),
            "candidate_pv_uuids": sorted(expected_uuids),
            "candidate_serial_wwn_model_size": sorted([r["serial"], r["wwn"], r["model"], str(r["size"])] for r in resolved),
            "vg_piraeus_uuid": vg.get("vg_uuid",""),
            "vg_pv_count": vg.get("pv_count",""),
            "thin_lv_uuid": thin[0].get("lv_uuid",""),
            "thin_lv_size": thin[0].get("lv_size",""),
            "thin_lv_attr": attr,
            "thin_data_percent": thin[0].get("data_percent",""),
            "thin_metadata_percent": thin[0].get("metadata_percent",""),
            "os_pv": os_pv,
            "protected_pv_in_piraeus": False,
          }
          pre = json.loads(open("/tmp/p5c1_verify_canon_pre_{{ inventory_hostname }}.json").read())
          if pre != canon_post:
              print("P5B_LVM_MUTATED"); sys.exit(1)
          print("P5B_COMPOSITE_COMPARE_OK")
          PYEOF
      register: lvmcmpgate
      changed_when: false

    # ═══ P1 POST ═══
    - name: P1 POST — bond slaves + exact VLAN + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_POST_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_POST_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_POST_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_POST_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_POST_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_POST_FAIL default"; exit 1; }
          echo "P1_POST_OK"
      register: p1post
      changed_when: false

    # ═══ P2 POST ═══
    - name: P2 POST — containerd + kubelet + swap
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i Version | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_POST_FAIL"; exit 1; }
          echo "P2_POST_OK"
      register: p2post
      changed_when: false

    # ═══ VIP POST ═══
    - name: VIP-POST — local count + aggregate ==1
      ansible.builtin.shell:
        cmd: |
          c=$(ip -4 -o addr show dev bond0.140 2>/dev/null | awk '/172.30.140.100\/32/{c++} END{print c+0}')
          echo "vip_owner_local=$c"
          [ "$c" = "0" ] || [ "$c" = "1" ] || { echo "VIP_LOCAL_BAD"; exit 1; }
      register: vippost
      changed_when: false

    - name: VIP-AGG-POST — aggregate owner count == 1
      ansible.builtin.shell:
        cmd: |
          total={{ groups['all'] | map('extract', hostvars, 'vippost') | select('defined') | map(attribute='stdout') | regex_replace('vip_owner_local=','') | map('int') | sum }}
          [ "$total" = "1" ] || { echo "VIP_AGG_FAIL"; exit 1; }
          echo "VIP_AGG_POST_OK"
      register: vipaggpost
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ P3 POST ═══
    - name: P3 POST — etcd JSON + kube-vip Running+Ready + readyz/livez
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          if ml.returncode != 0: print("P3_FAIL"); sys.exit(1)
          members = json.loads(ml.stdout).get("members",[])
          mlearn = sum(1 for m in members if m.get("isLearner"))
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0: print("P3_FAIL"); sys.exit(1)
          eps = json.loads(st.stdout)
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          if h.returncode != 0: print("P3_FAIL"); sys.exit(1)
          healthy = h.stdout.count("is healthy")
          kvo = subprocess.run(KC+["get","pods","-n","kube-system","-o","json"], capture_output=True, text=True)
          if kvo.returncode != 0: print("P3_FAIL"); sys.exit(1)
          kv = [p for p in json.loads(kvo.stdout).get("items",[]) if p.get("metadata",{}).get("name","").startswith("kube-vip-")]
          def pod_ready(p):
              rcs = [c for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              if rcs: return rcs[0].get("status")=="True"
              css = p.get("status",{}).get("containerStatuses",[])
              return bool(css) and all(c.get("ready",False) for c in css)
          kv_running = sum(1 for p in kv if p.get("status",{}).get("phase")=="Running")
          kv_ready = sum(1 for p in kv if pod_ready(p))
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          if rz.returncode != 0: print("P3_FAIL"); sys.exit(1)
          rzok = rz.stdout.strip()
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append((r.returncode, r.stdout.strip()))
          ok_livez = sum(1 for rc,v in livez if rc==0 and v=="ok")
          if len(members)!=3 or mlearn!=0 or len(eps)!=3 or elearn!=0 or len(leaders)!=1 or aep!=1 or healthy!=3 or len(kv)!=3 or kv_running!=3 or kv_ready!=3 or rzok!="ok" or ok_livez!=3:
              print("P3_FAIL"); sys.exit(1)
          print("P3_POST_OK")
          PYEOF
      register: p3post
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ P4A POST ═══
    - name: P4A POST — Nodes/calico/CoreDNS/IPPool/BGP/autodetect
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"P4A_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          def ready_cond(obj):
              rcs = [c for c in obj.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              return len(rcs) == 1 and rcs[0].get("status") == "True"
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if ready_cond(n))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if ready_cond(p))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if ready_cond(p))
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas"); dns_avail = dns["status"].get("availableReplicas",0); dns_ready = dns["status"].get("readyReplicas",0)
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          if len(pools) != 1: print("P4A_FAIL ippool_count"); sys.exit(1)
          p = pools[0]
          ipok = (p["spec"].get("cidr")=="10.244.0.0/16" and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True and not p["spec"].get("disabled",False))
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          if ready!=3 or cn!=3 or cctrl!=1 or dns_des!=2 or dns_avail!=2 or dns_ready!=2 or not ipok or not bgpok or not admok:
              print("P4A_FAIL"); sys.exit(1)
          print("P4A_POST_OK")
          PYEOF
      register: p4apost
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ P4B POST + fingerprint compare ═══
    - name: P4B POST — validation ns NotFound + fingerprint compare
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_FAIL ns exists"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout: print("P4B_FAIL ns query"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_FAIL np"); sys.exit(1)
          items = json.loads(np.stdout).get("items",[])
          canon = []
          for i in items:
              meta = i.get("metadata",{})
              spec_norm = json.dumps(i.get("spec",{}), sort_keys=True, separators=(",",":"))
              canon.append({"ns": meta.get("namespace",""), "name": meta.get("name",""),
                            "uid": meta.get("uid",""), "gen": meta.get("generation",0),
                            "sha": hashlib.sha256(spec_norm.encode()).hexdigest()})
          canon.sort(key=lambda x: (x["ns"], x["name"]))
          fp = hashlib.sha256(json.dumps(canon, sort_keys=True).encode()).hexdigest()
          pre = open("/tmp/p4b_np_fp_pre.txt").read().strip()
          if fp != pre: print("P4B_FP_MISMATCH"); sys.exit(1)
          print(f"P4B_POST_OK fp_unchanged total={len(items)}")
          PYEOF
      register: p4bpost
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ FINAL ═══
    - name: FINAL — P5C1 runtime verification complete
      ansible.builtin.debug:
        msg: "P5C1 runtime read-only verification completed (all gates PASS)"
      run_once: true
      delegate_to: node-01
