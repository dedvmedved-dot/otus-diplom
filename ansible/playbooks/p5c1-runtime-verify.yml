---
# p5c1-runtime-verify.yml
# TASK-017-R2: READ-ONLY runtime verification with FAIL-CLOSED ASSERTION gates.
# THE ONLY playbook executed in R2. changed=0 failed=0 unreachable=0 required.
#
# Every gate ASSERTS exact state (not observation-only). API/parse error => FAIL.
#
# Order: P1-P4 PRE, P5B LVM PRE, runtime assertion gates (operator/linstorcluster/
# controller/satellites/csi/drbd/toleration/lbmakeopts/linstor-boundary/k8s-storage/
# image-digest/vlan141), P5B LVM POST+compare, P1-P4 POST, P4B fingerprint, FINAL.

- name: "P5C1 runtime read-only verification (TASK-017-R5)"
  hosts: all
  gather_facts: false
  become: true
  vars:
    op_ns: piraeus-datastore
    p1_expected:
      node-01: { bond140: "172.30.140.101/24", bond141: "172.30.141.101/24", bond143: "172.30.143.101/24", bond700: "192.168.194.38/24" }
      node-02: { bond140: "172.30.140.102/24", bond141: "172.30.141.102/24", bond143: "172.30.143.102/24", bond700: "192.168.194.40/24" }
      node-03: { bond140: "172.30.140.103/24", bond141: "172.30.141.103/24", bond143: "172.30.143.103/24", bond700: "192.168.194.39/24" }
    p5b_candidates:
      node-01: [{ serial: "S5G0NC0T407845", wwn: "0x5002538b724752b0", model: "MZILT3T8HBLS/007", size: 3840755982336 },
                { serial: "S5G0NC0T407844", wwn: "0x5002538b724752a0", model: "MZILT3T8HBLS/007", size: 3840755982336 }]
      node-02: [{ serial: "S5G0NC0T407077", wwn: "0x5002538b724722b0", model: "MZILT3T8HBLS/007", size: 3840755982336 },
                { serial: "S5G0NC0T407075", wwn: "0x5002538b72472290", model: "MZILT3T8HBLS/007", size: 3840755982336 }]
      node-03: [{ serial: "S5G0NC0T403246", wwn: "0x5002538b72453970", model: "MZILT3T8HBLS/007", size: 3840755982336 },
                { serial: "S5G0NC0T403289", wwn: "0x5002538b72453c20", model: "MZILT3T8HBLS/007", size: 3840755982336 }]
    os_pv_map:
      node-01: { path: "/dev/sda3", vg: "astra38644" }
      node-02: { path: "/dev/sda3", vg: "astra39539" }
      node-03: { path: "/dev/sda3", vg: "astra03718" }
  tasks:
    # ═══ P1 PRE ═══
    - name: P1 PRE — bond slaves + exact VLAN + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_FAIL default"; exit 1; }
          echo "P1_PRE_OK"
      register: p1pre
      changed_when: false

    # ═══ P2 PRE ═══
    - name: P2 PRE — containerd + kubelet + swap
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i Version | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_FAIL"; exit 1; }
          echo "P2_PRE_OK"
      register: p2pre
      changed_when: false

    # ═══ P3 PRE ═══
    - name: P3 PRE — etcd JSON + kube-vip Running+Ready + VIP + readyz/livez
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          if ml.returncode != 0: print("P3_FAIL ml"); sys.exit(1)
          members = json.loads(ml.stdout).get("members",[])
          mlearn = sum(1 for m in members if m.get("isLearner"))
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0: print("P3_FAIL st"); sys.exit(1)
          eps = json.loads(st.stdout)
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          if h.returncode != 0: print("P3_FAIL health"); sys.exit(1)
          healthy = h.stdout.count("is healthy")
          kvo = subprocess.run(KC+["get","pods","-n","kube-system","-o","json"], capture_output=True, text=True)
          if kvo.returncode != 0: print("P3_FAIL kv"); sys.exit(1)
          kv = [p for p in json.loads(kvo.stdout).get("items",[]) if p.get("metadata",{}).get("name","").startswith("kube-vip-")]
          def pod_ready(p):
              # Ready condition (static pod may or may not have it); fallback containerStatuses all ready
              rcs = [c for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              if rcs: return rcs[0].get("status")=="True"
              css = p.get("status",{}).get("containerStatuses",[])
              return bool(css) and all(c.get("ready",False) for c in css)
          kv_running = sum(1 for p in kv if p.get("status",{}).get("phase")=="Running")
          kv_ready = sum(1 for p in kv if pod_ready(p))
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          if rz.returncode != 0: print("P3_FAIL readyz"); sys.exit(1)
          rzok = rz.stdout.strip()
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append((r.returncode, r.stdout.strip()))
          ok_livez = sum(1 for rc,v in livez if rc==0 and v=="ok")
          print(f"members={len(members)} mlearn={mlearn} endpoints={len(eps)} elearn={elearn} leaders={len(leaders)} aep={aep} health={healthy} kube-vip={len(kv)} running={kv_running} ready={kv_ready} readyz={rzok} livez={ok_livez}/3")
          if len(members)!=3 or mlearn!=0 or len(eps)!=3 or elearn!=0 or len(leaders)!=1 or aep!=1 or healthy!=3 or len(kv)!=3 or kv_running!=3 or kv_ready!=3 or rzok!="ok" or ok_livez!=3:
              print("P3_FAIL"); sys.exit(1)
          print("P3_PRE_OK")
          PYEOF
      register: p3pre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ VIP owner PRE ═══
    - name: VIP-PRE — local VIP count + aggregate owner ==1
      ansible.builtin.shell:
        cmd: |
          c=$(ip -4 -o addr show dev bond0.140 2>/dev/null | awk '/172.30.140.100\/32/{c++} END{print c+0}')
          echo "vip_owner_local=$c"
          [ "$c" = "0" ] || [ "$c" = "1" ] || { echo "VIP_LOCAL_BAD"; exit 1; }
      register: vippre
      changed_when: false

    - name: VIP-AGG-PRE — aggregate owner count == 1
      ansible.builtin.shell:
        cmd: |
          total={{ groups['all'] | map('extract', hostvars, 'vippre') | select('defined') | map(attribute='stdout') | regex_replace('vip_owner_local=','') | map('int') | sum }}
          [ "$total" = "1" ] || { echo "VIP_AGG_FAIL"; exit 1; }
          echo "VIP_AGG_PRE_OK"
      register: vipaggpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ P4A PRE ═══
    - name: P4A PRE — Nodes/calico/CoreDNS/IPPool/BGP/autodetect (exact Ready)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"P4A_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          def ready_cond(obj):
              rcs = [c for c in obj.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              return len(rcs) == 1 and rcs[0].get("status") == "True"
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if ready_cond(n))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if ready_cond(p))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if ready_cond(p))
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas"); dns_avail = dns["status"].get("availableReplicas",0); dns_ready = dns["status"].get("readyReplicas",0)
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          if len(pools) != 1: print("P4A_FAIL ippool_count"); sys.exit(1)
          p = pools[0]
          ipok = (p["spec"].get("cidr")=="10.244.0.0/16" and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True and not p["spec"].get("disabled",False))
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          print(f"nodes={ready} calico={cn} ctrl={cctrl} coredns={dns_des}/{dns_avail}/{dns_ready} ippool={ipok} bgp={bgpok} autodetect={admok}")
          if ready!=3 or cn!=3 or cctrl!=1 or dns_des!=2 or dns_avail!=2 or dns_ready!=2 or not ipok or not bgpok or not admok:
              print("P4A_FAIL"); sys.exit(1)
          print("P4A_PRE_OK")
          PYEOF
      register: p4apre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ P4B PRE ═══
    - name: P4B PRE — validation ns NotFound + fingerprint
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_FAIL ns exists"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout: print("P4B_FAIL ns query"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_FAIL np"); sys.exit(1)
          items = json.loads(np.stdout).get("items",[])
          canon = []
          for i in items:
              meta = i.get("metadata",{})
              spec_norm = json.dumps(i.get("spec",{}), sort_keys=True, separators=(",",":"))
              canon.append({"ns": meta.get("namespace",""), "name": meta.get("name",""),
                            "uid": meta.get("uid",""), "gen": meta.get("generation",0),
                            "sha": hashlib.sha256(spec_norm.encode()).hexdigest()})
          canon.sort(key=lambda x: (x["ns"], x["name"]))
          fp = hashlib.sha256(json.dumps(canon, sort_keys=True).encode()).hexdigest()
          open("/tmp/p4b_np_fp_pre.txt","w").write(fp)
          print(f"P4B_PRE_OK total={len(items)} fp={fp}")
          PYEOF
      register: p4bpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ P5B LVM PRE (D3: strict baseline assertion) ═══
    - name: P5B-BASELINE-PRE — strict composite assertion (per node)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, re
          host = "{{ inventory_hostname }}"
          expected = {{ p5b_candidates[inventory_hostname] | to_json }}
          os_pv = {{ os_pv_map[inventory_hostname] | to_json }}
          def run(cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0: print(f"CMD_FAIL {cmd}"); sys.exit(1)
              return json.loads(r.stdout)
          # composite hardware resolution
          lb = run(["lsblk","--json","-b","-o","NAME,SERIAL,WWN,MODEL,SIZE,TYPE"])
          disks = []
          for b in lb.get("blockdevices",[]):
              if b.get("type") == "disk":
                  disks.append({"name": b.get("name",""),"serial": b.get("serial",""),"wwn": b.get("wwn",""),
                                "model": b.get("model",""),"size": b.get("size",""),"type": b.get("type","")})
          def nw(w): return (w or "").strip().lower()
          def nm(m): return (m or "").strip().upper()
          resolved = []
          for cand in expected:
              m = [b for b in disks if b["type"]=="disk" and b["serial"]==cand["serial"] and nw(b["wwn"])==nw(cand["wwn"])
                   and nm(b["model"])==nm(cand["model"]) and str(b["size"])==str(cand["size"])]
              if len(m) != 1:
                  print(f"CANDIDATE_MATCH_FAIL {cand['serial']} n={len(m)}"); sys.exit(1)
              resolved.append(m[0])
          if len(set(r["name"] for r in resolved)) != 2:
              print(f"CANDIDATE_DUPLICATE"); sys.exit(1)
          pvs = run(["pvs","--reportformat","json","-o","pv_name,vg_name,pv_uuid,pv_size"])
          pvlist = pvs["report"][0]["pv"]
          vgs = run(["vgs","--reportformat","json","-o","vg_name,vg_uuid,vg_free,pv_count"])
          vglist = {v["vg_name"]: v for v in vgs["report"][0]["vg"]}
          lvs = run(["lvs","--reportformat","json","-o","vg_name,lv_name,lv_uuid,lv_attr,lv_size,data_percent,metadata_percent"])
          lvlist = lvs["report"][0]["lv"]
          expected_paths = set("/dev/"+r["name"] for r in resolved)
          path_to_uuid = {p["pv_name"]: p["pv_uuid"] for p in pvlist}
          actual_vg_paths = set(p["pv_name"] for p in pvlist if p["vg_name"]=="vg_piraeus")
          actual_vg_uuids = set(p["pv_uuid"] for p in pvlist if p["vg_name"]=="vg_piraeus")
          expected_uuids = set(path_to_uuid[p] for p in expected_paths if p in path_to_uuid)
          # PV membership exact
          if expected_paths != actual_vg_paths:
              print(f"P5B_PV_PATH_SET_FAIL"); sys.exit(1)
          if expected_uuids != actual_vg_uuids:
              print(f"P5B_PV_UUID_SET_FAIL"); sys.exit(1)
          if len(actual_vg_paths) != 2 or len(actual_vg_uuids) != 2:
              print(f"P5B_PV_COUNT_FAIL"); sys.exit(1)
          # OS PV existence + exact map + non-candidate exclusion
          os_pv_matches = [p for p in pvlist if p["pv_name"] == os_pv["path"]]
          if len(os_pv_matches) != 1:
              print(f"OS_PV_FOUND_FAIL {host} matches={len(os_pv_matches)}"); sys.exit(1)
          cand_paths = set("/dev/"+r["name"] for r in resolved)
          for p in pvlist:
              if p["pv_name"] == os_pv["path"]:
                  if p["vg_name"] != os_pv["vg"] or p["vg_name"] == "vg_piraeus":
                      print(f"OS_PV_MAP_FAIL"); sys.exit(1)
              elif p["pv_name"] in cand_paths:
                  if p["vg_name"] != "vg_piraeus":
                      print(f"CANDIDATE_NOT_IN_PIRAEUS"); sys.exit(1)
              else:
                  if p["vg_name"] == "vg_piraeus":
                      print(f"NON_CANDIDATE_PV_IN_PIRAEUS"); sys.exit(1)
          # vg_piraeus exactly once, VG free parseable > 0
          vg = vglist.get("vg_piraeus")
          if vg is None: print("VG_PIRAEUS_MISSING"); sys.exit(1)
          vg_free_s = str(vg.get("vg_free","0"))
          vg_free_m = re.search(r'(\d+(?:[.,]\d+)?)', vg_free_s)
          vg_free = float(vg_free_m.group(1).replace(",", ".")) if vg_free_m else -1.0
          if vg_free <= 0: print("VG_FREE_ZERO"); sys.exit(1)
          # thin_piraeus exactly once, thin-pool type, active, data/meta% parseable
          thin = [l for l in lvlist if l["lv_name"]=="thin_piraeus" and l["vg_name"]=="vg_piraeus"]
          if len(thin) != 1: print("THIN_PIRAEUS_COUNT_FAIL"); sys.exit(1)
          attr = thin[0].get("lv_attr","")
          if attr[0:1] != "t": print("THIN_NOT_THINPOOL"); sys.exit(1)
          if attr[4:5] != "a": print("THIN_NOT_ACTIVE"); sys.exit(1)
          def pct(x):
              try: return float(str(x).replace(",",".").strip())
              except: return None
          d_pct = pct(thin[0].get("data_percent","")); m_pct = pct(thin[0].get("metadata_percent",""))
          if d_pct is None or m_pct is None: print("THIN_PCT_UNPARSEABLE"); sys.exit(1)
          if not (0 <= d_pct < 100) or not (0 <= m_pct < 100): print("THIN_PCT_OUT_OF_RANGE"); sys.exit(1)
          # emit canonical state
          canon = {
            "host": host,
            "candidate_paths": sorted(expected_paths),
            "candidate_pv_uuids": sorted(expected_uuids),
            "candidate_serial_wwn_model_size": sorted([r["serial"], r["wwn"], r["model"], str(r["size"])] for r in resolved),
            "vg_piraeus_uuid": vg.get("vg_uuid",""),
            "vg_pv_count": vg.get("pv_count",""),
            "thin_lv_uuid": thin[0].get("lv_uuid",""),
            "thin_lv_size": thin[0].get("lv_size",""),
            "thin_lv_attr": attr,
            "thin_data_percent": thin[0].get("data_percent",""),
            "thin_metadata_percent": thin[0].get("metadata_percent",""),
            "os_pv": os_pv,
            "protected_pv_in_piraeus": False,
          }
          open("/tmp/p5c1_verify_canon_pre_{{ inventory_hostname }}.json","w").write(json.dumps(canon, sort_keys=True))
          print(f"P5B_BASELINE_ASSERT_OK {host}")
          PYEOF
      register: lvmpre
      changed_when: false

    # ═══ D7 — OPERATOR assertion gate ═══
    - name: OPERATOR-GATE — desired=1 available=1 ready=1 + pods Running/Ready
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","piraeus-datastore"]
          r = subprocess.run(KC+["get","deployment","piraeus-operator-controller-manager","-o","json"], capture_output=True, text=True)
          if r.returncode != 0: print("OPERATOR_API_FAIL"); sys.exit(1)
          d = json.loads(r.stdout)
          spec_r = d["spec"].get("replicas",0)
          avail = d.get("status",{}).get("availableReplicas",0)
          ready = d.get("status",{}).get("readyReplicas",0)
          img = d["spec"]["template"]["spec"]["containers"][0]["image"]
          pr = subprocess.run(KC+["get","pods","-l","app.kubernetes.io/component=piraeus-operator","-o","json"], capture_output=True, text=True)
          if pr.returncode != 0: print("OPERATOR_POD_FAIL"); sys.exit(1)
          pods = json.loads(pr.stdout).get("items",[])
          running = [p for p in pods if p.get("status",{}).get("phase")=="Running"]
          allready = all(all(c.get("ready",False) for c in p.get("status",{}).get("containerStatuses",[])) for p in running)
          print(f"operator desired={spec_r} available={avail} ready={ready} pods={len(pods)} running={len(running)} allready={allready} image={img}")
          if spec_r!=1 or avail!=1 or ready!=1 or len(running)!=1 or not allready or "v2.10.6" not in img:
              print("OPERATOR_GATE_FAIL"); sys.exit(1)
          print("OPERATOR_GATE_OK")
          PYEOF
      register: opgate
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: GENCERT-GATE — pod exactly 1 Running all Ready
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","piraeus-datastore"]
          r = subprocess.run(KC+["get","pods","-l","app.kubernetes.io/component=piraeus-operator-gencert","-o","json"], capture_output=True, text=True)
          if r.returncode != 0: print("GENCERT_FAIL"); sys.exit(1)
          pods = json.loads(r.stdout).get("items",[])
          running = [p for p in pods if p.get("status",{}).get("phase")=="Running"]
          allready = all(all(c.get("ready",False) for c in p.get("status",{}).get("containerStatuses",[])) for p in running)
          print(f"gencert pods={len(pods)} running={len(running)} allready={allready}")
          if len(running)!=1 or not allready: print("GENCERT_GATE_FAIL"); sys.exit(1)
          print("GENCERT_GATE_OK")
          PYEOF
      register: gencertgate
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ D8 — LinstorCluster assertion gate ═══
