    # ═══ P5B LVM POST + in-run compare ═══
    - name: P5B-LVM-POST — structural capture (per node)
      ansible.builtin.shell:
        cmd: |
          pvs --reportformat json -o pv_name,vg_name,pv_size,pv_uuid > /tmp/p5c1_verify_lvm_post_{{ inventory_hostname }}.json 2>&1
          vgs --reportformat json -o vg_name,vg_uuid,vg_size,vg_free,pv_count >> /tmp/p5c1_verify_lvm_post_{{ inventory_hostname }}.json 2>&1
          lvs --reportformat json -o vg_name,lv_name,lv_uuid,lv_attr,lv_size,data_percent,metadata_percent >> /tmp/p5c1_verify_lvm_post_{{ inventory_hostname }}.json 2>&1
          echo "P5B_LVM_POST_OK"
      register: lvmpost
      changed_when: false

    - name: P5B-LVM-COMPARE-GATE — in-run structural compare (per node)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, sys
          def load(path):
              try:
                  with open(path) as f:
                      # files contain 3 concatenated JSON objects; extract pv/vg/lv by markers
                      txt = f.read()
              except: print("LVM_READ_FAIL"); sys.exit(1)
              # parse each json object via json.JSONDecoder raw scan
              objs = []
              dec = json.JSONDecoder()
              i = 0
              while i < len(txt):
                  while i < len(txt) and txt[i] not in '[{': i += 1
                  if i >= len(txt): break
                  try:
                      obj, j = dec.raw_decode(txt, i)
                      objs.append(obj); i = j
                  except: i += 1
              # find pvs/vgs/lvs by shape
              pv = vg = lv = None
              for o in objs:
                  for rep in o.get("report",[]):
                      for rec in rep.get("pv",[]):
                          if pv is None: pv = rec
                      for rec in rep.get("vg",[]):
                          if vg is None: vg = rec
                      for rec in rep.get("lv",[]):
                          if lv is None: lv = rec
              return pv, vg, lv
          def canon(pv, vg, lv):
              return (
                tuple(sorted(str(x.get("pv_uuid","")) for x in pv)) if isinstance(pv, list) else (str(pv.get("pv_uuid","")),),
                str(vg.get("vg_uuid","")) if vg else "",
                str(vg.get("pv_count","")) if vg else "",
                tuple(sorted(str(x.get("lv_uuid","")) for x in lv)) if isinstance(lv, list) else (str(lv.get("lv_uuid","")),),
                tuple(sorted(str(x.get("lv_size","")) for x in lv)) if isinstance(lv, list) else (str(lv.get("lv_size","")),),
              )
          pv1,vg1,lv1 = load("/tmp/p5c1_verify_lvm_pre_{{ inventory_hostname }}.json")
          pv2,vg2,lv2 = load("/tmp/p5c1_verify_lvm_post_{{ inventory_hostname }}.json")
          c1 = canon(pv1,vg1,lv1); c2 = canon(pv2,vg2,lv2)
          if c1 != c2:
              print("P5B_LVM_MUTATED"); sys.exit(1)
          print("P5B_LVM_COMPARE_OK")
          PYEOF
      register: lvmcmpgate
      changed_when: false

    # ═══ P1 POST ═══
