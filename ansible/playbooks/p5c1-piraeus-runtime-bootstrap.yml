---
# p5c1-piraeus-runtime-bootstrap.yml
# TASK-017 / P5C1: Piraeus Operator + LINSTOR + CSI + DRBD 9.3.2 runtime bootstrap.
# TASK-017-R2: complete self-contained stage workflow (phases 0-17, fail-closed).
#
# p5c1_mode: disabled (default) | authorized-runtime-bootstrap.
# ONLY authorized-runtime-bootstrap permits mutation.
# PRE gates complete before first kubectl apply. Mutation only after PRE PASS.
# POST/LVM regression before final PASS. No storage pool, no SC/PV/PVC, no DRBD data.
# P5B vg_piraeus/thin_piraeus strictly READ-ONLY.
#
# NOTE: R2 MUST NOT execute this bootstrap playbook (static audit only).

- name: "P5C1 Piraeus/DRBD runtime bootstrap (AUTHORIZED)"
  hosts: all
  gather_facts: false
  become: true
  vars:
    p5c1_mode: "disabled"
    p5c1_authorized_baseline: ""
    op_ns: piraeus-datastore
    p1_expected:
      node-01: { bond140: "172.30.140.101/24", bond141: "172.30.141.101/24", bond143: "172.30.143.101/24", bond700: "192.168.194.38/24" }
      node-02: { bond140: "172.30.140.102/24", bond141: "172.30.141.102/24", bond143: "172.30.143.102/24", bond700: "192.168.194.40/24" }
      node-03: { bond140: "172.30.140.103/24", bond141: "172.30.141.103/24", bond143: "172.30.143.103/24", bond700: "192.168.194.39/24" }
    # P5B composite identity (from inventory/storage-p5b-authorized-devices.yaml, read-only)
    p5b_candidates:
      node-01: [{ serial: "S5G0NC0T407845", wwn: "0x5002538b724752b0", model: "MZILT3T8HBLS/007", size: 3840755982336 },
                { serial: "S5G0NC0T407844", wwn: "0x5002538b724752a0", model: "MZILT3T8HBLS/007", size: 3840755982336 }]
      node-02: [{ serial: "S5G0NC0T407077", wwn: "0x5002538b724722b0", model: "MZILT3T8HBLS/007", size: 3840755982336 },
                { serial: "S5G0NC0T407075", wwn: "0x5002538b72472290", model: "MZILT3T8HBLS/007", size: 3840755982336 }]
      node-03: [{ serial: "S5G0NC0T403246", wwn: "0x5002538b72453970", model: "MZILT3T8HBLS/007", size: 3840755982336 },
                { serial: "S5G0NC0T403289", wwn: "0x5002538b72453c20", model: "MZILT3T8HBLS/007", size: 3840755982336 }]
    protected_pv_vg_prefix: "astra"
    # OS PV exact map (protected, must never enter vg_piraeus)
    os_pv_map:
      node-01: { path: "/dev/sda3", vg: "astra38644" }
      node-02: { path: "/dev/sda3", vg: "astra39539" }
      node-03: { path: "/dev/sda3", vg: "astra03718" }
  tasks:
    # ═══ PHASE 0 — mode + git baseline gate (Hermes control host) ═══
    - name: PHASE 0 — p5c1_mode + authorized baseline + git rev-parse + clean tree
      ansible.builtin.shell:
        cmd: |
          if [ "{{ p5c1_mode }}" != "authorized-runtime-bootstrap" ]; then
            echo "P5C1_MODE_DENIED p5c1_mode={{ p5c1_mode }}"
            exit 1
          fi
          bl="{{ p5c1_authorized_baseline }}"
          echo "$bl" | grep -qE '^[0-9a-f]{40}$' || { echo "BASELINE_MALFORMED"; exit 1; }
          head=$(git rev-parse HEAD 2>/dev/null)
          echo "baseline=$bl head=$head"
          [ "$head" = "$bl" ] || { echo "GIT_BASELINE_MISMATCH"; exit 1; }
          dirty=$(git status --porcelain 2>/dev/null)
          if [ -n "$dirty" ]; then echo "GIT_TREE_DIRTY"; echo "$dirty"; exit 1; fi
          echo "P5C1_GIT_BASELINE_OK"
      register: ph0
      changed_when: false
      run_once: true
      delegate_to: localhost
      become: false
      args:
        chdir: /root/otus-diplom

    # ═══ PHASE 1 — full P1-P4 PRE ═══
    - name: PHASE 1 — P1 PRE (bond slaves + exact VLAN + default route)
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_FAIL default"; exit 1; }
          echo "P1_PRE_OK"
      register: p1pre
      changed_when: false

    - name: PHASE 1 — P2 PRE (containerd + kubelet + swap)
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i Version | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_FAIL"; exit 1; }
          echo "P2_PRE_OK"
      register: p2pre
      changed_when: false

    - name: PHASE 1 — P3 PRE (etcd JSON + kube-vip + VIP + readyz/livez)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          if ml.returncode != 0: print("P3_FAIL"); sys.exit(1)
          members = json.loads(ml.stdout).get("members",[])
          mlearn = sum(1 for m in members if m.get("isLearner"))
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0: print("P3_FAIL"); sys.exit(1)
          eps = json.loads(st.stdout)
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          if h.returncode != 0: print("P3_FAIL"); sys.exit(1)
          healthy = h.stdout.count("is healthy")
          kvo = subprocess.run(KC+["get","pods","-n","kube-system","-o","json"], capture_output=True, text=True)
          if kvo.returncode != 0: print("P3_FAIL"); sys.exit(1)
          kv = [p for p in json.loads(kvo.stdout).get("items",[]) if p.get("metadata",{}).get("name","").startswith("kube-vip-")]
          def pod_ready(p):
              rcs = [c for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              if rcs: return rcs[0].get("status")=="True"
              css = p.get("status",{}).get("containerStatuses",[])
              return bool(css) and all(c.get("ready",False) for c in css)
          kv_running = sum(1 for p in kv if p.get("status",{}).get("phase")=="Running")
          kv_ready = sum(1 for p in kv if pod_ready(p))
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          if rz.returncode != 0: print("P3_FAIL"); sys.exit(1)
          rzok = rz.stdout.strip()
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append((r.returncode, r.stdout.strip()))
          ok_livez = sum(1 for rc,v in livez if rc==0 and v=="ok")
          if len(members)!=3 or mlearn!=0 or len(eps)!=3 or elearn!=0 or len(leaders)!=1 or aep!=1 or healthy!=3 or len(kv)!=3 or kv_running!=3 or kv_ready!=3 or rzok!="ok" or ok_livez!=3:
              print("P3_FAIL"); sys.exit(1)
          print("P3_PRE_OK")
          PYEOF
      register: p3pre
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: PHASE 1 — P4A PRE (Nodes/calico/CoreDNS/IPPool/BGP/autodetect)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"P4A_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          def ready_cond(obj):
              rcs = [c for c in obj.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              return len(rcs) == 1 and rcs[0].get("status") == "True"
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if ready_cond(n))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if ready_cond(p))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if ready_cond(p))
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas"); dns_avail = dns["status"].get("availableReplicas",0); dns_ready = dns["status"].get("readyReplicas",0)
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          if len(pools) != 1: print("P4A_FAIL ippool"); sys.exit(1)
          p = pools[0]
          ipok = (p["spec"].get("cidr")=="10.244.0.0/16" and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True and not p["spec"].get("disabled",False))
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          if ready!=3 or cn!=3 or cctrl!=1 or dns_des!=2 or dns_avail!=2 or dns_ready!=2 or not ipok or not bgpok or not admok:
              print("P4A_FAIL"); sys.exit(1)
          print("P4A_PRE_OK")
          PYEOF
      register: p4apre
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: PHASE 1 — P4B PRE (validation ns NotFound + fingerprint)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_FAIL ns"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout: print("P4B_FAIL ns query"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_FAIL np"); sys.exit(1)
          items = json.loads(np.stdout).get("items",[])
          canon = []
          for i in items:
              meta = i.get("metadata",{})
              spec_norm = json.dumps(i.get("spec",{}), sort_keys=True, separators=(",",":"))
              canon.append({"ns": meta.get("namespace",""), "name": meta.get("name",""),
                            "uid": meta.get("uid",""), "gen": meta.get("generation",0),
                            "sha": hashlib.sha256(spec_norm.encode()).hexdigest()})
          canon.sort(key=lambda x: (x["ns"], x["name"]))
          fp = hashlib.sha256(json.dumps(canon, sort_keys=True).encode()).hexdigest()
          open("/tmp/p5c1_p4b_fp_pre.txt","w").write(fp)
          print(f"P4B_PRE_OK total={len(items)} fp={fp}")
          PYEOF
      register: p4bpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: PHASE 1 — VIP owner PRE
      ansible.builtin.shell:
        cmd: |
          c=$(ip -4 -o addr show dev bond0.140 2>/dev/null | awk '/172.30.140.100\/32/{c++} END{print c+0}')
          echo "vip_owner_local=$c"
          [ "$c" = "0" ] || [ "$c" = "1" ] || { echo "VIP_LOCAL_BAD"; exit 1; }
      register: vippre
      changed_when: false

    - name: PHASE 1 — VIP aggregate PRE (==1)
      ansible.builtin.shell:
        cmd: |
          total={{ groups['all'] | map('extract', hostvars, 'vippre') | select('defined') | map(attribute='stdout') | regex_replace('vip_owner_local=','') | map('int') | sum }}
          [ "$total" = "1" ] || { echo "VIP_AGG_FAIL"; exit 1; }
          echo "VIP_AGG_PRE_OK total=$total"
      register: vipaggpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 2 — P5B composite precondition (field-by-field + exact PV set + protected + thin-type) ═══
    - name: PHASE 2 — P5B composite precondition (D1-D4 strict)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          host = "{{ inventory_hostname }}"
          expected = {{ p5b_candidates[inventory_hostname] | to_json }}
          os_pv = {{ os_pv_map[inventory_hostname] | to_json }}
          def run(cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"CMD_FAIL {cmd}"); sys.exit(1)
              return json.loads(r.stdout)
          # D1: field-by-field composite resolution (type+serial+wwn+model+exact size)
          lb = run(["lsblk","--json","-b","-o","NAME,SERIAL,WWN,MODEL,SIZE,TYPE"])
          disks = []
          for b in lb.get("blockdevices",[]):
              if b.get("type") == "disk":
                  disks.append({
                    "name": b.get("name",""),
                    "serial": b.get("serial",""),
                    "wwn": b.get("wwn",""),
                    "model": b.get("model",""),
                    "size": b.get("size",""),
                    "type": b.get("type",""),
                  })
          def normalize_wwn(w):
              return (w or "").strip().lower()
          def normalize_model(m):
              return (m or "").strip().upper()
          # match each expected candidate by ALL fields
          resolved = []
          for cand in expected:
              matches = []
              for b in disks:
                  ok_type = b["type"] == "disk"
                  ok_serial = b["serial"] == cand["serial"]
                  ok_wwn = normalize_wwn(b["wwn"]) == normalize_wwn(cand["wwn"])
                  ok_model = normalize_model(b["model"]) == normalize_model(cand["model"])
                  ok_size = str(b["size"]) == str(cand["size"])
                  if ok_type and ok_serial and ok_wwn and ok_model and ok_size:
                      matches.append(b)
              if len(matches) != 1:
                  print(f"CANDIDATE_MATCH_FAIL {cand['serial']} matches={len(matches)}"); sys.exit(1)
              resolved.append(matches[0])
          # ensure unique (no same device matched twice)
          devs = [r["name"] for r in resolved]
          if len(set(devs)) != 2:
              print(f"CANDIDATE_DUPLICATE {devs}"); sys.exit(1)
          print(f"P5B_COMPOSITE_RESOLVE_OK {host} 2/2 exact unique")
          # D2: exact PV membership (path set + UUID set equality)
          pvs = run(["pvs","--reportformat","json","-o","pv_name,vg_name,pv_uuid,pv_size"])
          pvlist = pvs["report"][0]["pv"]
          vgs = run(["vgs","--reportformat","json","-o","vg_name,vg_uuid,vg_free,pv_count"])
          vglist = {v["vg_name"]: v for v in vgs["report"][0]["vg"]}
          lvs = run(["lvs","--reportformat","json","-o","vg_name,lv_name,lv_uuid,lv_attr,lv_size,data_percent,metadata_percent"])
          lvlist = lvs["report"][0]["lv"]
          expected_paths = set("/dev/" + r["name"] for r in resolved)
          actual_vg_paths = set(p["pv_name"] for p in pvlist if p["vg_name"] == "vg_piraeus")
          actual_vg_uuids = set(p["pv_uuid"] for p in pvlist if p["vg_name"] == "vg_piraeus")
          # expected candidate PV UUIDs = UUIDs of the resolved paths
          path_to_uuid = {p["pv_name"]: p["pv_uuid"] for p in pvlist}
          expected_uuids = set(path_to_uuid[p] for p in expected_paths if p in path_to_uuid)
          if expected_paths != actual_vg_paths:
              print(f"P5B_PV_PATH_SET_FAIL expected={sorted(expected_paths)} actual={sorted(actual_vg_paths)}"); sys.exit(1)
          if expected_uuids != actual_vg_uuids:
              print(f"P5B_PV_UUID_SET_FAIL"); sys.exit(1)
          if len(actual_vg_paths) != 2 or len(actual_vg_uuids) != 2:
              print(f"P5B_PV_COUNT_FAIL paths={len(actual_vg_paths)} uuids={len(actual_vg_uuids)}"); sys.exit(1)
          print(f"P5B_EXACT_PV_SET_OK {host} 2/2")
          # D3: protected OS PV exact map + no protected PV in vg_piraeus + all non-candidate excluded
          cand_paths = set("/dev/" + r["name"] for r in resolved)
          os_pv_matches = [p for p in pvlist if p["pv_name"] == os_pv["path"]]
          if len(os_pv_matches) != 1:
              print(f"OS_PV_FOUND_FAIL {host} {os_pv['path']} matches={len(os_pv_matches)}"); sys.exit(1)
          for p in pvlist:
              if p["pv_name"] == os_pv["path"]:
                  if p["vg_name"] != os_pv["vg"] or p["vg_name"] == "vg_piraeus":
                      print(f"OS_PV_MAP_FAIL {p['pv_name']}->{p['vg_name']} want {os_pv['vg']}"); sys.exit(1)
              elif p["pv_name"] in cand_paths:
                  if p["vg_name"] != "vg_piraeus":
                      print(f"CANDIDATE_NOT_IN_PIRAEUS {p['pv_name']}->{p['vg_name']}"); sys.exit(1)
              else:
                  # non-candidate, non-OS PV must NOT be in vg_piraeus
                  if p["vg_name"] == "vg_piraeus":
                      print(f"NON_CANDIDATE_PV_IN_PIRAEUS {p['pv_name']}"); sys.exit(1)
          print(f"P5B_PROTECTED_PV_OK {host} os_pv={os_pv['path']}->{os_pv['vg']} found=1")
          # vg_piraeus VG free > 0
          vg = vglist.get("vg_piraeus")
          if vg is None: print("VG_PIRAEUS_MISSING"); sys.exit(1)
          vg_free_s = str(vg.get("vg_free","0"))
          vg_free_m = re.search(r'(\d+(?:[.,]\d+)?)', vg_free_s)
          vg_free = float(vg_free_m.group(1).replace(",", ".")) if vg_free_m else -1.0
          if vg_free <= 0:
              print(f"VG_FREE_ZERO vg_free={vg_free}"); sys.exit(1)
          # D4: exactly one thin_piraeus, assert thin-pool type + active + data%/meta% parseable
          thin = [l for l in lvlist if l["lv_name"] == "thin_piraeus" and l["vg_name"] == "vg_piraeus"]
          if len(thin) != 1:
              print(f"THIN_PIRAEUS_COUNT_FAIL={len(thin)}"); sys.exit(1)
          attr = thin[0].get("lv_attr","")
          # lv_attr: [0]=volume type ('t'=thin-pool), [4]=active state
          if attr[0:1] != "t":
              print(f"THIN_NOT_THINPOOL attr={attr}"); sys.exit(1)
          if attr[4:5] != "a":
              print(f"THIN_NOT_ACTIVE attr={attr}"); sys.exit(1)
          def pct(l):
              try:
                  v = float(str(l).replace(",",".").strip())
                  return v
              except: return None
          d_pct = pct(thin[0].get("data_percent",""))
          m_pct = pct(thin[0].get("metadata_percent",""))
          if d_pct is None or m_pct is None:
              print(f"THIN_PCT_UNPARSEABLE data={thin[0].get('data_percent','')} meta={thin[0].get('metadata_percent','')}"); sys.exit(1)
          if not (0 <= d_pct < 100) or not (0 <= m_pct < 100):
              print(f"THIN_PCT_OUT_OF_RANGE data={d_pct} meta={m_pct}"); sys.exit(1)
          print(f"P5B_THIN_POOL_OK {host} thin-pool active data%={d_pct} meta%={m_pct} vg_free={vg_free}")
          # emit canonical PRE state (with hardware composite identity)
          canon = {
            "host": host,
            "candidate_paths": sorted(expected_paths),
            "candidate_pv_uuids": sorted(actual_vg_uuids),
            "candidate_serial_wwn_model_size": sorted([r["serial"], r["wwn"], r["model"], str(r["size"])] for r in resolved),
            "vg_piraeus_uuid": vg.get("vg_uuid",""),
            "vg_pv_count": vg.get("pv_count",""),
            "thin_lv_uuid": thin[0].get("lv_uuid",""),
            "thin_lv_size": thin[0].get("lv_size",""),
            "thin_lv_attr": attr,
            "thin_data_percent": d_pct,
            "thin_metadata_percent": m_pct,
            "os_pv": os_pv,
            "protected_pv_in_piraeus": False,
          }
          open("/tmp/p5c1_p5b_canon_pre_{{ inventory_hostname }}.json","w").write(json.dumps(canon, sort_keys=True))
          print(f"P5B_PRECONDITION_OK {host}")
          PYEOF
      register: ph2
      changed_when: false

    # ═══ PHASE 3 — K8s storage baseline ═══
    - name: PHASE 3 — K8s storage baseline (project SC/PV/PVC = 0)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"KUBECTL_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          KW = ("linstor","piraeus","drbd","linbit")
          def rel(s): return any(k in str(s).lower() for k in KW)
          sc = kget("get","storageclass"); pv = kget("get","pv"); pvc = kget("get","pvc","-A")
          sc_rel = [i["metadata"]["name"] for i in sc.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("provisioner",""))]
          pv_rel = [i["metadata"]["name"] for i in pv.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("spec",{}).get("storageClassName","")) or rel(json.dumps(i.get("spec",{}).get("csi",{})))]
          pvc_rel = [i["metadata"]["name"] for i in pvc.get("items",[]) if rel(i["metadata"]["name"]) or rel(i.get("spec",{}).get("storageClassName",""))]
          if sc_rel or pv_rel or pvc_rel: print("BASELINE_STORAGE_PRESENT"); sys.exit(1)
          print("K8S_STORAGE_BASELINE_CLEAN")
          PYEOF
      register: k8sbase
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 4 — pinned source/version gate (versions.lock + vendored full image-config) ═══
    - name: PHASE 4 — pinned source gate (versions.lock + vendored image-config set equality)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import re, sys
          # 1) versions.lock
          lock = open("/root/otus-diplom/versions.lock").read()
          def get(name):
              m = re.search(r'^\s*'+name+r':\s*"?([^"\s]+)"?', lock, re.M)
              return m.group(1) if m else None
          want = {
            "linstor_operator": "2.10.6",
            "linstor": "1.33.2",
            "linstor_csi": "1.11.0",
            "drbd": "9.3.2",
            "drbd_utils": "9.34.3",
          }
          got = {k: get(k) for k in want}
          for k, v in want.items():
              if got[k] != v:
                  print(f"VERSION_LOCK_FAIL {k}={got[k]} want={v}"); sys.exit(1)
          print("versions.lock:", got)
          # 2) vendored manifest.yaml — enumerate EVERY image-config component (tag -> image)
          manifest = open("/root/otus-diplom/manifests/piraeus/v2.10.6/manifest.yaml").read()
          # every component has "tag:" immediately followed by "image:"; match sub-entries
          # (e.g. drbd9-almalinux8) have no tag, so they are correctly excluded.
          pairs = re.findall(r'tag:\s*"?(\S+)"?\s*\n(?:\s*#.*\n)*\s*image:\s*(\S+)', manifest)
          vendored_short = set((img.strip(), tag.strip()) for tag, img in pairs)
          # piraeus-operator image is hard-coded in the operator Deployment (not in image-config)
          op_img = re.search(r'image:\s*quay\.io/piraeusdatastore/piraeus-operator:(\S+)', manifest)
          if not op_img: print("VENDORED_OPERATOR_IMAGE_FAIL"); sys.exit(1)
          vendored_short.add(("piraeus-operator", op_img.group(1).strip()))
          # drbd-utils is NOT an image (utility inside piraeus-server): proof chain =
          #   versions.lock drbd_utils=9.34.3 + piraeus-server:v1.33.2 pinned/verified + runtime drbdadm=9.34.3
          print("vendored manifest images (short,tag):", sorted(vendored_short))
          # 3) images.lock P5C1 section — derive (short_image_name, tag) set.
          # P5C1 images live under quay.io/piraeusdatastore/ or registry.k8s.io/sig-storage/.
          # calico (quay.io/tigera, quay.io/calico) and kube-vip (ghcr.io) are excluded.
          ilock = open("/root/otus-diplom/images.lock").read()
          blocks = re.split(r'\n  - component:', ilock)
          lock_short = set()
          for b in blocks[1:]:
              nm = b.strip().split('\n')[0].strip()
              img = re.search(r'image:\s*"?([^"\s]+)"?', b)
              tag = re.search(r'tag:\s*"?([^"\s]+)"?', b)
              if img and tag:
                  full = img.group(1).strip()
                  if full.startswith("quay.io/piraeusdatastore/") or full.startswith("registry.k8s.io/sig-storage/"):
                      short = full.split('/')[-1]
                      lock_short.add((short, tag.group(1).strip()))
          print("images.lock P5C1 images (short,tag):", sorted(lock_short))
          if vendored_short != lock_short:
              only_mf = sorted(vendored_short - lock_short)
              only_lk = sorted(lock_short - vendored_short)
              print(f"IMAGE_SET_MISMATCH manifest_only={only_mf} lock_only={only_lk}"); sys.exit(1)
          print("PINNED_SOURCE_GATE_OK (versions.lock + vendored image-config == images.lock)")
          PYEOF
      register: ph4
      changed_when: false
      run_once: true
      delegate_to: localhost
      become: false

    # ═══ PHASE 5 — image supply gate (parse images.lock + registry manifest amd64 proof) ═══
    - name: PHASE 5 — image supply gate (parse images.lock verified:true + amd64 manifest)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import re, sys, json, urllib.request, urllib.error
          lock = open("/root/otus-diplom/images.lock").read()
          blocks = re.split(r'\n  - component:', lock)
          comps = {}
          for b in blocks[1:]:
              nm = b.strip().split('\n')[0].strip()
              dig = re.search(r'digest:\s*"?(sha256:[0-9a-f]{64})"?', b)
              ver = re.search(r'verified:\s*(true|false)', b)
              img = re.search(r'image:\s*"?([^"\s]+)"?', b)
              tag = re.search(r'tag:\s*"?([^"\s]+)"?', b)
              full = img.group(1).strip() if img else ""
              if full.startswith("quay.io/piraeusdatastore/") or full.startswith("registry.k8s.io/sig-storage/"):
                  comps[nm] = {"digest": dig.group(1) if dig else None,
                               "verified": ver.group(1) if ver else None,
                               "image": full,
                               "tag": tag.group(1).strip() if tag else None}
          # derived mandatory set == images.lock P5C1 entries. every entry must be verified:true + exact sha256.
          for nm, e in comps.items():
              if e["verified"] != "true" or not (e["digest"] and re.fullmatch(r"sha256:[0-9a-f]{64}", e["digest"])):
                  print(f"IMAGE_SUPPLY_FAIL {nm}"); sys.exit(1)
          def get_token(reg, repo):
              try:
                  urllib.request.urlopen(f"https://{reg}/v2/", timeout=20)
                  return None
              except urllib.error.HTTPError as ex:
                  if ex.code != 401: raise
                  hdr = ex.headers.get("WWW-Authenticate","")
                  rm = re.search(r'realm="([^"]+)"', hdr)
                  if not rm: print(f"NO_REALM {reg}"); sys.exit(1)
                  realm = rm.group(1)
                  sv = re.search(r'service="([^"]+)"', hdr)
                  service = sv.group(1) if sv else reg
                  url = f"{realm}?service={service}&scope=repository:{repo}:pull"
                  with urllib.request.urlopen(url, timeout=20) as r:
                      tok = json.loads(r.read())
                  return tok.get("token") or tok.get("access_token")
          def amd64_manifest_digest(image_full, tag):
              reg, repo = image_full.split("/", 1)
              tok = get_token(reg, repo)
              hdrs = {"Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"}
              if tok: hdrs["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(f"https://{reg}/v2/{repo}/manifests/{tag}", headers=hdrs)
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read())
                  content_digest = r.headers.get("Docker-Content-Digest")
              mt = data.get("mediaType","")
              if "index" in mt or "manifest.list" in mt:
                  for m in data.get("manifests",[]):
                      p = m.get("platform",{})
                      if p.get("os")=="linux" and p.get("architecture")=="amd64":
                          d = m.get("digest")
                          if not d: print(f"NO_AMD64_DIGEST {image_full}:{tag}"); sys.exit(1)
                          return d
                  print(f"NO_AMD64_PLATFORM {image_full}:{tag}"); sys.exit(1)
              else:
                  # single manifest: registry content digest MUST resolve (D7)
                  if not content_digest:
                      print(f"SINGLE_MANIFEST_NO_DIGEST {image_full}:{tag}"); sys.exit(1)
                  return content_digest
          print("image supply gate (all registries, linux/amd64, exact digest):")
          for nm, e in sorted(comps.items()):
              try:
                  dg = amd64_manifest_digest(e["image"], e["tag"])
              except Exception as ex:
                  print(f"  {nm} {e['image']}:{e['tag']} REGISTRY_QUERY_FAIL {ex}"); sys.exit(1)
              if dg != e["digest"]:
                  print(f"  {nm} DIGEST_MISMATCH registry={dg} lock={e['digest']}"); sys.exit(1)
              print(f"  {nm} {e['image']}:{e['tag']} amd64={dg} MATCH")
          print("IMAGE_SUPPLY_GATE_OK (all registries + all required + linux/amd64 + exact digest)")
          PYEOF
      register: ph5
      changed_when: false
      run_once: true
      delegate_to: localhost
      become: false

    # ═══ PHASE 6 — copy + apply exact v2.10.6 operator manifest ═══
    - name: PHASE 6 — copy vendored manifest.yaml to node-01
      ansible.builtin.copy:
        src: /root/otus-diplom/manifests/piraeus/v2.10.6/manifest.yaml
        dest: /tmp/piraeus-v2.10.6-manifest.yaml
        mode: "0644"
      run_once: true
