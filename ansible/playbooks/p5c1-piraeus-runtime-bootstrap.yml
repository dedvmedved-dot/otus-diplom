---
# p5c1-piraeus-runtime-bootstrap.yml
# TASK-017 / P5C1: Piraeus Operator + LINSTOR + CSI + DRBD 9.3.2 runtime bootstrap.
# TASK-017-R1: source hardened for reproducibility (fail-closed, committed patches).
#
# p5c1_mode: disabled (default) | authorized-runtime-bootstrap.
# ONLY authorized-runtime-bootstrap permits Kubernetes runtime mutation.
# No storage pool binding, no SC/PV/PVC, no DRBD data resource (that is P5C2).
# P5B vg_piraeus/thin_piraeus is strictly READ-ONLY in P5C1.
#
# NOTE: R1 MUST NOT execute this bootstrap playbook (static audit only).

- name: "P5C1 Piraeus/DRBD runtime bootstrap (AUTHORIZED)"
  hosts: all
  gather_facts: false
  become: true
  vars:
    p5c1_mode: "disabled"
    op_ns: piraeus-datastore
  tasks:
    # ═══ PHASE 0 — mode gate ═══
    - name: PHASE 0 — p5c1_mode gate
      ansible.builtin.shell:
        cmd: |
          if [ "{{ p5c1_mode }}" != "authorized-runtime-bootstrap" ]; then
            echo "P5C1_MODE_DENIED p5c1_mode={{ p5c1_mode }}"
            exit 1
          fi
          echo "p5c1_mode={{ p5c1_mode }} AUTHORIZED"
      register: ph0
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 6 — copy + apply exact v2.10.6 operator manifest ═══
    - name: PHASE 6 — copy vendored manifest.yaml to node-01
      ansible.builtin.copy:
        src: /root/otus-diplom/manifests/piraeus/v2.10.6/manifest.yaml
        dest: /tmp/piraeus-v2.10.6-manifest.yaml
        mode: "0644"
      run_once: true
      delegate_to: node-01

    - name: PHASE 6 — apply Operator v2.10.6 manifest
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/piraeus-v2.10.6-manifest.yaml 2>&1
      register: ph6
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 6A — committed control-plane toleration patches ═══
    - name: PHASE 6A — copy control-plane toleration patches
      ansible.builtin.copy:
        src: "/root/otus-diplom/manifests/piraeus/p5c1-operator-control-plane-patches/"
        dest: "/tmp/p5c1-operator-control-plane-patches/"
        mode: "0644"
      run_once: true
      delegate_to: node-01

    - name: PHASE 6A — apply operator + gencert toleration patches
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/p5c1-operator-control-plane-patches/operator-controller-manager-toleration.yaml 2>&1
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/p5c1-operator-control-plane-patches/operator-gencert-toleration.yaml 2>&1
      register: ph6a
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 7 — fail-closed Operator/CRD Ready ═══
    - name: PHASE 7 — verify CRDs established (fail-closed)
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf get crd | grep -E 'linstor|piraeus' || exit 1
          for crd in linstorclusters.piraeus.io linstorsatellites.piraeus.io linstorsatelliteconfigurations.piraeus.io linstornodeconnections.piraeus.io; do
            est=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get crd $crd -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null)
            echo "$crd Established=$est"
            [ "$est" = "True" ] || exit 1
          done
      register: ph7
      run_once: true
      delegate_to: node-01

    - name: PHASE 7 — wait operator deployment available (fail-closed)
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} wait --for=condition=Available deployment/piraeus-operator-controller-manager --timeout=300s 2>&1 || exit 1
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} get pods -o wide 2>&1
      register: ph7b
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 8A — apply DRBD loader LB_MAKEOPTS configuration ═══
    - name: PHASE 8A — copy DRBD loader LB_MAKEOPTS manifest
      ansible.builtin.copy:
        src: /root/otus-diplom/manifests/piraeus/p5c1-drbd-loader-makeopts.yaml
        dest: /tmp/p5c1-drbd-loader-makeopts.yaml
        mode: "0644"
      run_once: true
      delegate_to: node-01

    - name: PHASE 8A — apply LinstorSatelliteConfiguration (LB_MAKEOPTS)
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/p5c1-drbd-loader-makeopts.yaml 2>&1 || exit 1
      register: ph8a
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 8B — apply minimal LinstorCluster ═══
    - name: PHASE 8B — copy LinstorCluster manifest
      ansible.builtin.copy:
        src: /root/otus-diplom/manifests/piraeus/p5c1-linstorcluster.yaml
        dest: /tmp/p5c1-linstorcluster.yaml
        mode: "0644"
      run_once: true
      delegate_to: node-01

    - name: PHASE 8B — apply minimal LinstorCluster
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/p5c1-linstorcluster.yaml 2>&1 || exit 1
      register: ph8b
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 9 — fail-closed controller/satellite/CSI Ready ═══
    - name: PHASE 9 — wait controller available (fail-closed)
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} wait --for=condition=Available deployment/linstor-controller --timeout=300s 2>&1 || exit 1
      register: ph9
      run_once: true
      delegate_to: node-01

    - name: PHASE 9 — wait satellites exactly 3 Ready (fail-closed)
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} wait --for=condition=Ready pod -l app.kubernetes.io/component=linstor-satellite --timeout=900s 2>&1 || exit 1
          n=$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} get pods -l app.kubernetes.io/component=linstor-satellite --no-headers 2>/dev/null | grep -c '1/1\|2/2\|3/3\|4/4')
          echo "satellite_ready=$n"
          [ "$n" = "3" ] || { echo "SATELLITE_COUNT_FAIL"; exit 1; }
      register: ph9b
      run_once: true
      delegate_to: node-01

    - name: PHASE 9 — wait CSI controller Available + csi-node 3 Ready (fail-closed)
      ansible.builtin.shell:
        cmd: |
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} wait --for=condition=Available deployment/linstor-csi-controller --timeout=300s 2>&1 || exit 1
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} wait --for=condition=Ready pod -l app.kubernetes.io/component=linstor-csi-node --timeout=900s 2>&1 || exit 1
          n=$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} get pods -l app.kubernetes.io/component=linstor-csi-node --no-headers 2>/dev/null | grep -c 'Running')
          echo "csi_node_ready=$n"
          [ "$n" = "3" ] || { echo "CSI_NODE_COUNT_FAIL"; exit 1; }
      register: ph9c
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 10 — exact DRBD runtime gate (per node) ═══
    - name: PHASE 10 — DRBD 9.3.2 runtime exact gate (per node)
      ansible.builtin.shell:
        cmd: |
          sys_mod=$([ -e /sys/module/drbd ] && echo present || echo absent)
          ver=$(cat /sys/module/drbd/version 2>/dev/null || echo MISSING)
          src=$(cat /sys/module/drbd/srcversion 2>/dev/null || echo MISSING)
          lsmod_c=$(lsmod | awk '/^drbd /{c++} END{print c+0}')
          tcp_c=$(lsmod | awk '/^drbd_transport_tcp /{c++} END{print c+0}')
          uname_r=$(uname -r)
          mi_rc=0; mi_out=$(modinfo drbd 2>/dev/null) || mi_rc=$?
          mi_ver=$(echo "$mi_out" | grep '^version:' | awk '{print $2}')
          mi_vm=$(echo "$mi_out" | grep '^vermagic:' | awk '{$1=""; print substr($0,2)}')
          mi_src=$(echo "$mi_out" | grep '^srcversion:' | awk '{print $2}')
          echo "host=$(hostname) sys_module=$sys_mod version=$ver srcversion=$src lsmod_drbd=$lsmod_c tcp=$tcp_c uname=$uname_r"
          echo "modinfo_rc=$mi_rc modinfo_version=$mi_ver vermagic=$mi_vm modinfo_srcversion=$mi_src"
          [ "$sys_mod" = "present" ] || { echo "DRBD_NOT_LOADED"; exit 1; }
          [ "$ver" = "9.3.2" ] || { echo "DRBD_VERSION_FAIL"; exit 1; }
          [ "$lsmod_c" != "0" ] || { echo "DRBD_LSMOD_ZERO"; exit 1; }
          [ "$tcp_c" != "0" ] || { echo "DRBD_TCP_MISSING"; exit 1; }
          [ "$uname_r" = "6.1.158-1-generic" ] || { echo "UNAME_FAIL"; exit 1; }
          [ "$mi_rc" = "0" ] || { echo "MODINFO_FAIL"; exit 1; }
          if [ -n "$mi_src" ] && [ "$src" = "$mi_src" ]; then echo "DRBD_OLD_8.4.11_LOADED"; exit 1; fi
          case "$mi_vm" in 6.1.158-1-generic*) ;; *) echo "VERMAGIC_FAIL"; exit 1;; esac
          echo "DRBD_RUNTIME_OK"
      register: ph10
      changed_when: false

    # ═══ PHASE 11 — LINSTOR/drbd-utils/CSI version gate ═══
    - name: PHASE 11 — version mapping gate (fail-closed)
      ansible.builtin.shell:
        cmd: |
          lv=$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ op_ns }} exec deploy/linstor-controller -- linstor controller version 2>&1 | grep -o 'linstor controller [0-9.]*' | awk '{print $3}')
          echo "linstor_controller_version=$lv"
          [ "$lv" = "1.33.2" ] || { echo "LINSTOR_VERSION_FAIL"; exit 1; }
      register: ph11
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 12 — no project pools/resources ═══
    - name: PHASE 12 — no project diskful pool / DRBD resources (fail-closed)
      ansible.builtin.shell:
        cmd: |
          for o in $(kubectl --kubeconfig /etc/kubernetes/admin.conf get linstorsatelliteconfiguration -o name 2>/dev/null); do
            sp=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get $o -o jsonpath='{.spec.storagePools}' 2>/dev/null)
            hd=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get $o -o jsonpath='{.spec.patches}' 2>/dev/null)
            echo "$o storagePools=[$sp]"
            if [ -n "$sp" ] && [ "$sp" != "" ]; then echo "STORAGE_POOLS_PRESENT"; exit 1; fi
          done
          echo "NO_PROJECT_DISKFUL_POOL"
      register: ph12
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 14 — no project SC/PV/PVC ═══
    - name: PHASE 14 — no project SC/PV/PVC (fail-closed)
      ansible.builtin.shell:
        cmd: |
          sc=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get storageclass -o name 2>/dev/null | awk '/linstor/{c++} END{print c+0}')
          pv=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get pv -o name 2>/dev/null | awk '/linstor/{c++} END{print c+0}')
          pvc=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get pvc -A -o name 2>/dev/null | awk '/linstor/{c++} END{print c+0}')
          echo "project_sc=$sc project_pv=$pv project_pvc=$pvc"
          [ "$sc" = "0" ] && [ "$pv" = "0" ] && [ "$pvc" = "0" ] || { echo "PROJECT_STORAGE_PRESENT"; exit 1; }
          echo "NO_PROJECT_SC_PV_PVC"
      register: ph14
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 15 — VLAN141 read-only connectivity ═══
    - name: PHASE 15 — VLAN141 addresses read-only (per node)
      ansible.builtin.shell:
        cmd: |
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          echo "host=$(hostname) vlan141=$a141"
          [ -n "$a141" ] || { echo "VLAN141_MISSING"; exit 1; }
      register: ph15
      changed_when: false

    # ═══ PHASE 17 — final gate ═══
    - name: PHASE 17 — final gate summary
      ansible.builtin.debug:
        msg: "P5C1 Piraeus/DRBD runtime bootstrap completed"
      run_once: true
      delegate_to: node-01
