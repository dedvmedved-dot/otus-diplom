    # ═══ PHASE 12 — LINSTOR deterministic semantic parsers ═══
    - name: PHASE 12 — LINSTOR node list (exact node set Online)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import subprocess, sys, re
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf","-n","{{ op_ns }}","exec","deploy/linstor-controller","--"]
          out = subprocess.run(KC+["linstor","node","list"], capture_output=True, text=True)
          if out.returncode != 0: print("LINSTOR_NODE_CMD_FAIL"); sys.exit(1)
          raw = re.sub(r"\x1b\[[0-9;]*m","", out.stdout)
          lines = [l for l in raw.splitlines() if l.strip().startswith("|")]
          data = [l for l in lines if not l.strip().startswith("|=") and not l.strip().startswith("| Node") ]
          nodes = {}
          for l in data:
              cols = [c.strip() for c in l.strip("|").split("|")]
              if len(cols) >= 4:
                  nodes[cols[0]] = {"type": cols[1], "state": cols[3]}
          print(f"linstor_nodes={sorted(nodes.keys())}")
          expect = {"node-01","node-02","node-03"}
          if set(nodes.keys()) != expect:
              print(f"LINSTOR_NODE_SET_FAIL {sorted(nodes.keys())}"); sys.exit(1)
          for n in expect:
              if nodes[n].get("state") != "Online":
                  print(f"LINSTOR_NODE_NOT_ONLINE {n}={nodes[n]}"); sys.exit(1)
          print("LINSTOR_NODE_GATE_OK")
          PYEOF
      register: ph12
      run_once: true
      delegate_to: node-01

    - name: PHASE 12 — LINSTOR storage-pool deterministic (3 DfltDisklessStorPool, no diskful)
