---
# p1-network-activate.yml
# Активация P1 сети: D1 bond1+VLAN141 → D2 bond0+VLAN140 с local watchdog
# ВЫПОЛНЯТЬ ТОЛЬКО ПОСЛЕ switch-ready.
# Запуск: ansible-playbook -i inventory/hosts.yaml --ask-pass ansible/playbooks/p1-network-activate.yml

- name: P1 D1 — bond1 + VLAN141 (DRBD, безопасно — bond0 не трогаем)
  hosts: pak_portal
  serial: 2
  gather_facts: false
  become: false
  vars:
    run_id: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    evidence_root: "{{ playbook_dir }}/../../evidence/P1/{{ run_id }}/network"

  tasks:
    - name: Ensure evidence dir
      ansible.builtin.file:
        path: "{{ evidence_root }}"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Save preflight
      ansible.builtin.shell: |
        echo "=== bond0 ==="
        grep -E 'Mode|Slave|MII' /proc/net/bonding/bond0 2>/dev/null
        echo "=== ip ==="
        ip -br addr show | grep -v "^lo"
      register: preflight
      changed_when: false

    - name: Write preflight
      ansible.builtin.copy:
        dest: "{{ evidence_root }}/d1-pre-{{ inventory_hostname }}.txt"
        content: "{{ preflight.stdout }}"
      delegate_to: localhost

    - name: Activate bond1 slaves + bond1 + VLAN141
      ansible.builtin.shell: |
        nmcli con up 'bond1 port 1'
        nmcli con up 'bond1 port 2'
        nmcli con mod 'bond1 DRBD' bond.options 'mode=802.3ad,miimon=100'
        nmcli con up 'bond1 DRBD'
        nmcli con up 'VLAN 141 DRBD'
      changed_when: true

    - name: Verify bond1 UP
      ansible.builtin.command: "cat /sys/class/net/bond1/operstate"
      register: b1
      changed_when: false
      failed_when: b1.stdout != 'up'

    - name: Verify bond1 LACP established
      ansible.builtin.shell: |
        MODE=$(grep -oP 'Bonding Mode: \K.+' /proc/net/bonding/bond1)
        PARTNERS=$(grep -c 'Partner Churn State: monitoring' /proc/net/bonding/bond1)
        SLAVES_UP=$(grep -c 'MII Status: up' /proc/net/bonding/bond1)
        echo "MODE=$MODE PARTNERS=$PARTNERS SLAVES_UP=$SLAVES_UP"
        [ "$PARTNERS" -ge 1 ] && [ "$SLAVES_UP" -ge 2 ] || exit 1
      register: lacp1
      changed_when: false
      failed_when: lacp1.rc != 0

    - name: Save D1 postflight
      ansible.builtin.shell: |
        grep -E 'Mode|Slave|MII|Partner' /proc/net/bonding/bond1
      register: d1post
      changed_when: false

    - name: Write D1 evidence
      ansible.builtin.copy:
        dest: "{{ evidence_root }}/d1-post-{{ inventory_hostname }}.txt"
        content: |
          bond1 LACP: {{ lacp1.stdout }}
          {{ d1post.stdout }}
      delegate_to: localhost

- name: P1 D1b — DRBD connectivity (ping через Ansible, без sshpass)
  hosts: pak_portal
  serial: 2
  gather_facts: false
  become: false
  tasks:
    - name: Ping DRBD peer
      ansible.builtin.shell: |
        ping -c2 -W3 -I {{ drbd_ip }} {{ hostvars[item].drbd_ip }}
      loop: "{{ groups['pak_portal'] | difference([inventory_hostname]) }}"
      register: drbd_ping
      changed_when: false
      failed_when: "' 0% packet loss' not in drbd_ping.results[0].stdout"

# ═══════════════════════════════════════════════════════════════
# D2 — bond0 с local watchdog, по одному узлу
# ═══════════════════════════════════════════════════════════════

- name: P1 D2 — deploy watchdog
  hosts: pak_portal
  serial: 1
  gather_facts: false
  become: false
  tasks:
    - name: Copy watchdog
      ansible.builtin.copy:
        src: files/local-auto-rollback.sh
        dest: /usr/local/bin/local-auto-rollback.sh
        mode: "0755"

- name: P1 D2 — bond0 migration
  hosts: pak_portal
  serial: 1
  gather_facts: false
  become: false
  vars:
    run_id: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

  tasks:
    - name: Save pre-D2 state
      ansible.builtin.shell: |
        grep -E 'Mode|Slave|MII|Partner' /proc/net/bonding/bond0
      register: d2pre
      changed_when: false

    - name: ARM systemd-based auto-rollback
      ansible.builtin.command: /usr/local/bin/local-auto-rollback.sh arm
      changed_when: true

    - name: Verify watchdog armed
      ansible.builtin.command: /usr/local/bin/local-auto-rollback.sh status
      register: wd_status
      changed_when: false
      failed_when: "'ARMED: YES' not in wd_status.stdout"

    - name: Set bond0 mode 802.3ad
      ansible.builtin.command: "nmcli con mod 'Агрегированное соединение (bond) 1' bond.options 'mode=802.3ad,miimon=100'"
      changed_when: true

    - name: Reactivate bond0
      ansible.builtin.command: "nmcli con up 'Агрегированное соединение (bond) 1'"
      changed_when: true

    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 15

    - name: Activate VLAN 140
      ansible.builtin.command: "nmcli con up 'VLAN 140 Management'"
      changed_when: true

    - name: Verify bond0 + LACP + VLAN700 + VLAN140 (all-or-nothing gate)
      ansible.builtin.shell: |
        FAILS=0
        ip link show bond0 | grep -q "state UP" || FAILS=$((FAILS+1))
        test $(grep -c 'MII Status: up' /proc/net/bonding/bond0) -ge 2 || FAILS=$((FAILS+1))
        grep -q '802.3ad' /proc/net/bonding/bond0 || FAILS=$((FAILS+1))
        grep -q 'Partner Churn State: monitoring' /proc/net/bonding/bond0 || FAILS=$((FAILS+1))
        ip -br addr show bond0.700 | grep -q "192.168.194" || FAILS=$((FAILS+1))
        ping -c1 -W2 192.168.194.1 >/dev/null 2>&1 || FAILS=$((FAILS+1))
        ip -br addr show bond0.140 | grep -q "172.30.140" || FAILS=$((FAILS+1))
        ip route show default | grep -q "192.168.194.1" || FAILS=$((FAILS+1))
        [ "$FAILS" -eq 0 ] && echo "ALL_PASS" || echo "FAILS=$FAILS"
      register: validation
      changed_when: false
      failed_when: "'ALL_PASS' not in validation.stdout"

    - name: DISARM rollback
      ansible.builtin.command: /usr/local/bin/local-auto-rollback.sh verify
      changed_when: true

    - name: Save D2 postflight
      ansible.builtin.shell: |
        echo "=== bond0 ==="
        grep -E 'Mode|Slave|MII|Partner' /proc/net/bonding/bond0
        echo "=== bond1 ==="
        grep -E 'Mode|Slave|MII|Partner' /proc/net/bonding/bond1 2>/dev/null
        echo "=== ip ==="
        ip -br addr show | grep -v "^lo"
      register: d2post
      changed_when: false

    - name: Write D2 evidence
      ansible.builtin.copy:
        dest: "{{ evidence_root }}/d2-post-{{ inventory_hostname }}.txt"
        content: "{{ d2post.stdout }}"
      delegate_to: localhost
