---
# p5b-postverify.yml
# TASK-016-R3: READ-ONLY final semantic closure verification.
#
# Proves in order: P1 PRE, P2 PRE, P3 PRE (incl VIP owner), P4A PRE,
# P4B PRE (fingerprint), storage proofs, P1..P4 POST (incl VIP + P4B fingerprint).
#
# NO mutation. All kubectl/etcd/lvm rc + JSON fail-closed.

- name: "P5B final semantic read-only verification"
  hosts: all
  gather_facts: false
  become: true
  vars:
    model_want: "MZILT3T8HBLS/007"
    size_want: 3840755982336
    authorized_devices:
      node-01:
        vg: vg_piraeus
        thinpool: thin_piraeus
        os_pv_vg: astra38644
        devices:
          - { serial: "S5G0NC0T407845", wwn: "0x5002538b724752b0" }
          - { serial: "S5G0NC0T407844", wwn: "0x5002538b724752a0" }
      node-02:
        vg: vg_piraeus
        thinpool: thin_piraeus
        os_pv_vg: astra39539
        devices:
          - { serial: "S5G0NC0T407077", wwn: "0x5002538b724722b0" }
          - { serial: "S5G0NC0T407075", wwn: "0x5002538b72472290" }
      node-03:
        vg: vg_piraeus
        thinpool: thin_piraeus
        os_pv_vg: astra03718
        devices:
          - { serial: "S5G0NC0T403246", wwn: "0x5002538b72453970" }
          - { serial: "S5G0NC0T403289", wwn: "0x5002538b72453c20" }
    p1_expected:
      node-01: { bond140: "172.30.140.101/24", bond141: "172.30.141.101/24", bond143: "172.30.143.101/24", bond700: "192.168.194.38/24" }
      node-02: { bond140: "172.30.140.102/24", bond141: "172.30.141.102/24", bond143: "172.30.143.102/24", bond700: "192.168.194.40/24" }
      node-03: { bond140: "172.30.140.103/24", bond141: "172.30.141.103/24", bond143: "172.30.143.103/24", bond700: "192.168.194.39/24" }
  tasks:
    # ═══════════════ P1 PRE ═══════════════
    - name: P1 PRE — bond slaves + exact VLAN + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          echo "host=$(hostname) bond0=$b0 bond1=$b1 default_count=$drc"
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_PRE_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_PRE_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_PRE_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_PRE_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_PRE_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_PRE_FAIL default"; exit 1; }
          echo "P1_PRE_OK"
      register: p1pre
      changed_when: false

    # ═══════════════ P2 PRE ═══════════════
    - name: P2 PRE — containerd + kubelet + swap
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i Version | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          echo "host=$(hostname) containerd=$ctd kubelet=$klt swap=$sw"
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_PRE_FAIL"; exit 1; }
          echo "P2_PRE_OK"
      register: p2pre
      changed_when: false

    # ═══════════════ VIP owner per node (PRE) ═══════════════
    - name: VIP-OWNER-PRE — local bond0.140 172.30.140.100/32 count (0 or 1)
      ansible.builtin.shell:
        cmd: |
          c=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -c '172.30.140.100/32' || true)
          echo "vip_owner_local=$c"
          [ "$c" = "0" ] || [ "$c" = "1" ] || { echo "VIP_LOCAL_BAD"; exit 1; }
      register: vippre
      changed_when: false

    # ═══════════════ P3 PRE ═══════════════
    - name: P3 PRE — etcd JSON + kube-vip JSON + readyz/livez + VIP aggregate
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          if ml.returncode != 0: print("P3_FAIL member_list"); sys.exit(1)
          members = json.loads(ml.stdout).get("members",[])
          mlearn = sum(1 for m in members if m.get("isLearner"))
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0: print("P3_FAIL endpoint_status"); sys.exit(1)
          eps = json.loads(st.stdout)
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          if h.returncode != 0: print("P3_FAIL health"); sys.exit(1)
          healthy = h.stdout.count("is healthy")
          # structural kube-vip JSON-aware (static pods: no labels, owner Node)
          kvo = subprocess.run(KC+["get","pods","-n","kube-system","-o","json"], capture_output=True, text=True)
          if kvo.returncode != 0: print("P3_FAIL kube-vip query"); sys.exit(1)
          kv_items = [p for p in json.loads(kvo.stdout).get("items",[]) if p.get("metadata",{}).get("name","").startswith("kube-vip-")]
          kv_running = sum(1 for p in kv_items if p.get("status",{}).get("phase")=="Running")
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          if rz.returncode != 0: print("P3_FAIL readyz"); sys.exit(1)
          rzok = rz.stdout.strip()
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append((r.returncode, r.stdout.strip()))
          ok_livez = sum(1 for rc,v in livez if rc==0 and v=="ok")
          print(f"members={len(members)} mlearn={mlearn} endpoints={len(eps)} elearn={elearn} leaders={len(leaders)} aep={aep} health={healthy} kube-vip={len(kv_items)} running={kv_running} readyz={rzok} livez={ok_livez}/3")
          if len(members)!=3 or mlearn!=0 or len(eps)!=3 or elearn!=0 or len(leaders)!=1 or aep!=1 or healthy!=3 or len(kv_items)!=3 or kv_running!=3 or rzok!="ok" or ok_livez!=3:
              print("P3_FAIL"); sys.exit(1)
          print("P3_PRE_OK")
          PYEOF
      register: p3pre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ VIP aggregate (PRE) ═══════════════
    - name: VIP-AGG-PRE — aggregate owner count == 1
      ansible.builtin.shell:
        cmd: |
          total={{ groups['all'] | map('extract', hostvars, 'vippre') | select('defined') | map(attribute='stdout') | regex_replace('vip_owner_local=','') | map('int') | sum }}
          echo "vip_owner_aggregate=$total"
          [ "$total" = "1" ] || { echo "VIP_AGG_FAIL"; exit 1; }
      register: vipaggpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ P4A PRE ═══════════════
    - name: P4A PRE — Nodes/calico/CoreDNS/IPPool/BGP/autodetect (exact Ready)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"P4A_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          def ready_cond(obj):
              rcs = [c for c in obj.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              return len(rcs) == 1 and rcs[0].get("status") == "True"
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if ready_cond(n))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if ready_cond(p))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if ready_cond(p))
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas"); dns_avail = dns["status"].get("availableReplicas",0); dns_ready = dns["status"].get("readyReplicas",0)
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          if len(pools) != 1: print("P4A_FAIL ippool_count"); sys.exit(1)
          p = pools[0]
          ipok = (p["spec"].get("cidr")=="10.244.0.0/16" and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True and not p["spec"].get("disabled",False))
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          print(f"nodes={ready} calico={cn} ctrl={cctrl} coredns={dns_des}/{dns_avail}/{dns_ready} ippool={ipok} bgp={bgpok} autodetect={admok}")
          if ready!=3 or cn!=3 or cctrl!=1 or dns_des!=2 or dns_avail!=2 or dns_ready!=2 or not ipok or not bgpok or not admok:
              print("P4A_FAIL"); sys.exit(1)
          print("P4A_PRE_OK")
          PYEOF
      register: p4apre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ P4B PRE (fingerprint) ═══════════════
    - name: P4B PRE — validation ns NotFound + NetworkPolicy fingerprint
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_FAIL ns exists"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout:
              print(f"P4B_FAIL ns query rc={r.returncode}"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_FAIL np query"); sys.exit(1)
          items = json.loads(np.stdout).get("items",[])
          canon = []
          for i in items:
              meta = i.get("metadata",{})
              spec_norm = json.dumps(i.get("spec",{}), sort_keys=True, separators=(",",":"))
              canon.append({
                  "ns": meta.get("namespace",""),
                  "name": meta.get("name",""),
                  "uid": meta.get("uid",""),
                  "gen": meta.get("generation",0),
                  "sha": hashlib.sha256(spec_norm.encode()).hexdigest(),
              })
          canon.sort(key=lambda x: (x["ns"], x["name"]))
          fp = hashlib.sha256(json.dumps(canon, sort_keys=True).encode()).hexdigest()
          open("/tmp/p4b_np_fingerprint_pre.txt","w").write(fp)
          print(f"p4b_np_pre_total={len(items)} fingerprint={fp}")
          for c in canon:
              print(f"  {c['ns']}/{c['name']} uid={c['uid'][:8]} gen={c['gen']} sha={c['sha'][:16]}")
          print("P4B_PRE_OK")
          PYEOF
      register: p4bpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ COMPOSITE PV MAP ═══════════════
    - name: COMPOSITE-PV-MAP — composite resolver + PV membership (6/6)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {dev['serial']} n={len(hits)}"); sys.exit(1)
              return hits[0]
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print("PVS_FAIL"); sys.exit(1)
          pv_vg = {}
          for report in json.loads(pvs.stdout).get("report",[]):
              for rec in report.get("pv",[]):
                  pv_vg[rec.get("pv_name")] = rec.get("vg_name")
          for dev in auth["devices"]:
              d = resolve_now(dev); path = d["path"]
              vg = pv_vg.get(path)
              print(f"{path} serial={dev['serial']} wwn={dev['wwn']} model={model_want} size={size_want} -> VG={vg}")
              if vg != auth["vg"]: print(f"PV_VG_FAIL {path} vg={vg}"); sys.exit(1)
          print("COMPOSITE_PV_MAP_OK")
          PYEOF
      register: cpv
      changed_when: false

    # ═══════════════ VG EXACT MEMBERSHIP ═══════════════
    - name: VG-MEMBERSHIP — actual PV set == expected PV set (exact)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          vg = auth["vg"]
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {dev['serial']}"); sys.exit(1)
              return hits[0]["path"]
          expected = set(resolve_now(dev) for dev in auth["devices"])
          vgs = subprocess.run(["vgs","--reportformat","json"], capture_output=True, text=True)
          if vgs.returncode != 0: print("VGS_FAIL"); sys.exit(1)
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print("PVS_FAIL"); sys.exit(1)
          vg_count = 0; vg_free = None
          for report in json.loads(vgs.stdout).get("report",[]):
              for rec in report.get("vg",[]):
                  if rec.get("vg_name") == vg:
                      vg_count += 1; vg_free = rec.get("vg_free")
          actual = set()
          for report in json.loads(pvs.stdout).get("report",[]):
              for rec in report.get("pv",[]):
                  if rec.get("vg_name") == vg:
                      actual.add(rec.get("pv_name"))
          print(f"{vg} count={vg_count} expected={sorted(expected)} actual={sorted(actual)} free={vg_free}")
          if vg_count != 1: print("VG_COUNT_FAIL"); sys.exit(1)
          if actual != expected: print("VG_SET_MISMATCH"); sys.exit(1)
          import re as _re
          num = _re.sub(r'[^0-9]', '', str(vg_free).split(',')[0]) if vg_free else ""
          if num == "" or int(num) <= 0: print("VG_FREE_FAIL"); sys.exit(1)
          print("VG_MEMBERSHIP_OK")
          PYEOF
      register: vgm
      changed_when: false

    # ═══════════════ THIN POOL STRICT ═══════════════
    - name: THINPOOL-STRICT — exactly one, thin, active, numeric percents
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          vg = auth["vg"]; tp = auth["thinpool"]
          lvs = subprocess.run(["lvs","--reportformat","json"], capture_output=True, text=True)
          if lvs.returncode != 0: print("LVS_FAIL"); sys.exit(1)
          found = []
          for report in json.loads(lvs.stdout).get("report",[]):
              for rec in report.get("lv",[]):
                  if rec.get("vg_name")==vg and rec.get("lv_name")==tp:
                      found.append(rec)
          if len(found) != 1: print(f"THINPOOL_COUNT_FAIL n={len(found)}"); sys.exit(1)
          rec = found[0]
          attr = rec.get("lv_attr","")
          def num(v):
              import re as _re
              m = _re.search(r'-?\d+(\.\d+)?', v.replace(',','.'))
              return float(m.group(0)) if m else None
          dp = num(rec.get("data_percent","")); mp = num(rec.get("metadata_percent",""))
          print(f"{vg}/{tp} attr={attr} data_percent={rec.get('data_percent')} metadata_percent={rec.get('metadata_percent')} size={rec.get('lv_size')}")
          if not attr.startswith("t"): print("THINPOOL_NOT_THIN"); sys.exit(1)
          if "a" not in attr: print("THINPOOL_NOT_ACTIVE"); sys.exit(1)
          if dp is None or mp is None: print("THINPOOL_NON_NUMERIC"); sys.exit(1)
          if not (0 <= dp < 100): print("THINPOOL_DATA_PERCENT_BAD"); sys.exit(1)
          if not (0 <= mp < 100): print("THINPOOL_META_PERCENT_BAD"); sys.exit(1)
          print("THINPOOL_OK")
          PYEOF
      register: tp
      changed_when: false

    # ═══════════════ PROTECTED + exact OS PV map ═══════════════
    - name: PROTECTED-OS-PV — non-candidate not in vg + sda3 exact VG
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          vg = auth["vg"]; os_vg = auth["os_pv_vg"]
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {dev['serial']}"); sys.exit(1)
              return hits[0]["path"]
          cand_paths = set(resolve_now(dev) for dev in auth["devices"])
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print("PVS_FAIL"); sys.exit(1)
          pv_vg = {}
          for report in json.loads(pvs.stdout).get("report",[]):
              for rec in report.get("pv",[]):
                  pv_vg[rec.get("pv_name")] = rec.get("vg_name")
          # protected: non-candidate not in vg_piraeus
          hit = 0
          for name, v in pv_vg.items():
              if name not in cand_paths and v == vg:
                  hit += 1; print(f"PROTECTED_HIT {name} in {vg}")
          print(f"protected_devices_in_{vg}={hit}")
          if hit != 0: print("PROTECTED_FAIL"); sys.exit(1)
          # exact OS PV map: /dev/sda3 -> os_vg
          sda3_vg = pv_vg.get("/dev/sda3")
          print(f"/dev/sda3 -> {sda3_vg} (expected {os_vg})")
          if sda3_vg != os_vg: print("OS_PV_MAP_FAIL"); sys.exit(1)
          if sda3_vg == vg: print("OS_PV_IN_VG_PIRAEUS"); sys.exit(1)
          print("PROTECTED_OS_PV_OK")
          PYEOF
      register: prot
      changed_when: false

    # ═══════════════ DRBD module + resource state (fail-closed) ═══════════════
    - name: DRBD-FAIL-CLOSED — module absent + /proc absent + drbdadm rc + config
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import subprocess, sys, os, glob
          # 1. kernel-state checks (must all pass)
          sys_mod = os.path.exists("/sys/module/drbd")
          proc_drbd = os.path.exists("/proc/drbd")
          lsmod = subprocess.run(["lsmod"], capture_output=True, text=True)
          if lsmod.returncode != 0: print("DRBD_FAIL lsmod"); sys.exit(1)
          drbd_lines = [l for l in lsmod.stdout.splitlines() if l.startswith("drbd")]
          drbd_count = len(drbd_lines)
          print(f"host=$(hostname) sys_module_present={sys_mod} proc_drbd_present={proc_drbd} lsmod_drbd_count={drbd_count}")
          if sys_mod: print("DRBD_FAIL /sys/module/drbd present"); sys.exit(1)
          if proc_drbd: print("DRBD_FAIL /proc/drbd present"); sys.exit(1)
          if drbd_count != 0: print("DRBD_FAIL lsmod drbd"); sys.exit(1)
          # 2. drbdadm availability + fail-closed query
          w = subprocess.run(["sh","-c","command -v drbdadm"], capture_output=True, text=True)
          if w.returncode != 0 or not w.stdout.strip():
              print("drbdadm=UNAVAILABLE")
          else:
              print("drbdadm=AVAILABLE")
              r = subprocess.run(["drbdadm","status"], capture_output=True, text=True)
              print(f"drbdadm_status_rc={r.returncode}")
              if r.returncode != 0:
                  print("DRBD_QUERY_FAIL"); sys.exit(1)
              out = r.stdout.strip()
              print(f"drbdadm_status_stdout={out!r}")
              print(f"drbdadm_status_stderr={r.stderr.strip()!r}")
              if out == "":
                  print("drbd_resources=0")
              else:
                  # structural: no resource/device section present
                  lines = [l for l in out.splitlines() if l.strip() and not l.strip().startswith(("#","<"))]
                  if lines:
                      print("DRBD_FAIL unparseable/unknown output"); sys.exit(1)
                  print("drbd_resources=0")
          # 3. config inventory (read-only)
          conf_files = glob.glob("/etc/drbd.conf") + glob.glob("/etc/drbd.d/*.res")
          print(f"drbd_config_files={conf_files}")
          if conf_files:
              print("DRBD_FAIL config resources present"); sys.exit(1)
          print("DRBD_OK")
          PYEOF
      register: drbd
      changed_when: false

    # ═══════════════ K8S storage semantic filter ═══════════════
    - name: K8S-STORAGE-SEMANTIC — related objects only (linstor/piraeus/drbd/linbit)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"KUBECTL_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          KW = ("linstor","piraeus","drbd","linbit")
          def related(name):
              return any(k in str(name).lower() for k in KW)
          def rel_objs(items, name_fn, inspect_extra=lambda x: ""):
              out = []
              for i in items:
                  nm = name_fn(i)
                  extra = inspect_extra(i)
                  if related(nm) or related(extra):
                      out.append((nm, extra))
              return out
          crd = kget("get","crd")
          crd_rel = rel_objs(crd.get("items",[]), lambda i: i["metadata"]["name"])
          csi = kget("get","csidriver")
          csi_rel = rel_objs(csi.get("items",[]), lambda i: i["metadata"]["name"])
          sc = kget("get","storageclass")
          sc_rel = rel_objs(sc.get("items",[]), lambda i: i["metadata"]["name"], lambda i: (i.get("provisioner","") or "") )
          pv = kget("get","pv")
          pv_rel = rel_objs(pv.get("items",[]), lambda i: i["metadata"]["name"],
                            lambda i: json.dumps({"sc": i.get("spec",{}).get("storageClassName",""), "csi": json.dumps(i.get("spec",{}).get("csi",{}))}))
          pvc = kget("get","pvc","-A")
          pvc_rel = rel_objs(pvc.get("items",[]), lambda i: i["metadata"]["name"],
                             lambda i: json.dumps({"sc": i.get("spec",{}).get("storageClassName",""), "ns": i["metadata"]["namespace"]}))
          print(f"related_crds={len(crd_rel)} related_csi={len(csi_rel)} related_sc={len(sc_rel)} related_pv={len(pv_rel)} related_pvc={len(pvc_rel)}")
          print(f"unrelated_totals: crd={len(crd.get('items',[]))} csi={len(csi.get('items',[]))} sc={len(sc.get('items',[]))} pv={len(pv.get('items',[]))} pvc={len(pvc.get('items',[]))}")
          for rel in crd_rel+csi_rel+sc_rel+pv_rel+pvc_rel:
              print(f"RELATED: {rel}")
          if crd_rel or csi_rel or sc_rel or pv_rel or pvc_rel:
              print("K8S_RELATED_STORAGE_PRESENT"); sys.exit(1)
          print("K8S_RELATED_STORAGE_CLEAN")
          PYEOF
      register: k8s
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ P1 POST ═══════════════
    - name: P1 POST — bond slaves + exact VLAN + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_POST_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_POST_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_POST_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_POST_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_POST_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_POST_FAIL default"; exit 1; }
          echo "P1_POST_OK"
      register: p1post
      changed_when: false

    # ═══════════════ P2 POST ═══════════════
    - name: P2 POST — containerd + kubelet + swap
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i Version | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          echo "host=$(hostname) containerd=$ctd kubelet=$klt swap=$sw"
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_POST_FAIL"; exit 1; }
          echo "P2_POST_OK"
      register: p2post
      changed_when: false

    # ═══════════════ VIP owner per node (POST) ═══════════════
    - name: VIP-OWNER-POST — local bond0.140 172.30.140.100/32 count (0 or 1)
      ansible.builtin.shell:
        cmd: |
          c=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -c '172.30.140.100/32' || true)
          echo "vip_owner_local=$c"
          [ "$c" = "0" ] || [ "$c" = "1" ] || { echo "VIP_LOCAL_BAD"; exit 1; }
      register: vippost
      changed_when: false

    # ═══════════════ P3 POST ═══════════════
    - name: P3 POST — etcd JSON + kube-vip JSON + readyz/livez
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          if ml.returncode != 0: print("P3_FAIL"); sys.exit(1)
          members = json.loads(ml.stdout).get("members",[])
          mlearn = sum(1 for m in members if m.get("isLearner"))
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0: print("P3_FAIL"); sys.exit(1)
          eps = json.loads(st.stdout)
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          if h.returncode != 0: print("P3_FAIL"); sys.exit(1)
          healthy = h.stdout.count("is healthy")
          kvo = subprocess.run(KC+["get","pods","-n","kube-system","-o","json"], capture_output=True, text=True)
          if kvo.returncode != 0: print("P3_FAIL"); sys.exit(1)
          kv_items = [p for p in json.loads(kvo.stdout).get("items",[]) if p.get("metadata",{}).get("name","").startswith("kube-vip-")]
          kv_running = sum(1 for p in kv_items if p.get("status",{}).get("phase")=="Running")
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          if rz.returncode != 0: print("P3_FAIL"); sys.exit(1)
          rzok = rz.stdout.strip()
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append((r.returncode, r.stdout.strip()))
          ok_livez = sum(1 for rc,v in livez if rc==0 and v=="ok")
          print(f"members={len(members)} mlearn={mlearn} endpoints={len(eps)} elearn={elearn} leaders={len(leaders)} aep={aep} health={healthy} kube-vip={len(kv_items)} running={kv_running} readyz={rzok} livez={ok_livez}/3")
          if len(members)!=3 or mlearn!=0 or len(eps)!=3 or elearn!=0 or len(leaders)!=1 or aep!=1 or healthy!=3 or len(kv_items)!=3 or kv_running!=3 or rzok!="ok" or ok_livez!=3:
              print("P3_FAIL"); sys.exit(1)
          print("P3_POST_OK")
          PYEOF
      register: p3post
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ VIP aggregate (POST) ═══════════════
    - name: VIP-AGG-POST — aggregate owner count == 1
      ansible.builtin.shell:
        cmd: |
          total={{ groups['all'] | map('extract', hostvars, 'vippost') | select('defined') | map(attribute='stdout') | regex_replace('vip_owner_local=','') | map('int') | sum }}
          echo "vip_owner_aggregate=$total"
          [ "$total" = "1" ] || { echo "VIP_AGG_FAIL"; exit 1; }
      register: vipaggpost
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ P4A POST ═══════════════
    - name: P4A POST — Nodes/calico/CoreDNS/IPPool/BGP/autodetect (exact Ready)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"P4A_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          def ready_cond(obj):
              rcs = [c for c in obj.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"]
              return len(rcs) == 1 and rcs[0].get("status") == "True"
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if ready_cond(n))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if ready_cond(p))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if ready_cond(p))
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas"); dns_avail = dns["status"].get("availableReplicas",0); dns_ready = dns["status"].get("readyReplicas",0)
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          if len(pools) != 1: print("P4A_FAIL ippool_count"); sys.exit(1)
          p = pools[0]
          ipok = (p["spec"].get("cidr")=="10.244.0.0/16" and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True and not p["spec"].get("disabled",False))
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          print(f"nodes={ready} calico={cn} ctrl={cctrl} coredns={dns_des}/{dns_avail}/{dns_ready} ippool={ipok} bgp={bgpok} autodetect={admok}")
          if ready!=3 or cn!=3 or cctrl!=1 or dns_des!=2 or dns_avail!=2 or dns_ready!=2 or not ipok or not bgpok or not admok:
              print("P4A_FAIL"); sys.exit(1)
          print("P4A_POST_OK")
          PYEOF
      register: p4apost
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ P4B POST (fingerprint) ═══════════════
    - name: P4B POST — validation ns NotFound + NetworkPolicy fingerprint
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_FAIL ns exists"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout:
              print(f"P4B_FAIL ns query rc={r.returncode}"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_FAIL np query"); sys.exit(1)
          items = json.loads(np.stdout).get("items",[])
          canon = []
          for i in items:
              meta = i.get("metadata",{})
              spec_norm = json.dumps(i.get("spec",{}), sort_keys=True, separators=(",",":"))
              canon.append({
                  "ns": meta.get("namespace",""),
                  "name": meta.get("name",""),
                  "uid": meta.get("uid",""),
                  "gen": meta.get("generation",0),
                  "sha": hashlib.sha256(spec_norm.encode()).hexdigest(),
              })
          canon.sort(key=lambda x: (x["ns"], x["name"]))
          fp = hashlib.sha256(json.dumps(canon, sort_keys=True).encode()).hexdigest()
          open("/tmp/p4b_np_fingerprint_post.txt","w").write(fp)
          print(f"p4b_np_post_total={len(items)} fingerprint={fp}")
          print("P4B_POST_OK")
          PYEOF
      register: p4bpost
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ P4B fingerprint compare ═══════════════
    - name: P4B-FP-COMPARE — PRE fingerprint == POST fingerprint
      ansible.builtin.shell:
        cmd: |
          a=$(cat /tmp/p4b_np_fingerprint_pre.txt 2>/dev/null)
          b=$(cat /tmp/p4b_np_fingerprint_post.txt 2>/dev/null)
          echo "fp_pre=$a"
          echo "fp_post=$b"
          [ -n "$a" ] && [ -n "$b" ] && [ "$a" = "$b" ] || { echo "P4B_FP_MISMATCH"; exit 1; }
          echo "P4B_FP_UNCHANGED"
      register: p4bfp
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════ FINAL ═══════════════
    - name: FINAL — postverify semantic closure gate
      ansible.builtin.debug:
        msg: "P5B final semantic read-only closure completed"
      run_once: true
      delegate_to: node-01
