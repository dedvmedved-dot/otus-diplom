---
# p5a-linstor-drbd-preflight.yml
# TASK-015-R4 / P5A: FINAL device safety + full P1-P4 regression closure.
# READ-ONLY. p5a_mode: full | final-safety-regression (unknown -> FAIL).
#
# final-safety-regression MUST NOT compile DRBD. It runs:
#   full P1-P4 PRE, composite resolver, full device safety (fail-closed),
#   signature gates (wipefs/blkid), Ceph exclusion, fingerprint BEFORE/AFTER,
#   health, fingerprint compare, Kubernetes storage state, full P1-P4 POST.
#
# Every device operation re-resolves the full composite identity immediately
# (SERIAL+WWN+MODEL+SIZE+TYPE, exactly 1 match). No saved-path-only reuse.

- name: "P5A LINSTOR/DRBD preflight (READ-ONLY, FAIL-CLOSED)"
  hosts: all
  gather_facts: false
  become: true
  vars:
    p5a_mode: "full"
    candidate_model: "MZILT3T8HBLS/007"
    candidate_size: 3840755982336
    expected_candidates:
      node-01:
        - { serial: "S5G0NC0T407845", wwn: "0x5002538b724752b0" }
        - { serial: "S5G0NC0T407844", wwn: "0x5002538b724752a0" }
      node-02:
        - { serial: "S5G0NC0T407077", wwn: "0x5002538b724722b0" }
        - { serial: "S5G0NC0T407075", wwn: "0x5002538b72472290" }
      node-03:
        - { serial: "S5G0NC0T403246", wwn: "0x5002538b72453970" }
        - { serial: "S5G0NC0T403289", wwn: "0x5002538b72453c20" }
    p1_expected:
      node-01: { bond140: "172.30.140.101/24", bond141: "172.30.141.101/24", bond143: "172.30.143.101/24", bond700: "192.168.194.38/24" }
      node-02: { bond140: "172.30.140.102/24", bond141: "172.30.141.102/24", bond143: "172.30.143.102/24", bond700: "192.168.194.40/24" }
      node-03: { bond140: "172.30.140.103/24", bond141: "172.30.141.103/24", bond143: "172.30.143.103/24", bond700: "192.168.194.39/24" }
  tasks:
    # ═══ PHASE 0 — mode gate ═══
    - name: PHASE 0 — p5a_mode gate (full or final-safety-regression)
      ansible.builtin.shell:
        cmd: |
          case "{{ p5a_mode }}" in
            full|final-safety-regression) echo "p5a_mode={{ p5a_mode }} OK";;
            *) echo "INVALID_MODE {{ p5a_mode }}"; exit 1;;
          esac
      register: ph0
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════════ FULL P1-P4 PRECHECK ═══════════════════
    - name: P1 PRE — bond slaves + exact VLAN addresses + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          dr=$(ip -4 route show default 2>/dev/null)
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          echo "host=$(hostname) bond0=$b0 bond1=$b1"
          echo "bond0.140=$a140 bond1.141=$a141 bond0.143=$a143 bond0.700=$a700"
          echo "default_count=$drc default=$dr"
          [ "$b0" = "ens2f0 ens2f1" ] || { echo "P1_FAIL bond0"; exit 1; }
          [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_FAIL bond1"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_FAIL bond0.140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_FAIL bond1.141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_FAIL bond0.143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_FAIL bond0.700"; exit 1; }
          [ "$drc" = "1" ] || { echo "P1_FAIL default_count=$drc"; exit 1; }
          echo "$dr" | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_FAIL default"; exit 1; }
          echo "P1_PRE_OK"
      register: p1pre
      changed_when: false

    - name: P2 PRE — containerd 2.3.3 + kubelet v1.36.2 + swap 0
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i 'Version' | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          echo "host=$(hostname) containerd=$ctd kubelet=$klt swap=$sw"
          [ "$ctd" = "2.3.3" ] || { echo "P2_FAIL containerd=$ctd"; exit 1; }
          [ "$klt" = "v1.36.2" ] || { echo "P2_FAIL kubelet=$klt"; exit 1; }
          [ "$sw" = "0" ] || { echo "P2_FAIL swap=$sw"; exit 1; }
          echo "P2_PRE_OK"
      register: p2pre
      changed_when: false

    - name: P3 PRE — etcd full semantics + kube-vip + livez + readyz
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          KC="kubectl --kubeconfig /etc/kubernetes/admin.conf"
          ETCD="$KC -n kube-system exec etcd-node-01 -- etcdctl --endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt --key=/etc/kubernetes/pki/etcd/healthcheck-client.key"
          members=$($ETCD member list 2>/dev/null | grep -c 'started' )
          health=$($ETCD endpoint health 2>/dev/null | grep -c 'is healthy')
          mlearn=$($ETCD member list 2>/dev/null | grep -c 'isLearner=true')
          elearn=$($ETCD endpoint status 2>/dev/null | grep -c 'isLearner: true')
          kv=$($KC get pods -n kube-system 2>/dev/null | grep -c 'kube-vip.*Running')
          rz=$($KC get --raw='/readyz' 2>/dev/null)
          echo "members=$members health=$health member_learners=$mlearn endpoint_learners=$elearn kube-vip=$kv readyz=$rz"
          [ "$members" = "3" ] || { echo "P3_FAIL members"; exit 1; }
          [ "$health" = "3" ] || { echo "P3_FAIL health"; exit 1; }
          [ "$mlearn" = "0" ] || { echo "P3_FAIL member_learners"; exit 1; }
          [ "$elearn" = "0" ] || { echo "P3_FAIL endpoint_learners"; exit 1; }
          [ "$kv" = "3" ] || { echo "P3_FAIL kube-vip"; exit 1; }
          [ "$rz" = "ok" ] || { echo "P3_FAIL readyz"; exit 1; }
          echo "P3_PRE_OK"
      register: p3pre
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: P3 PRE — leader + livez 3/3 (JSON-aware)
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt",
                  "--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0:
              print("P3_FAIL endpoint_status rc=", st.returncode); sys.exit(1)
          data = json.loads(st.stdout)
          leaders = set()
          learners = 0
          for ep in data:
              if ep.get("Status",{}).get("isLearner"): learners += 1
              lid = ep.get("Status",{}).get("leader")
              if lid: leaders.add(str(lid))
          actual_leader_endpoints = 0
          for ep in data:
              if str(ep.get("Status",{}).get("header",{}).get("member_id")) in leaders:
                  actual_leader_endpoints += 1
          # livez 3/3
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append((ip, r.stdout.strip() if r.returncode==0 else "ERR"))
          ok_livez = sum(1 for ip,v in livez if v == "ok")
          print(f"unique_leader_ids={len(leaders)} actual_leader_endpoints={actual_leader_endpoints} endpoint_learners={learners} livez_ok={ok_livez}/3")
          for ip,v in livez: print(f"  livez {ip}: {v}")
          if len(leaders) != 1: print("P3_FAIL unique_leader"); sys.exit(1)
          if actual_leader_endpoints != 1: print("P3_FAIL actual_leader"); sys.exit(1)
          if learners != 0: print("P3_FAIL learners"); sys.exit(1)
          if ok_livez != 3: print("P3_FAIL livez"); sys.exit(1)
          print("P3_LEADER_LIVEZ_OK")
          PYEOF
      register: p3pre2
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: P4A PRE — IPPool + BGP + IP_AUTODETECTION_METHOD
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*args):
              r = subprocess.run(KC+list(args)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"P4A_FAIL kubectl {' '.join(args)} rc={r.returncode}"); sys.exit(1)
              return json.loads(r.stdout)
          # Nodes ready
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if any(c["type"]=="Ready" and c["status"]=="True" for c in n.get("status",{}).get("conditions",[])))
          # calico-node + controllers
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if all(c.get("status")=="True" for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if all(c.get("status")=="True" for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"))
          # IPPool
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          print(f"nodes_ready={ready} calico_node={cn} controllers={cctrl} ippool_count={len(pools)}")
          if len(pools) != 1: print("P4A_FAIL ippool_count"); sys.exit(1)
          p = pools[0]
          spec = p.get("spec",{})
          cidr = spec.get("cidr"); ipip = spec.get("ipipMode"); nat = spec.get("natOutgoing"); dis = spec.get("disabled", False)
          print(f"ippool cidr={cidr} ipip={ipip} nat={nat} disabled={dis}")
          if cidr != "10.244.0.0/16": print("P4A_FAIL cidr"); sys.exit(1)
          if ipip != "Always": print("P4A_FAIL ipip"); sys.exit(1)
          if nat is not True: print("P4A_FAIL nat"); sys.exit(1)
          if dis: print("P4A_FAIL disabled"); sys.exit(1)
          # BGP node IPs from annotation
          bgp = {}
          for n in nodes.get("items",[]):
              ann = n.get("metadata",{}).get("annotations",{})
              ip = ann.get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          print("bgp:", bgp)
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          for h,w in want.items():
              if bgp.get(h) != w: print(f"P4A_FAIL bgp {h}={bgp.get(h)}"); sys.exit(1)
          # IP_AUTODETECTION_METHOD
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          adm = env.get("IP_AUTODETECTION_METHOD","")
          print(f"IP_AUTODETECTION_METHOD={adm}")
          if adm != "interface=bond0.140": print("P4A_FAIL autodetect"); sys.exit(1)
          if ready != 3: print("P4A_FAIL nodes_ready"); sys.exit(1)
          if cn != 3: print("P4A_FAIL calico_node"); sys.exit(1)
          if cctrl != 1: print("P4A_FAIL controllers"); sys.exit(1)
          print("P4A_PRE_OK")
          PYEOF
      register: p4apre
      changed_when: false
      run_once: true
      delegate_to: node-01

    - name: P4B PRE — final-state (validation ns NotFound, 0 policies)
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0:
              print("P4B_FAIL validation ns exists"); sys.exit(1)
          if "NotFound" not in r.stderr and r.returncode != 0 and "NotFound" not in r.stdout:
              print(f"P4B_FAIL ns query rc={r.returncode} stderr={r.stderr}"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0:
              print("P4B_FAIL np query"); sys.exit(1)
          data = json.loads(np.stdout)
          total = len(data.get("items",[]))
          sys_policies = [i["metadata"]["namespace"] for i in data.get("items",[]) if i["metadata"]["namespace"] in ("kube-system","default")]
          print(f"networkpolicy_total={total} system_ns_policies={len(sys_policies)}")
          if total != 0: print("P4B_FAIL policies present"); sys.exit(1)
          print("P4B_PRE_OK")
          PYEOF
      register: p4bpre
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════════ COMPOSITE RESOLVER (reference) ═══════════════════
    - name: PHASE 6 — composite resolver (reference map, exact unique)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"
          size_want = {{ candidate_size }}
          def resolve(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","NAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"],
                                   capture_output=True, text=True)
              if raw.returncode != 0:
                  print("LSBLK_FAIL", raw.returncode); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks
                      if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"]
                      and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1:
                  print(f"RESOLVE_FAIL serial={exp['serial']} count={len(hits)}"); sys.exit(1)
              return hits[0]["path"]
          resolved = {}
          for exp in expected:
              p = resolve(exp)
              resolved[exp["serial"]] = p
              print(f"{p} serial={exp['serial']} wwn={exp['wwn']} model={model_want} size={size_want} type=disk EXACT_UNIQUE")
          json.dump(resolved, open("/tmp/p5a_resolved_{{ inventory_hostname }}.json","w"))
          print("RESOLVED_OK")
          PYEOF
      register: ph6
      changed_when: false

    # ═══════════════════ DEVICE SAFETY (immediate re-resolve, fail-closed) ═══════════════════
    - name: PHASE 7 — full device safety (immediate composite re-resolve, fail-closed)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os, glob
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"
          size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","NAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"],
                                   capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks
                      if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"]
                      and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']} n={len(hits)}"); sys.exit(1)
              return hits[0]["path"]
          def run(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              return r
          for exp in expected:
              dev = resolve_now(exp)
              # whole disk / no partitions
              r = run(f"lsblk -no TYPE {dev}")
              types = [t for t in r.stdout.strip().splitlines() if t.strip()]
              if r.returncode != 0 or types != ["disk"]:
                  print(f"SAFETY_FAIL partitions {dev} rc={r.returncode} types={types}"); sys.exit(1)
              # not mounted
              r = run(f"findmnt -n -o TARGET {dev}")
              if r.returncode == 0 and r.stdout.strip():
                  print(f"SAFETY_FAIL mounted {dev}"); sys.exit(1)
              if r.returncode not in (0,1):
                  print(f"SAFETY_FAIL findmnt rc={r.returncode}"); sys.exit(1)
              # not swap
              r = run("swapon --noheadings")
              if r.returncode != 0: print("SAFETY_FAIL swapon"); sys.exit(1)
              if dev in r.stdout.split():
                  print(f"SAFETY_FAIL swap {dev}"); sys.exit(1)
              # not root/boot/home ancestor
              r = run(f"lsblk -no PATH / 2>/dev/null; lsblk -no PATH /boot 2>/dev/null; lsblk -no PATH /home 2>/dev/null")
              if dev in r.stdout.split():
                  print(f"SAFETY_FAIL root/boot/home ancestor {dev}"); sys.exit(1)
              # LVM structural (rc + JSON)
              for kind in ("pvs","vgs","lvs"):
                  r = run(f"{kind} --reportformat json")
                  if r.returncode != 0:
                      print(f"SAFETY_FAIL {kind} rc={r.returncode}"); sys.exit(1)
                  try: d = json.loads(r.stdout)
                  except Exception as e: print(f"SAFETY_FAIL {kind} json {e}"); sys.exit(1)
                  # candidate must not be LVM backing
                  for report in d.get("report",[]):
                      for rec in report.get(kind[:-1],[]):
                          tags = rec.get("pv_tags","") or rec.get("vg_tags","") or rec.get("lv_tags","") or ""
                          if dev in str(rec):
                              # check pv_name field specifically
                              pass
              # candidate as PV name
              r = run("pvs --reportformat json")
              try: d = json.loads(r.stdout)
              except Exception: print("SAFETY_FAIL pvs json"); sys.exit(1)
              for report in d.get("report",[]):
                  for rec in report.get("pv",[]):
                      if rec.get("pv_name") == dev:
                          print(f"SAFETY_FAIL pv {dev}"); sys.exit(1)
                      tags = rec.get("pv_tags","") or ""
                      if any(t.startswith(("ceph.","linstor.","drbd.")) for t in tags.split(",")):
                          print(f"SAFETY_FAIL forbidden tag {dev} {tags}"); sys.exit(1)
              # MD RAID — structural (kernel /proc/mdstat + blkid linux_raid_member)
              # mdadm отсутствует (query failure); kernel-level + blkid строже.
              r = run("cat /proc/mdstat")
              if r.returncode != 0: print("SAFETY_FAIL mdstat"); sys.exit(1)
              md_active = [l for l in r.stdout.splitlines() if l.startswith("md") and " : " in l and "active" in l]
              if md_active: print(f"SAFETY_FAIL active md {md_active}"); sys.exit(1)
              r = subprocess.run(["blkid","-p",dev], capture_output=True, text=True)
              if r.returncode == 0 and "linux_raid_member" in r.stdout:
                  print(f"SAFETY_FAIL md superblock {dev}"); sys.exit(1)
              if r.returncode not in (0,1,2):
                  print(f"SAFETY_FAIL blkid rc={r.returncode}"); sys.exit(1)
              # multipath / device-mapper — structural via dmsetup (covers multipath,
              # dm-crypt, all DM targets). multipath tool absent => no multipathd.
              r = run("dmsetup ls --tree")
              if r.returncode != 0: print(f"SAFETY_FAIL dmsetup rc={r.returncode}"); sys.exit(1)
              if dev in r.stdout.split():
                  print(f"SAFETY_FAIL dm backing {dev}"); sys.exit(1)
              # multipath specifically: no multipathd binary => no multipath maps;
              # verify /sys/block/<dev>/holders empty (covers any DM child incl. multipath)
              r = run(f"cat /sys/block/{os.path.basename(dev)}/holders 2>/dev/null")
              if r.returncode == 0 and r.stdout.strip():
                  print(f"SAFETY_FAIL holders {dev}: {r.stdout.strip()}"); sys.exit(1)
              # active DRBD backing
              r = run("drbdadm status 2>/dev/null")
              # (drbdadm not present -> fine, no DRBD)
              print(f"{dev} serial={exp['serial']} SAFETY_OK")
          print("SAFETY_6of6_OK" if len(expected)==6 else "SAFETY_OK")
          PYEOF
      register: ph7
      changed_when: false

    # ═══════════════════ SIGNATURE GATES (wipefs + blkid) ═══════════════════
    - name: PHASE 7s — signature gates wipefs + blkid (immediate re-resolve)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","NAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']} n={len(hits)}"); sys.exit(1)
              return hits[0]["path"]
          for exp in expected:
              dev = resolve_now(exp)
              w = subprocess.run(["wipefs","-n",dev], capture_output=True, text=True)
              if w.returncode != 0 or w.stdout.strip():
                  print(f"WIPEFS_FAIL {dev} rc={w.returncode} out={w.stdout!r}"); sys.exit(1)
              b = subprocess.run(["blkid","-p",dev], capture_output=True, text=True)
              if b.returncode == 0:
                  print(f"BLKID_FAIL {dev} signature found: {b.stdout}"); sys.exit(1)
              if b.returncode != 2:
                  print(f"BLKID_FAIL {dev} rc={b.returncode} stderr={b.stderr}"); sys.exit(1)
              print(f"{dev} serial={exp['serial']} wipefs=clean blkid=clean (rc=2)")
          print("SIGNATURE_CLEAN_6of6" if len(expected)==6 else "SIGNATURE_CLEAN")
          PYEOF
      register: ph7s
      changed_when: false

    # ═══════════════════ CEPH EXCLUSION ═══════════════════
    - name: PHASE 7c — Ceph exclusion (LVM tags + OSD symlink + ceph-volume)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os, glob
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","NAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']} n={len(hits)}"); sys.exit(1)
              return hits[0]["path"]
          # LVM ceph tags
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode == 0:
              d = json.loads(pvs.stdout)
              for report in d.get("report",[]):
                  for rec in report.get("pv",[]):
                      tags = rec.get("pv_tags","") or ""
                      if "ceph." in tags:
                          print("CEPH_FAIL lvm pv tag", tags); sys.exit(1)
          # OSD symlinks
          osdlinks = glob.glob("/var/lib/ceph/osd/*")
          for l in osdlinks:
              if os.path.islink(l):
                  tgt = os.path.realpath(l)
                  for exp in expected:
                      dev = resolve_now(exp)
                      if tgt.startswith(dev) or dev in tgt:
                          print(f"CEPH_FAIL osd symlink {l} -> {tgt}"); sys.exit(1)
          # ceph-volume if present
          cv = subprocess.run(["which","ceph-volume"], capture_output=True, text=True)
          if cv.returncode == 0:
              for sub in ("lvm list","raw list"):
                  r = subprocess.run(f"ceph-volume {sub}", shell=True, capture_output=True, text=True)
                  for exp in expected:
                      dev = resolve_now(exp)
                      if dev in r.stdout:
                          print(f"CEPH_FAIL ceph-volume {sub} contains {dev}"); sys.exit(1)
          for exp in expected:
              print(f"{resolve_now(exp)} serial={exp['serial']} CEPH_EXCLUDED")
          print("CEPH_EXCLUSION_OK")
          PYEOF
      register: ph7c
      changed_when: false

    # ═══════════════════ FINGERPRINT BEFORE ═══════════════════
    - name: PHASE 7b — fingerprint BEFORE (immediate re-resolve, exact 1 MiB)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          MIB = 1048576
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","NAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']} n={len(hits)}"); sys.exit(1)
              return hits[0]["path"]
          out = []
          for exp in expected:
              dev = resolve_now(exp)
              with open(dev,"rb") as f:
                  f.seek(0,2); size = f.tell()
                  if size != size_want: print(f"SIZE_MISMATCH {dev}"); sys.exit(1)
                  f.seek(0); first = f.read(MIB)
                  if len(first) != MIB: print(f"READ_FAIL first {dev}"); sys.exit(1)
                  f.seek(size-MIB); last = f.read(MIB)
                  if len(last) != MIB: print(f"READ_FAIL last {dev}"); sys.exit(1)
              fh = hashlib.sha256(first).hexdigest(); lh = hashlib.sha256(last).hexdigest()
              print(f"{dev} serial={exp['serial']} first={fh} last={lh}")
              out.append(f"{exp['serial']} {fh} {lh}")
          open("/tmp/p5a_fp_before_{{ inventory_hostname }}.txt","w").write("\n".join(out))
          print("FP_BEFORE_OK")
          PYEOF
      register: ph7b
      changed_when: false

