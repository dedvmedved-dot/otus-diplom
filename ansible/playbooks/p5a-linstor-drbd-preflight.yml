---
# p5a-linstor-drbd-preflight.yml
# TASK-015-R5 / P5A: FINAL busy-device + regression proof.
# READ-ONLY. p5a_mode: full | final-safety-regression | final-busy-regression.
#
# final-busy-regression runs ONLY:
#   full P1-P4 PRE, composite resolver, busy/backing/holder safety proof,
#   Ceph exclusion proof, Kubernetes storage-state proof, full P1-P4 POST.
# It MUST NOT run: DRBD compile, candidate health, fingerprint reads,
# package installation, storage mutation.

- name: "P5A LINSTOR/DRBD preflight (READ-ONLY, FAIL-CLOSED)"
  hosts: all
  gather_facts: false
  become: true
  vars:
    p5a_mode: "full"
    candidate_model: "MZILT3T8HBLS/007"
    candidate_size: 3840755982336
    expected_candidates:
      node-01:
        - { serial: "S5G0NC0T407845", wwn: "0x5002538b724752b0" }
        - { serial: "S5G0NC0T407844", wwn: "0x5002538b724752a0" }
      node-02:
        - { serial: "S5G0NC0T407077", wwn: "0x5002538b724722b0" }
        - { serial: "S5G0NC0T407075", wwn: "0x5002538b72472290" }
      node-03:
        - { serial: "S5G0NC0T403246", wwn: "0x5002538b72453970" }
        - { serial: "S5G0NC0T403289", wwn: "0x5002538b72453c20" }
    p1_expected:
      node-01: { bond140: "172.30.140.101/24", bond141: "172.30.141.101/24", bond143: "172.30.143.101/24", bond700: "192.168.194.38/24" }
      node-02: { bond140: "172.30.140.102/24", bond141: "172.30.141.102/24", bond143: "172.30.143.102/24", bond700: "192.168.194.40/24" }
      node-03: { bond140: "172.30.140.103/24", bond141: "172.30.141.103/24", bond143: "172.30.143.103/24", bond700: "192.168.194.39/24" }
  tasks:
    # ═══ PHASE 0 — mode gate ═══
    - name: PHASE 0 — p5a_mode gate
      ansible.builtin.shell:
        cmd: |
          case "{{ p5a_mode }}" in
            full|final-safety-regression|final-busy-regression|final-dm-ceph) echo "p5a_mode={{ p5a_mode }} OK";;
            *) echo "INVALID_MODE {{ p5a_mode }}"; exit 1;;
          esac
      register: ph0
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ minimal P1-P4 health guard (final-dm-ceph) ═══
    - name: PHASE 0g — minimal cluster guard (nodes + readyz)
      ansible.builtin.shell:
        cmd: |
          nodes=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes 2>/dev/null | grep -c ' Ready')
          rz=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw='/readyz' 2>/dev/null)
          echo "nodes=$nodes readyz=$rz"
          [ "$nodes" = "3" ] && [ "$rz" = "ok" ] || exit 1
      register: ph0g
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode == 'final-dm-ceph'

    # ═══════════════════ FULL P1-P4 PRECHECK ═══════════════════
    - name: P1 PRE — bond slaves + exact VLAN addresses + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          dr=$(ip -4 route show default 2>/dev/null)
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          echo "host=$(hostname) bond0=$b0 bond1=$b1 default_count=$drc"
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && echo "$dr" | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_FAIL default"; exit 1; }
          echo "P1_PRE_OK"
      register: p1pre
      changed_when: false
      when: p5a_mode != 'final-dm-ceph'

    - name: P2 PRE — containerd + kubelet + swap
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i 'Version' | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          echo "host=$(hostname) containerd=$ctd kubelet=$klt swap=$sw"
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_FAIL"; exit 1; }
          echo "P2_PRE_OK"
      register: p2pre
      changed_when: false
      when: p5a_mode != 'final-dm-ceph'

    - name: P3 PRE — etcd JSON-aware full semantics
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          # member list JSON
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          if ml.returncode != 0: print("P3_FAIL member_list"); sys.exit(1)
          members = json.loads(ml.stdout).get("members",[])
          mlearn = sum(1 for m in members if m.get("isLearner"))
          # endpoint status JSON
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          if st.returncode != 0: print("P3_FAIL endpoint_status"); sys.exit(1)
          eps = json.loads(st.stdout)
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          # health
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          healthy = h.stdout.count("is healthy")
          # kube-vip + readyz
          kv = subprocess.run(KC+["get","pods","-n","kube-system"], capture_output=True, text=True)
          kvc = kv.stdout.count("kube-vip") 
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True)
          rzok = rz.stdout.strip()
          # livez 3/3
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append(r.stdout.strip() if r.returncode==0 else "ERR")
          ok_livez = sum(1 for v in livez if v == "ok")
          print(f"members={len(members)} member_learners={mlearn} endpoint_learners={elearn} unique_leaders={len(leaders)} actual_leader={aep} health={healthy} kube-vip={kvc} readyz={rzok} livez={ok_livez}/3")
          if len(members) != 3: print("P3_FAIL members"); sys.exit(1)
          if mlearn != 0: print("P3_FAIL member_learners"); sys.exit(1)
          if elearn != 0: print("P3_FAIL endpoint_learners"); sys.exit(1)
          if len(leaders) != 1: print("P3_FAIL unique_leaders"); sys.exit(1)
          if aep != 1: print("P3_FAIL actual_leader"); sys.exit(1)
          if healthy != 3: print("P3_FAIL health"); sys.exit(1)
          if kvc != 3: print("P3_FAIL kube-vip"); sys.exit(1)
          if rzok != "ok": print("P3_FAIL readyz"); sys.exit(1)
          if ok_livez != 3: print("P3_FAIL livez"); sys.exit(1)
          print("P3_PRE_OK")
          PYEOF
      register: p3pre
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    - name: P4A PRE — Nodes/calico/CoreDNS/IPPool/BGP/autodetect
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"P4A_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if any(c["type"]=="Ready" and c["status"]=="True" for c in n.get("status",{}).get("conditions",[])))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if all(c.get("status")=="True" for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if all(c.get("status")=="True" for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"))
          # CoreDNS desired/available/ready
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas")
          dns_avail = dns["status"].get("availableReplicas",0)
          dns_ready = dns["status"].get("readyReplicas",0)
          # IPPool
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[])
          p = pools[0] if len(pools)==1 else None
          ipok = (p is not None and p["spec"].get("cidr")=="10.244.0.0/16"
                  and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True
                  and not p["spec"].get("disabled", False))
          # BGP
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          # autodetect
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          print(f"nodes={ready} calico={cn} ctrl={cctrl} coredns={dns_des}/{dns_avail}/{dns_ready} ippool={ipok} bgp={bgpok} autodetect={admok}")
          if ready != 3 or cn != 3 or cctrl != 1: print("P4A_FAIL"); sys.exit(1)
          if dns_des != 2 or dns_avail != 2 or dns_ready != 2: print("P4A_FAIL coredns"); sys.exit(1)
          if not ipok: print("P4A_FAIL ippool"); sys.exit(1)
          if not bgpok: print("P4A_FAIL bgp"); sys.exit(1)
          if not admok: print("P4A_FAIL autodetect"); sys.exit(1)
          print("P4A_PRE_OK")
          PYEOF
      register: p4apre
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    - name: P4B PRE — final-state (validation ns NotFound, 0 policies)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_FAIL ns exists"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout:
              print(f"P4B_FAIL ns query rc={r.returncode}"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_FAIL np"); sys.exit(1)
          total = len(json.loads(np.stdout).get("items",[]))
          print(f"networkpolicy_total={total}")
          if total != 0: print("P4B_FAIL policies"); sys.exit(1)
          print("P4B_PRE_OK")
          PYEOF
      register: p4bpre
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    # ═══════════════════ COMPOSITE RESOLVER ═══════════════════
    - name: PHASE 6 — composite resolver (exact unique)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","NAME,KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']} n={len(hits)}"); sys.exit(1)
              return hits[0]
          resolved = {}
          for exp in expected:
              d = resolve_now(exp)
              resolved[exp["serial"]] = {"path": d["path"], "kname": d["kname"]}
              print(f"{d['path']} kname={d['kname']} serial={exp['serial']} wwn={exp['wwn']} model={model_want} size={size_want} type=disk EXACT_UNIQUE")
          json.dump(resolved, open("/tmp/p5a_resolved_{{ inventory_hostname }}.json","w"))
          print("RESOLVED_OK")
          PYEOF
      register: ph6
      changed_when: false

    # ═══════════════════ HOLDER PROOF (structural os.listdir) ═══════════════════
    - name: PHASE 7h — active holders proof (os.listdir sysfs)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']}"); sys.exit(1)
              return hits[0]
          for exp in expected:
              d = resolve_now(exp)
              kname = d["kname"]; dev = d["path"]
              hdir = f"/sys/class/block/{kname}/holders"
              if not os.path.isdir(hdir): print(f"HOLDER_FAIL {dev} no dir"); sys.exit(1)
              try: holders = os.listdir(hdir)
              except Exception as e: print(f"HOLDER_FAIL {dev} {e}"); sys.exit(1)
              if len(holders) != 0: print(f"HOLDER_FAIL {dev} holders={holders}"); sys.exit(1)
              print(f"{dev} kname={kname} holders=0")
          print("HOLDERS_6of6_ZERO" if len(expected)==6 else "HOLDERS_ZERO")
          PYEOF
      register: ph7h
      changed_when: false

    # ═══════════════════ DM/CRYPT/MULTIPATH PROOF (major:minor) ═══════════════════
    - name: PHASE 7d — DM dependency proof (major:minor structural)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']}"); sys.exit(1)
              return hits[0]
          def majmin(path):
              st = os.stat(path)
              return (os.major(st.st_rdev), os.minor(st.st_rdev))
          # collect candidate major:minor
          cands = []
          for exp in expected:
              d = resolve_now(exp)
              cands.append((exp["serial"], d["path"], d["kname"], majmin(d["path"])))
          # collect DM deps (structural, fail-closed: rc=0 required)
          dm_maps = []
          r = subprocess.run(["dmsetup","ls"], capture_output=True, text=True)
          if r.returncode != 0:
              print(f"DM_QUERY_FAIL dmsetup ls rc={r.returncode}"); sys.exit(1)
          lines = [l for l in r.stdout.strip().splitlines() if l.strip()]
          if not lines:
              print("DM_MAPS=0 PASS")
          else:
              import re
              for line in lines:
                  name = line.split()[0]
                  deps = subprocess.run(["dmsetup","deps",name], capture_output=True, text=True)
                  if deps.returncode != 0:
                      print(f"DM_DEPS_FAIL {name} rc={deps.returncode}"); sys.exit(1)
                  pairs = re.findall(r'\((\d+):(\d+)\)', deps.stdout)
                  print(f"dm_map={name} deps_rc=0 deps={pairs}")
                  for mj,mn in pairs:
                      dm_maps.append((int(mj), int(mn)))
          for serial, dev, kname, mm in cands:
              hit = mm in dm_maps
              print(f"{dev} kname={kname} maj:min={mm[0]}:{mm[1]} dm_dependency={'HIT' if hit else 'clear'}")
              if hit: print(f"DM_FAIL {dev}"); sys.exit(1)
          print("DM_CRYPT_MULTIPATH_6of6_CLEAR" if len(expected)==6 else "DM_CLEAR")
          PYEOF
      register: ph7d
      changed_when: false

    # ═══════════════════ ROOT/BOOT/HOME ANCESTRY (fail-closed) ═══════════════════
    - name: PHASE 7r — root/boot/home ancestry proof
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']}"); sys.exit(1)
              return hits[0]
          cand_knames = set(resolve_now(exp)["kname"] for exp in expected)
          def norm(p):
              if not p: return p
              return p if p.startswith("/dev") else "/dev/" + p
          # walk ancestry for /, /boot, /home
          for mp in ["/", "/boot", "/home"]:
              r = subprocess.run(["findmnt","-n","-o","SOURCE",mp], capture_output=True, text=True)
              if r.returncode == 1 and not r.stdout.strip():
                  print(f"{mp}: not separately mounted"); continue
              if r.returncode != 0:
                  print(f"ANCESTRY_FAIL findmnt {mp} rc={r.returncode}"); sys.exit(1)
              src = r.stdout.strip().split()[0]
              # walk ancestors via lsblk PKNAME (normalize /dev prefix)
              chain = []
              cur = norm(src)
              for _ in range(16):
                  if not cur: break
                  chain.append(cur)
                  r2 = subprocess.run(["lsblk","-no","PKNAME",cur], capture_output=True, text=True)
                  if r2.returncode != 0:
                      print(f"ANCESTRY_FAIL lsblk {cur} rc={r2.returncode}"); sys.exit(1)
                  pk = r2.stdout.strip().split("\n")[0]
                  if not pk: break
                  nxt = norm(pk)
                  if nxt == cur: break
                  cur = nxt
              # candidate match: compare kname (basename) against chain knames
              chain_knames = {os.path.basename(c) for c in chain}
              hits = cand_knames & chain_knames
              print(f"{mp} source={src} chain={chain} candidate_hits={len(hits)}")
              if hits: print(f"ANCESTRY_FAIL {mp} {hits}"); sys.exit(1)
          print("ANCESTRY_6of6_CLEAR" if len(expected)==6 else "ANCESTRY_CLEAR")
          PYEOF
      register: ph7r
      changed_when: false

    # ═══════════════════ LVM + RAID (structural) ═══════════════════
    - name: PHASE 7l — LVM + RAID structural proof
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']}"); sys.exit(1)
              return hits[0]
          # LVM pvs JSON (rc + parse enforced)
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print(f"LVM_FAIL pvs rc={pvs.returncode}"); sys.exit(1)
          try: pvdata = json.loads(pvs.stdout)
          except Exception as e: print(f"LVM_FAIL pvs json {e}"); sys.exit(1)
          pv_names = set(); pv_tags = {}
          for report in pvdata.get("report",[]):
              for rec in report.get("pv",[]):
                  pv_names.add(rec.get("pv_name"))
                  pv_tags[rec.get("pv_name")] = rec.get("pv_tags","") or ""
          # RAID via /proc/mdstat (readable required)
          md = subprocess.run(["cat","/proc/mdstat"], capture_output=True, text=True)
          if md.returncode != 0: print("RAID_FAIL mdstat"); sys.exit(1)
          md_active = [l for l in md.stdout.splitlines() if l.startswith("md") and "active" in l]
          for exp in expected:
              d = resolve_now(exp)
              dev = d["path"]; kname = d["kname"]
              is_pv = dev in pv_names
              tags = pv_tags.get(dev, "")
              bad_tags = [t for t in tags.split(",") if t.startswith(("ceph.","linstor.","drbd."))]
              print(f"{dev} pv_member={int(is_pv)} forbidden_tags={bad_tags or 0}")
              if is_pv: print(f"LVM_FAIL pv {dev}"); sys.exit(1)
              if bad_tags: print(f"LVM_FAIL tags {dev} {bad_tags}"); sys.exit(1)
          if md_active: print(f"RAID_FAIL {md_active}"); sys.exit(1)
          print(f"LVM_RAID_CLEAR (mdadm unavailable: structural mdstat+holders used)")
          PYEOF
      register: ph7l
      changed_when: false

    # ═══════════════════ CEPH EXCLUSION (fail-closed) ═══════════════════
    - name: PHASE 7c — Ceph exclusion (pvs tags + OSD links + ceph-volume)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os, glob
          expected = {{ expected_candidates[inventory_hostname] | to_json }}
          model_want = "{{ candidate_model }}"; size_want = {{ candidate_size }}
          def resolve_now(exp):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==exp["serial"] and d.get("wwn")==exp["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {exp['serial']}"); sys.exit(1)
              return hits[0]
          # candidate-specific ceph LVM tags (pvs rc + JSON enforced)
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print(f"CEPH_FAIL pvs rc={pvs.returncode}"); sys.exit(1)
          try: pvdata = json.loads(pvs.stdout)
          except Exception as e: print(f"CEPH_FAIL pvs json {e}"); sys.exit(1)
          for exp in expected:
              d = resolve_now(exp); dev = d["path"]
              tags = ""
              for report in pvdata.get("report",[]):
                  for rec in report.get("pv",[]):
                      if rec.get("pv_name") == dev: tags = rec.get("pv_tags","") or ""
              ceph_tags = [t for t in tags.split(",") if t.startswith("ceph.")]
              print(f"{dev} ceph_tags={ceph_tags or 0}")
              if ceph_tags: print(f"CEPH_FAIL tag {dev}"); sys.exit(1)
          # OSD block links ancestry (readlink -f rc=0 + lsblk PKNAME walk)
          osd_links = glob.glob("/var/lib/ceph/osd/ceph-*/block") + \
                      glob.glob("/var/lib/ceph/osd/ceph-*/block.db") + \
                      glob.glob("/var/lib/ceph/osd/ceph-*/block.wal")
          def norm(p):
              if not p: return p
              return p if p.startswith("/dev") else "/dev/" + p
          for l in osd_links:
              rl = subprocess.run(["readlink","-f",l], capture_output=True, text=True)
              if rl.returncode != 0:
                  print(f"CEPH_QUERY_FAIL readlink {l} rc={rl.returncode}"); sys.exit(1)
              tgt = rl.stdout.strip()
              # resolve target + walk PKNAME ancestry to whole disk
              chain = []
              cur = norm(tgt)
              for _ in range(16):
                  if not cur: break
                  chain.append(cur)
                  r2 = subprocess.run(["lsblk","-no","PKNAME",cur], capture_output=True, text=True)
                  if r2.returncode != 0:
                      print(f"CEPH_QUERY_FAIL lsblk {cur} rc={r2.returncode}"); sys.exit(1)
                  pk = r2.stdout.strip().split("\n")[0]
                  if not pk: break
                  nxt = norm(pk)
                  if nxt == cur: break
                  cur = nxt
              chain_knames = {os.path.basename(c) for c in chain}
              print(f"osd_link={l} target={tgt} ancestry={chain}")
              for exp in expected:
                  d = resolve_now(exp)
                  if d["kname"] in chain_knames:
                      print(f"CEPH_FAIL osd link {l} ancestry hits candidate {d['kname']}"); sys.exit(1)
          # ceph-volume if present
          cv = subprocess.run(["which","ceph-volume"], capture_output=True, text=True)
          if cv.returncode == 0:
              for sub in ("lvm list","raw list"):
                  r = subprocess.run(f"ceph-volume {sub}", shell=True, capture_output=True, text=True)
                  if r.returncode != 0: print(f"CEPH_FAIL ceph-volume {sub} rc={r.returncode}"); sys.exit(1)
                  for exp in expected:
                      d = resolve_now(exp)
                      if d["path"] in r.stdout: print(f"CEPH_FAIL ceph-volume {d['path']}"); sys.exit(1)
              print("ceph_volume=AVAILABLE clean")
          else:
              print("ceph_volume=UNAVAILABLE")
          print("CEPH_EXCLUSION_6of6_OK" if len(expected)==6 else "CEPH_OK")
          PYEOF
      register: ph7c
      changed_when: false

    # ═══════════════════ K8S STORAGE STATE ═══════════════════
    - name: PHASE 10 — Kubernetes storage state (fail-closed)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"KUBECTL_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          crd = kget("get","crd")
          linstor_crds = [i["metadata"]["name"] for i in crd.get("items",[]) if any(k in i["metadata"]["name"].lower() for k in ("linstor","piraeus","drbd","linbit"))]
          csi = kget("get","csidriver"); sc = kget("get","storageclass"); pv = kget("get","pv"); pvc = kget("get","pvc","-A")
          print(f"linstor_crds={len(linstor_crds)} csidriver={len(csi.get('items',[]))} storageclass={len(sc.get('items',[]))} pv={len(pv.get('items',[]))} pvc={len(pvc.get('items',[]))}")
          if linstor_crds or csi.get("items",[]) or sc.get("items",[]) or pv.get("items",[]) or pvc.get("items",[]):
              print("PREEXISTING_LINSTOR_STORAGE"); sys.exit(1)
          print("K8S_STORAGE_CLEAN")
          PYEOF
      register: ph10
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══════════════════ FULL P1-P4 POSTCHECK ═══════════════════
    - name: P1 POST — bond + VLAN + default route
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_POST_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_POST_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_POST_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_POST_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_POST_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_POST_FAIL default"; exit 1; }
          echo "P1_POST_OK"
      register: p1post
      changed_when: false
      when: p5a_mode != 'final-dm-ceph'

    - name: P2 POST — containerd + kubelet + swap
      ansible.builtin.shell:
        cmd: |
          ctd=$(ctr version 2>/dev/null | grep -m1 -i 'Version' | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          echo "host=$(hostname) containerd=$ctd kubelet=$klt swap=$sw"
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_POST_FAIL"; exit 1; }
          echo "P2_POST_OK"
      register: p2post
      changed_when: false
      when: p5a_mode != 'final-dm-ceph'

    - name: P3 POST — etcd JSON-aware + livez + readyz
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          base = [*KC,"-n","kube-system","exec","etcd-node-01","--","etcdctl",
                  "--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379",
                  "--cacert=/etc/kubernetes/pki/etcd/ca.crt","--cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt",
                  "--key=/etc/kubernetes/pki/etcd/healthcheck-client.key"]
          ml = subprocess.run(base+["member","list","--write-out=json"], capture_output=True, text=True)
          members = json.loads(ml.stdout).get("members",[]) if ml.returncode==0 else []
          mlearn = sum(1 for m in members if m.get("isLearner"))
          st = subprocess.run(base+["endpoint","status","--write-out=json"], capture_output=True, text=True)
          eps = json.loads(st.stdout) if st.returncode==0 else []
          elearn = sum(1 for e in eps if e.get("Status",{}).get("isLearner"))
          leaders = set(str(e.get("Status",{}).get("leader")) for e in eps if e.get("Status",{}).get("leader"))
          leaders.discard("0")
          aep = sum(1 for e in eps if str(e.get("Status",{}).get("header",{}).get("member_id")) in leaders)
          h = subprocess.run(base+["endpoint","health"], capture_output=True, text=True)
          healthy = h.stdout.count("is healthy")
          kv = subprocess.run(KC+["get","pods","-n","kube-system"], capture_output=True, text=True)
          kvc = kv.stdout.count("kube-vip")
          rz = subprocess.run(KC+["get","--raw=/readyz"], capture_output=True, text=True).stdout.strip()
          livez = []
          for ip in ["172.30.140.101","172.30.140.102","172.30.140.103"]:
              r = subprocess.run(["curl","-sk","--max-time","5",f"https://{ip}:6443/livez"], capture_output=True, text=True)
              livez.append(r.stdout.strip() if r.returncode==0 else "ERR")
          ok_livez = sum(1 for v in livez if v=="ok")
          print(f"members={len(members)} mlearn={mlearn} elearn={elearn} leaders={len(leaders)} aep={aep} health={healthy} kube-vip={kvc} readyz={rz} livez={ok_livez}/3")
          if len(members)!=3 or mlearn!=0 or elearn!=0 or len(leaders)!=1 or aep!=1 or healthy!=3 or kvc!=3 or rz!="ok" or ok_livez!=3:
              print("P3_POST_FAIL"); sys.exit(1)
          print("P3_POST_OK")
          PYEOF
      register: p3post
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    - name: P4A POST — Nodes/calico/CoreDNS/IPPool/BGP/autodetect
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print("P4A_POST_FAIL"); sys.exit(1)
              return json.loads(r.stdout)
          nodes = kget("get","nodes")
          ready = sum(1 for n in nodes.get("items",[]) if any(c["type"]=="Ready" and c["status"]=="True" for c in n.get("status",{}).get("conditions",[])))
          calico = kget("get","pods","-n","kube-system","-l","k8s-app=calico-node")
          cn = sum(1 for p in calico.get("items",[]) if all(c.get("status")=="True" for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"))
          ctrl = kget("get","pods","-n","kube-system","-l","k8s-app=calico-kube-controllers")
          cctrl = sum(1 for p in ctrl.get("items",[]) if all(c.get("status")=="True" for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Ready"))
          dns = kget("get","deployment","coredns","-n","kube-system")
          dns_des = dns["spec"].get("replicas"); dns_avail = dns["status"].get("availableReplicas",0); dns_ready = dns["status"].get("readyReplicas",0)
          ipp = kget("get","ippools.crd.projectcalico.org")
          pools = ipp.get("items",[]); p = pools[0] if len(pools)==1 else None
          ipok = (p is not None and p["spec"].get("cidr")=="10.244.0.0/16" and p["spec"].get("ipipMode")=="Always" and p["spec"].get("natOutgoing") is True and not p["spec"].get("disabled",False))
          bgp = {}
          for n in nodes.get("items",[]):
              ip = n.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","").split("/")[0]
              bgp[n["metadata"]["name"]] = ip
          want = {"node-01":"172.30.140.101","node-02":"172.30.140.102","node-03":"172.30.140.103"}
          bgpok = all(bgp.get(h)==w for h,w in want.items())
          ds = kget("get","daemonset","calico-node","-n","kube-system")
          env = {c["name"]: c.get("value","") for c in ds["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          admok = env.get("IP_AUTODETECTION_METHOD","") == "interface=bond0.140"
          print(f"nodes={ready} calico={cn} ctrl={cctrl} coredns={dns_des}/{dns_avail}/{dns_ready} ippool={ipok} bgp={bgpok} autodetect={admok}")
          if ready!=3 or cn!=3 or cctrl!=1 or dns_des!=2 or dns_avail!=2 or dns_ready!=2 or not ipok or not bgpok or not admok:
              print("P4A_POST_FAIL"); sys.exit(1)
          print("P4A_POST_OK")
          PYEOF
      register: p4apost
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    - name: P4B POST — final-state (NotFound, 0 policies)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          r = subprocess.run(KC+["get","namespace","p4b-netpol-validation","-o","json"], capture_output=True, text=True)
          if r.returncode == 0: print("P4B_POST_FAIL ns"); sys.exit(1)
          if "NotFound" not in r.stderr and "NotFound" not in r.stdout:
              print("P4B_POST_FAIL ns query"); sys.exit(1)
          np = subprocess.run(KC+["get","networkpolicy","-A","-o","json"], capture_output=True, text=True)
          if np.returncode != 0: print("P4B_POST_FAIL np"); sys.exit(1)
          total = len(json.loads(np.stdout).get("items",[]))
          print(f"networkpolicy_total={total}")
          if total != 0: print("P4B_POST_FAIL"); sys.exit(1)
          print("P4B_POST_OK")
          PYEOF
      register: p4bpost
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    - name: VIP POST — aggregate owner == 1
      ansible.builtin.shell:
        cmd: "ip -4 addr show dev bond0.140 2>/dev/null | grep -c '172.30.140.100/32' || true"
      register: vipowner
      changed_when: false
      when: p5a_mode != 'final-dm-ceph'

    - name: VIP POST — assert aggregate == 1
      ansible.builtin.shell:
        cmd: |
          total={{ groups['all'] | map('extract', hostvars, 'vipowner') | select('defined') | map(attribute='stdout') | map('int') | sum }}
          echo "VIP_owners=$total"
          [ "$total" = "1" ] || exit 1
      register: vipagg
      changed_when: false
      run_once: true
      delegate_to: node-01
      when: p5a_mode != 'final-dm-ceph'

    - name: PHASE 13 — final gate summary
      ansible.builtin.debug:
        msg: "P5A final-busy-regression completed (read-only)"
      run_once: true
      delegate_to: node-01
