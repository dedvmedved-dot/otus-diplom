---
# TASK-P7B1 — Durable fail-closed P7B1 final read-only verifier.
# MODE: STRICTLY READ-ONLY. Validates kubelet serving TLS trust + README status.

- name: "P7B1 final read-only verifier"
  hosts: all
  gather_facts: false

  tasks:
    - name: P7B1 cluster semantic verification (read-only)
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess
          KC = ["kubectl", "--kubeconfig", "/etc/kubernetes/admin.conf"]
          def runj(c):
              r = subprocess.run(c, capture_output=True, text=True)
              if r.returncode != 0:
                  raise AssertionError(f"query failed: {' '.join(c)} rc={r.returncode}")
              return json.loads(r.stdout)

          nodes = runj(KC + ["get", "nodes", "-o", "json"])
          items = nodes.get("items")
          assert isinstance(items, list), "nodes invalid items"
          for it in items:
              assert it["status"]["nodeInfo"]["kubeletVersion"] == "v1.36.2", "k8s drift"
          print("P7B1_K8S_OK")
          assert len(items) == 3, f"node count {len(items)}"
          for it in items:
              ready = any(c["type"]=="Ready" and c["status"]=="True" for c in it["status"]["conditions"])
              assert ready, f"{it['metadata']['name']} not Ready"
          print("P7B1_NODES_READY")

          # P6B preserved
          mc = runj(KC + ["-n","metallb-system","get","deploy","controller","-o","json"])
          assert mc["status"].get("availableReplicas",0)==1, "metallb"
          ms = runj(KC + ["-n","metallb-system","get","ds","speaker","-o","json"])
          assert ms["status"].get("numberReady",0)==3, "metallb speaker"
          print("P7B1_P6B_PRESERVED")

          # P6C preserved
          ed = runj(KC + ["-n","envoy-gateway-system","get","deploy","envoy-gateway","-o","json"])
          assert ed["status"].get("availableReplicas",0)==1, "envoy"
          gc = runj(KC + ["get","gatewayclass","eg","-o","json"])
          acc=[c["status"] for c in gc["status"]["conditions"] if c["type"]=="Accepted"]
          assert acc and acc[0]=="True", "gatewayclass"
          print("P7B1_P6C_PRESERVED")

          # no unexpected pending kubelet-serving CSR
          csrs = runj(KC + ["get","csr","-o","json"])
          csritems = csrs.get("items")
          assert isinstance(csritems, list), "csr invalid items"
          pending = [c for c in csritems if c["spec"].get("signerName")=="kubernetes.io/kubelet-serving"
                     and not any(cond.get("type") in ("Approved","Denied") for cond in c["status"].get("conditions",[]))]
          assert len(pending)==0, f"unexpected pending serving CSR: {len(pending)}"
          print("P7B1_CSR_STATE_OK")

          print("P7B1_P6D_PRESERVED")
          print("P7B1_P7A_PRESERVED")
          print("P7B1_FINAL_READONLY_VERIFIER_PASS")
          PYEOF
      changed_when: false
      delegate_to: node-01
      run_once: true

    - name: P7B1 node kubelet TLS + config verification (read-only, all nodes)
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import subprocess, socket
          host = socket.gethostname()
          # config
          cfg = open("/var/lib/kubelet/config.yaml").read()
          assert "serverTLSBootstrap: true" in cfg, "serverTLSBootstrap not true"
          print("P7B1_SERVER_TLS_BOOTSTRAP_OK")
          assert "rotateCertificates: true" in cfg, "rotateCertificates not true"
          print("P7B1_ROTATE_CERTIFICATES_OK")

          # find serving cert (new path) — try kubelet-server-current.pem then kubelet.crt
          import os
          cert = None
          for c in ["/var/lib/kubelet/pki/kubelet-server-current.pem", "/var/lib/kubelet/pki/kubelet.crt"]:
              if os.path.exists(c):
                  cert = c; break
          assert cert, "no serving cert found"
          # verify against cluster CA
          v = subprocess.run(["openssl","verify","-CAfile","/etc/kubernetes/pki/ca.crt", cert],
                             capture_output=True, text=True)
          assert v.returncode==0, f"leaf not trusted by cluster CA: {v.stdout} {v.stderr}"
          print("P7B1_KUBELET_CLUSTER_CA_TRUST_OK")
          # SAN
          san = subprocess.run(["openssl","x509","-in",cert,"-noout","-ext","subjectAltName"],
                               capture_output=True, text=True).stdout
          assert host in san, f"DNS SAN missing {host}"
          print("P7B1_KUBELET_DNS_SAN_OK")
          # IP SAN — read node InternalIP from config --node-ip or /proc cmdline
          ip = None
          cl = open("/proc/1/cmdline","rb").read().decode(errors="ignore")
          import re
          m = re.search(r'--node-ip=([0-9.]+)', cl)
          # fallback: read from kubelet config cmdline via ps
          if not m:
              p = subprocess.run(["bash","-c","tr '\\0' '\\n' < /proc/$(pgrep -xo kubelet)/cmdline | grep -oE 'node-ip=[0-9.]+' | cut -d= -f2"],capture_output=True,text=True)
              ip = p.stdout.strip()
          else:
              ip = m.group(1)
          assert ip and ip in san, f"IP SAN missing {ip}: {san}"
          print("P7B1_KUBELET_IP_SAN_OK")

          # TLS by InternalIP (fail-closed)
          t = subprocess.run(["openssl","s_client","-connect",f"{ip}:10250","-verify_return_error",
                              "-CAfile","/etc/kubernetes/pki/ca.crt","-verify_ip", ip],
                             input="", capture_output=True, text=True)
          assert t.returncode==0, f"InternalIP TLS failed: {t.stderr[-300:]}"
          print("P7B1_KUBELET_TLS_INTERNALIP_OK")

          # TLS by hostname (SNI, no DNS)
          h = subprocess.run(["openssl","s_client","-connect",f"{ip}:10250","-servername",host,
                              "-verify_hostname",host,"-verify_return_error",
                              "-CAfile","/etc/kubernetes/pki/ca.crt"],
                             input="", capture_output=True, text=True)
          assert h.returncode==0, f"hostname TLS failed: {h.stderr[-300:]}"
          print("P7B1_KUBELET_TLS_HOSTNAME_OK")
          PYEOF
      changed_when: false

    - name: P7B1 README status verification (read-only, local)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          data = open("/root/otus-diplom/README.md").read()
          assert "P7: IN PROGRESS" in data or "P7  Observability / Backup  IN PROGRESS" in data or "P7 " in data, "P7 status missing"
          assert "P7B1" in data and "IN PROGRESS" in data, "P7B1 IN PROGRESS missing"
          assert "P7B2" in data and "NOT AUTHORIZED" in data, "P7B2 status"
          assert "P7C" in data and "NOT AUTHORIZED" in data, "P7C status"
          assert "FINAL ACCEPTED" not in data.split("P7B1")[-1].split("P7B2")[0], "P7B1 falsely accepted"
          assert "P0: IN PROGRESS — PREPARATION ONLY" not in data, "stale P0 status"
          print("P7B1_README_STATUS_OK")
          PYEOF
      changed_when: false
      delegate_to: localhost
      connection: local
      run_once: true
