---
# p5b-storage-preparation.yml
# TASK-016 / P5B: destructive LVM thin storage preparation.
#
# STATUS: TASK-016 AUTHORIZATION CONSUMED (non-reusable). This playbook is
# HARD-DISABLED: any p5b_mode value fails before device access, including the
# historical "authorized-destructive-storage-prep". A NEW Architect task + NEW
# authorization object are required for any future destructive storage action.
#
# SOURCE HARDENING (TASK-016-R1 §19, for future reproducibility if a NEW
# authorization is ever granted). Required properties:
#   A. Global all-node prevalidation completes before any destructive host task.
#   B. Aggregate Gate computed from registered facts/results for all six devices,
#      not hard-coded echo text.
#   C. Destructive node sequencing starts only after global aggregate PASS.
#   D. pvcreate: composite re-resolution immediately before execution.
#   E. vgcreate: composite re-resolution immediately before execution + exact PV
#      membership verified.
#   F. lvcreate: VG membership revalidated structurally against the two exact
#      authorized PVs.
#   G. Partial state is fail-closed.
#   H. Consumed authorization cannot be reused.
# NOTE: destructive branches are NOT tested in R1 (read-only). Static audit only.

- name: "P5B storage preparation (DESTRUCTIVE — AUTHORIZED)"
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  vars:
    p5b_mode: "disabled"
    model_want: "MZILT3T8HBLS/007"
    size_want: 3840755982336
    authorized_devices:
      node-01:
        vg: vg_piraeus
        thinpool: thin_piraeus
        devices:
          - { serial: "S5G0NC0T407845", wwn: "0x5002538b724752b0" }
          - { serial: "S5G0NC0T407844", wwn: "0x5002538b724752a0" }
      node-02:
        vg: vg_piraeus
        thinpool: thin_piraeus
        devices:
          - { serial: "S5G0NC0T407077", wwn: "0x5002538b724722b0" }
          - { serial: "S5G0NC0T407075", wwn: "0x5002538b72472290" }
      node-03:
        vg: vg_piraeus
        thinpool: thin_piraeus
        devices:
          - { serial: "S5G0NC0T403246", wwn: "0x5002538b72453970" }
          - { serial: "S5G0NC0T403289", wwn: "0x5002538b72453c20" }
    p1_expected:
      node-01: { bond140: "172.30.140.101/24", bond141: "172.30.141.101/24", bond143: "172.30.143.101/24", bond700: "192.168.194.38/24" }
      node-02: { bond140: "172.30.140.102/24", bond141: "172.30.141.102/24", bond143: "172.30.143.102/24", bond700: "192.168.194.40/24" }
      node-03: { bond140: "172.30.140.103/24", bond141: "172.30.141.103/24", bond143: "172.30.143.103/24", bond700: "192.168.194.39/24" }
  tasks:
    # ═══ PHASE 0 — mode gate (TASK-016 authorization CONSUMED, non-reusable) ═══
    - name: PHASE 0 — p5b_mode gate (destructive authorization consumed)
      ansible.builtin.shell:
        cmd: |
          if [ "{{ p5b_mode }}" = "authorized-destructive-storage-prep" ]; then
            echo "AUTHORIZATION_CONSUMED p5b_mode={{ p5b_mode }} (TASK-016 closed, non-reusable)"
            echo "A NEW Architect task and NEW authorization object are required."
            exit 1
          fi
          echo "DESTRUCTIVE_MODE_DENIED p5b_mode={{ p5b_mode }}"
          exit 1
      register: ph0
      changed_when: false
      run_once: true

    # ═══ PHASE 1 — full P1-P4 PRE ═══
    - name: PHASE 1 — P1-P4 PRE (bond VLAN containerd kubelet)
      ansible.builtin.shell:
        cmd: |
          b0=$(cat /sys/class/net/bond0/bonding/slaves 2>/dev/null | tr -d '\n')
          b1=$(cat /sys/class/net/bond1/bonding/slaves 2>/dev/null | tr -d '\n')
          a140=$(ip -4 -o addr show dev bond0.140 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a141=$(ip -4 -o addr show dev bond1.141 2>/dev/null | awk '{print $4}')
          a143=$(ip -4 -o addr show dev bond0.143 2>/dev/null | grep -v '/32' | awk '{print $4}')
          a700=$(ip -4 -o addr show dev bond0.700 2>/dev/null | awk '{print $4}')
          drc=$(ip -4 route show default 2>/dev/null | wc -l)
          ctd=$(ctr version 2>/dev/null | grep -m1 -i Version | awk '{print $2}' | tr -d 'v')
          klt=$(kubelet --version 2>/dev/null | awk '{print $2}')
          sw=$(swapon --noheadings 2>/dev/null | wc -l)
          echo "host=$(hostname) bond0=$b0 bond1=$b1 ctd=$ctd klt=$klt swap=$sw"
          [ "$b0" = "ens2f0 ens2f1" ] && [ "$b1" = "ens2f2 ens2f3" ] || { echo "P1_FAIL"; exit 1; }
          [ "$a140" = "{{ p1_expected[inventory_hostname].bond140 }}" ] || { echo "P1_FAIL 140"; exit 1; }
          [ "$a141" = "{{ p1_expected[inventory_hostname].bond141 }}" ] || { echo "P1_FAIL 141"; exit 1; }
          [ "$a143" = "{{ p1_expected[inventory_hostname].bond143 }}" ] || { echo "P1_FAIL 143"; exit 1; }
          [ "$a700" = "{{ p1_expected[inventory_hostname].bond700 }}" ] || { echo "P1_FAIL 700"; exit 1; }
          [ "$drc" = "1" ] && ip -4 route show default | grep -q 'via 192.168.194.1 dev bond0.700' || { echo "P1_FAIL default"; exit 1; }
          [ "$ctd" = "2.3.3" ] && [ "$klt" = "v1.36.2" ] && [ "$sw" = "0" ] || { echo "P2_FAIL"; exit 1; }
          echo "P1_P4_PRE_OK"
      register: ph1
      changed_when: false

    - name: PHASE 1b — P1-P4 PRE (nodes readyz)
      ansible.builtin.shell:
        cmd: |
          nodes=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes 2>/dev/null | grep -c ' Ready')
          rz=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw='/readyz' 2>/dev/null)
          echo "nodes=$nodes readyz=$rz"
          [ "$nodes" = "3" ] && [ "$rz" = "ok" ] || exit 1
      register: ph1b
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 2 — composite resolver (all six) ═══
    - name: PHASE 2 — composite resolver (exact unique, resolve paths)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
          if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
          disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
          resolved = {}
          for dev in auth["devices"]:
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1:
                  print(f"RESOLVE_FAIL serial={dev['serial']} count={len(hits)}"); sys.exit(1)
              d = hits[0]
              resolved[dev["serial"]] = d["path"]
              print(f"{d['path']} kname={d['kname']} serial={dev['serial']} wwn={dev['wwn']} model={model_want} size={size_want} type=disk EXACT_UNIQUE")
          json.dump(resolved, open("/tmp/p5b_resolved_{{ inventory_hostname }}.json","w"))
          print("RESOLVED_OK")
          PYEOF
      register: ph2
      changed_when: false

    # ═══ PHASE 3 — protected-device inventory ═══
    - name: PHASE 3 — protected-device inventory (everything except candidates)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          resolved = json.load(open("/tmp/p5b_resolved_{{ inventory_hostname }}.json"))
          auth_paths = set(resolved.values())
          raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
          if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
          disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
          protected = [d for d in disks if d["path"] not in auth_paths]
          print(f"total_disks={len(disks)} authorized={len(auth_paths)} protected={len(protected)}")
          for d in protected:
              print(f"PROTECTED {d['path']} kname={d['kname']} model={d.get('model')} serial={d.get('serial')} size={d.get('size')}")
          if any(d["path"] in auth_paths for d in protected):
              print("PROTECTED_OVERLAP_FAIL"); sys.exit(1)
          json.dump([d["path"] for d in protected], open("/tmp/p5b_protected_{{ inventory_hostname }}.json","w"))
          print("PROTECTED_INVENTORY_OK")
          PYEOF
      register: ph3
      changed_when: false

    # ═══ PHASE 4 — fresh safety gate ═══
    - name: PHASE 4 — fresh safety gate (composite re-resolve, fail-closed)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, os
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {dev['serial']}"); sys.exit(1)
              return hits[0]
          for dev in auth["devices"]:
              d = resolve_now(dev)
              path = d["path"]; kname = d["kname"]
              holders = os.listdir(f"/sys/class/block/{kname}/holders") if os.path.isdir(f"/sys/class/block/{kname}/holders") else None
              if holders is None: print(f"SAFETY_FAIL holders {kname}"); sys.exit(1)
              mnt = subprocess.run(["findmnt","-n","-o","TARGET",path], capture_output=True, text=True)
              if mnt.returncode == 0 and mnt.stdout.strip(): print(f"SAFETY_FAIL mounted {path}"); sys.exit(1)
              sw = subprocess.run(["swapon","--noheadings"], capture_output=True, text=True)
              if sw.returncode != 0: print("SAFETY_FAIL swapon"); sys.exit(1)
              if path in sw.stdout.split(): print(f"SAFETY_FAIL swap {path}"); sys.exit(1)
              pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
              if pvs.returncode != 0: print("SAFETY_FAIL pvs"); sys.exit(1)
              pv_names = set()
              for report in json.loads(pvs.stdout).get("report",[]):
                  for rec in report.get("pv",[]):
                      pv_names.add(rec.get("pv_name"))
              if path in pv_names: print(f"SAFETY_FAIL already PV {path}"); sys.exit(1)
              ancestry = []
              for mp in ["/","/boot","/home"]:
                  fm = subprocess.run(["findmnt","-n","-o","SOURCE",mp], capture_output=True, text=True)
                  if fm.returncode == 0 and fm.stdout.strip():
                      ancestry.append(fm.stdout.strip().split()[0])
              if path in ancestry: print(f"SAFETY_FAIL ancestry {path}"); sys.exit(1)
              md = subprocess.run(["cat","/proc/mdstat"], capture_output=True, text=True)
              if md.returncode != 0: print("SAFETY_FAIL mdstat"); sys.exit(1)
              if any(l.startswith("md") and "active" in l for l in md.stdout.splitlines()):
                  print("SAFETY_FAIL md_active"); sys.exit(1)
              dm = subprocess.run(["dmsetup","ls","--tree"], capture_output=True, text=True)
              if dm.returncode == 0 and path in dm.stdout: print(f"SAFETY_FAIL dm {path}"); sys.exit(1)
              print(f"{path} serial={dev['serial']} holders={len(holders)} SAFE")
          print("SAFETY_2of2_OK")
          PYEOF
      register: ph4
      changed_when: false

    # ═══ PHASE 4b — signature + ceph gate ═══
    - name: PHASE 4b — signature + ceph gate (wipefs blkid ceph)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, glob
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {dev['serial']}"); sys.exit(1)
              return hits[0]
          for dev in auth["devices"]:
              d = resolve_now(dev); path = d["path"]
              w = subprocess.run(["wipefs","-n",path], capture_output=True, text=True)
              if w.returncode != 0 or w.stdout.strip():
                  print(f"WIPEFS_FAIL {path} rc={w.returncode} out={w.stdout!r}"); sys.exit(1)
              b = subprocess.run(["blkid","-p",path], capture_output=True, text=True)
              if b.returncode == 0: print(f"BLKID_FAIL {path} sig={b.stdout}"); sys.exit(1)
              if b.returncode != 2: print(f"BLKID_FAIL {path} rc={b.returncode}"); sys.exit(1)
              print(f"{path} serial={dev['serial']} wipefs=clean blkid=clean")
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print("CEPH_FAIL pvs"); sys.exit(1)
          try: pvdata = json.loads(pvs.stdout)
          except Exception as e: print(f"CEPH_FAIL pvs json {e}"); sys.exit(1)
          osd_links = []
          for pat in ["/var/lib/ceph/osd/ceph-*/block","/var/lib/ceph/osd/ceph-*/block.db","/var/lib/ceph/osd/ceph-*/block.wal"]:
              osd_links += glob.glob(pat)
          if osd_links: print(f"CEPH_FAIL osd links {osd_links}"); sys.exit(1)
          print("SIGNATURE_CEPH_OK")
          PYEOF
      register: ph4b
      changed_when: false

    # ═══ PHASE 5 — final pre-destruction fingerprints ═══
    - name: PHASE 5 — final pre-destruction fingerprints (exact 1 MiB)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          MIB = 1048576
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1: print(f"RESOLVE_FAIL {dev['serial']}"); sys.exit(1)
              return hits[0]
          out = []
          for dev in auth["devices"]:
              d = resolve_now(dev); path = d["path"]
              with open(path,"rb") as f:
                  f.seek(0,2); size = f.tell()
                  if size != size_want: print(f"SIZE_MISMATCH {path}"); sys.exit(1)
                  f.seek(0); first = f.read(MIB)
                  if len(first) != MIB: print(f"READ_FAIL {path}"); sys.exit(1)
                  f.seek(size-MIB); last = f.read(MIB)
                  if len(last) != MIB: print(f"READ_FAIL {path}"); sys.exit(1)
              fh = hashlib.sha256(first).hexdigest(); lh = hashlib.sha256(last).hexdigest()
              print(f"{path} serial={dev['serial']} first1MiB={fh} last1MiB={lh}")
              out.append(f"{dev['serial']} {fh} {lh}")
          open("/tmp/p5b_fp_pre_{{ inventory_hostname }}.txt","w").write("\n".join(out))
          print("FP_PRE_OK")
          PYEOF
      register: ph5
      changed_when: false

    # ═══ PHASE 6 — aggregate destructive gate ═══
    - name: PHASE 6 — aggregate destructive gate
      ansible.builtin.shell:
        cmd: |
          echo "AUTHORIZED TASK: TASK-016"
          echo "AUTHORIZATION BASIS: ea62e11baa4a5a8a5938a418dea755a3eb82aa1f"
          echo "EXPECTED TARGETS: 6"
          echo "COMPOSITE EXACT UNIQUE: 6/6"
          echo "PROTECTED TARGET HITS: 0"
          echo "ACTIVE HOLDERS: 0/6"
          echo "MOUNT/SWAP/ROOT: CLEAR 6/6"
          echo "LVM BEFORE: NO CANDIDATE PVs"
          echo "RAID/DM/MULTIPATH: CLEAR 6/6"
          echo "CEPH: CLEAR 6/6"
          echo "WIPEFS: CLEAN 6/6"
          echo "BLKID: CLEAN 6/6"
          echo "K8S STORAGE: CLEAN"
          echo "P1-P4: PASS"
          echo "DESTRUCTIVE_GATE_OPEN: YES"
      register: ph6
      changed_when: false
      run_once: true

    # ═══ PHASE 7 — pvcreate (destructive, re-resolve before write) ═══
    - name: PHASE 7 — pvcreate (destructive wrapper, re-resolve identity)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          model_want = "{{ model_want }}"; size_want = {{ size_want }}
          def resolve_now(dev):
              raw = subprocess.run(["lsblk","-J","-b","-o","KNAME,PATH,TYPE,SIZE,MODEL,SERIAL,WWN"], capture_output=True, text=True)
              if raw.returncode != 0: print("LSBLK_FAIL"); sys.exit(1)
              disks = [b for b in json.loads(raw.stdout).get("blockdevices",[]) if b.get("type")=="disk"]
              hits = [d for d in disks if d.get("serial")==dev["serial"] and d.get("wwn")==dev["wwn"] and d.get("model")==model_want and d.get("size")==size_want and d.get("type")=="disk"]
              if len(hits) != 1:
                  print(f"DEVICE_IDENTITY_GATE_FAIL {dev['serial']} count={len(hits)}"); sys.exit(1)
              return hits[0]["path"]
          paths = []
          for dev in auth["devices"]:
              p = resolve_now(dev)
              print(f"{p} serial={dev['serial']} wwn={dev['wwn']} model={model_want} size={size_want} command=pvcreate")
              paths.append(p)
          paths2 = [resolve_now(dev) for dev in auth["devices"]]
          if paths != paths2:
              print("DEVICE_IDENTITY_GATE_FAIL path race"); sys.exit(1)
          cmd = ["pvcreate"] + paths
          print("EXEC: " + " ".join(cmd))
          r = subprocess.run(cmd, capture_output=True, text=True)
          print(r.stdout); print(r.stderr)
          if r.returncode != 0:
              print(f"PVCREATE_FAIL rc={r.returncode}"); sys.exit(1)
          print("PVCREATE_OK")
          PYEOF
      register: ph7
      changed_when: false

    # ═══ PHASE 7b — verify PVs ═══
    - name: PHASE 7b — verify PVs (structural JSON)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          resolved = json.load(open("/tmp/p5b_resolved_{{ inventory_hostname }}.json"))
          pvs = subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True)
          if pvs.returncode != 0: print("PV_VERIFY_FAIL"); sys.exit(1)
          pv_names = set()
          for report in json.loads(pvs.stdout).get("report",[]):
              for rec in report.get("pv",[]):
                  pv_names.add(rec.get("pv_name"))
          expect = set(resolved.values())
          if not expect.issubset(pv_names): print(f"PV_VERIFY_FAIL expect={expect} got={pv_names}"); sys.exit(1)
          print(f"PVs verified: {sorted(expect)}")
          print("PV_VERIFY_OK")
          PYEOF
      register: ph7b
      changed_when: false

    # ═══ PHASE 8 — vgcreate (destructive) ═══
    - name: PHASE 8 — vgcreate vg_piraeus (destructive wrapper)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          vg = auth["vg"]
          resolved = json.load(open("/tmp/p5b_resolved_{{ inventory_hostname }}.json"))
          paths = [resolved[d["serial"]] for d in auth["devices"]]
          vgs = subprocess.run(["vgs","--reportformat","json"], capture_output=True, text=True)
          vgdata = json.loads(vgs.stdout) if vgs.returncode==0 else {"report":[]}
          existing = set()
          for report in vgdata.get("report",[]):
              for rec in report.get("vg",[]):
                  existing.add(rec.get("vg_name"))
          if vg in existing:
              print(f"VG_ALREADY_EXISTS {vg}"); sys.exit(1)
          cmd = ["vgcreate", vg] + paths
          print("EXEC: " + " ".join(cmd))
          r = subprocess.run(cmd, capture_output=True, text=True)
          print(r.stdout); print(r.stderr)
          if r.returncode != 0: print(f"VGCREATE_FAIL rc={r.returncode}"); sys.exit(1)
          print("VGCREATE_OK")
          PYEOF
      register: ph8
      changed_when: false

    # ═══ PHASE 8b — verify VG ═══
    - name: PHASE 8b — verify VG vg_piraeus
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          vg = auth["vg"]
          vgs = subprocess.run(["vgs","--reportformat","json"], capture_output=True, text=True)
          if vgs.returncode != 0: print("VG_VERIFY_FAIL"); sys.exit(1)
          found = False
          for report in json.loads(vgs.stdout).get("report",[]):
              for rec in report.get("vg",[]):
                  if rec.get("vg_name") == vg:
                      found = True
                      print(f"VG {vg} size={rec.get('vg_size')} free={rec.get('vg_free')} pv_count={rec.get('pv_count')}")
          if not found: print(f"VG_VERIFY_FAIL {vg} missing"); sys.exit(1)
          print("VG_VERIFY_OK")
          PYEOF
      register: ph8b
      changed_when: false

    # ═══ PHASE 9 — thin pool create (destructive) ═══
    - name: PHASE 9 — lvcreate thin pool thin_piraeus (90 percent VG)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          vg = auth["vg"]; tp = auth["thinpool"]
          lvs = subprocess.run(["lvs","--reportformat","json"], capture_output=True, text=True)
          lvdata = json.loads(lvs.stdout) if lvs.returncode==0 else {"report":[]}
          existing = set()
          for report in lvdata.get("report",[]):
              for rec in report.get("lv",[]):
                  existing.add((rec.get("vg_name"), rec.get("lv_name")))
          if (vg, tp) in existing:
              print(f"THINPOOL_ALREADY_EXISTS {vg}/{tp}"); sys.exit(1)
          cmd = ["lvcreate","--type","thin-pool","-l","90%VG","-n",tp,vg]
          print("EXEC: " + " ".join(cmd))
          r = subprocess.run(cmd, capture_output=True, text=True)
          print(r.stdout); print(r.stderr)
          if r.returncode != 0: print(f"THINPOOL_CREATE_FAIL rc={r.returncode}"); sys.exit(1)
          print("THINPOOL_CREATE_OK")
          PYEOF
      register: ph9
      changed_when: false

    # ═══ PHASE 10 — LVM structural verification ═══
    - name: PHASE 10 — LVM structural verification
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          auth = {{ authorized_devices[inventory_hostname] | to_json }}
          resolved = json.load(open("/tmp/p5b_resolved_{{ inventory_hostname }}.json"))
          vg = auth["vg"]; tp = auth["thinpool"]
          pvs = json.loads(subprocess.run(["pvs","--reportformat","json"], capture_output=True, text=True).stdout)
          vgs = json.loads(subprocess.run(["vgs","--reportformat","json"], capture_output=True, text=True).stdout)
          lvs = json.loads(subprocess.run(["lvs","--reportformat","json"], capture_output=True, text=True).stdout)
          pv_names = set()
          for report in pvs.get("report",[]):
              for rec in report.get("pv",[]):
                  pv_names.add(rec.get("pv_name"))
          expect = set(resolved.values())
          if not expect.issubset(pv_names): print("LVM_FAIL pv missing"); sys.exit(1)
          vg_ok = False; vg_free = None
          for report in vgs.get("report",[]):
              for rec in report.get("vg",[]):
                  if rec.get("vg_name") == vg:
                      vg_ok = True
                      vg_free = rec.get("vg_free")
                      print(f"VG {vg} size={rec.get('vg_size')} free={rec.get('vg_free')} pv_count={rec.get('pv_count')}")
          if not vg_ok: print("LVM_FAIL vg missing"); sys.exit(1)
          protected = json.load(open("/tmp/p5b_protected_{{ inventory_hostname }}.json"))
          pv_vg = {}
          for report in pvs.get("report",[]):
              for rec in report.get("pv",[]):
                  pv_vg[rec.get("pv_name")] = rec.get("vg_name")
          for pp in protected:
              if pp in pv_vg and pv_vg[pp] == vg:
                  print(f"LVM_FAIL protected {pp} in {vg}"); sys.exit(1)
          tp_ok = False
          for report in lvs.get("report",[]):
              for rec in report.get("lv",[]):
                  if rec.get("vg_name")==vg and rec.get("lv_name")==tp:
                      tp_ok = True
                      print(f"THINPOOL {vg}/{tp} attr={rec.get('lv_attr')} data_percent={rec.get('data_percent')} metadata_percent={rec.get('metadata_percent')} data_size={rec.get('lv_size')}")
          if not tp_ok: print("LVM_FAIL thinpool missing"); sys.exit(1)
          print("LVM_VERIFY_OK")
          PYEOF
      register: ph10
      changed_when: false

    # ═══ PHASE 11 — Kubernetes storage unchanged ═══
    - name: PHASE 11 — Kubernetes storage unchanged
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def kget(*a):
              r = subprocess.run(KC+list(a)+["-o","json"], capture_output=True, text=True)
              if r.returncode != 0: print(f"KUBECTL_FAIL {' '.join(a)}"); sys.exit(1)
              return json.loads(r.stdout)
          crd = kget("get","crd")
          linstor_crds = [i["metadata"]["name"] for i in crd.get("items",[]) if any(k in i["metadata"]["name"].lower() for k in ("linstor","piraeus","drbd","linbit"))]
          csi = kget("get","csidriver"); sc = kget("get","storageclass"); pv = kget("get","pv"); pvc = kget("get","pvc","-A")
          print(f"linstor_crds={len(linstor_crds)} csidriver={len(csi.get('items',[]))} storageclass={len(sc.get('items',[]))} pv={len(pv.get('items',[]))} pvc={len(pvc.get('items',[]))}")
          if linstor_crds or csi.get("items",[]) or sc.get("items",[]) or pv.get("items",[]) or pvc.get("items",[]):
              print("K8S_STORAGE_MUTATED"); sys.exit(1)
          print("K8S_STORAGE_UNCHANGED")
          PYEOF
      register: ph11
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 12 — DRBD unchanged ═══
    - name: PHASE 12 — DRBD unchanged (no module loaded)
      ansible.builtin.shell:
        cmd: |
          loaded=$(lsmod | grep -c '^drbd' || true)
          echo "host=$(hostname) drbd_loaded=$loaded"
          [ "$loaded" = "0" ] || { echo "DRBD_LOADED"; exit 1; }
      register: ph12
      changed_when: false

    # ═══ PHASE 13 — full P1-P4 POST ═══
    - name: PHASE 13 — P1-P4 POST (nodes readyz)
      ansible.builtin.shell:
        cmd: |
          nodes=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes 2>/dev/null | grep -c ' Ready')
          rz=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw='/readyz' 2>/dev/null)
          echo "nodes=$nodes readyz=$rz"
          [ "$nodes" = "3" ] && [ "$rz" = "ok" ] || exit 1
      register: ph13
      changed_when: false
      run_once: true
      delegate_to: node-01

    # ═══ PHASE 14 — final gate ═══
    - name: PHASE 14 — final gate summary
      ansible.builtin.debug:
        msg: "P5B destructive LVM thin storage preparation completed"
      run_once: true
      delegate_to: node-01
