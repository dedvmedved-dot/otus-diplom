---
# TASK-018-R2 — P5C2 final read-only regression.
# MODE: READ-ONLY FINAL P5C2 / P5 REGRESSION. INFRASTRUCTURE MUTATION = 0.
# Every task read-only, changed=0. Full P1-P4 + P5B + P5C1/DRBD + satellite
# hostNetwork + P5C2 production state + validation cleanup gates.

- name: "P5C2 final read-only regression + verifier contract (TASK-018-R5)"
  hosts: all
  gather_facts: false
  vars:
    op_ns: piraeus-datastore
    val_ns: p5c2-validation
    expected_nodes:
      node-01: "172.30.140.101"
      node-02: "172.30.140.102"
      node-03: "172.30.140.103"
    expected_vlan141:
      node-01: "172.30.141.101"
      node-02: "172.30.141.102"
      node-03: "172.30.141.103"
    expected_mgmt:
      node-01: "192.168.194.38"
      node-02: "192.168.194.40"
      node-03: "192.168.194.39"
    expected_vlan143:
      node-01: "172.30.143.101"
      node-02: "172.30.143.102"
      node-03: "172.30.143.103"
    candidates:
      node-01:
        - serial: S5G0NC0T407845
          wwn: "0x5002538b724752b0"
        - serial: S5G0NC0T407844
          wwn: "0x5002538b724752a0"
      node-02:
        - serial: S5G0NC0T407077
          wwn: "0x5002538b724722b0"
        - serial: S5G0NC0T407075
          wwn: "0x5002538b72472290"
      node-03:
        - serial: S5G0NC0T403246
          wwn: "0x5002538b72453970"
        - serial: S5G0NC0T403289
          wwn: "0x5002538b72453c20"
    candidate_size: "3840755982336"
    candidate_model: "MZILT3T8HBLS/007"
    os_pv:
      node-01: ["/dev/sda3", "astra38644"]
      node-02: ["/dev/sda3", "astra39539"]
      node-03: ["/dev/sda3", "astra03718"]

  tasks:
    # ═══ P1 — network (bond/VLAN/default route) ═══
    - name: P1 — bond slaves + VLAN addresses + default route
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess, sys
          host = "{{ inventory_hostname }}"
          exp140 = "{{ expected_nodes[inventory_hostname] }}"
          exp141 = "{{ expected_vlan141[inventory_hostname] }}"
          exp143 = "{{ expected_vlan143[inventory_hostname] }}"
          exp700 = "{{ expected_mgmt[inventory_hostname] }}"
          def run(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              if r.returncode != 0: return r.returncode, r.stdout, r.stderr
              return 0, r.stdout, r.stderr
          # bond slaves
          for bond, want in [("bond0", ["ens2f0","ens2f1"]), ("bond1", ["ens2f2","ens2f3"])]:
              rc,o,e = run(f"cat /sys/class/net/{bond}/bonding/slaves")
              if rc!=0: print(f"P1_BOND_{bond}_MISSING"); sys.exit(1)
              got = sorted(o.strip().split())
              if got != sorted(want): print(f"P1_BOND_{bond}_SLAVES_MISMATCH got={got} want={want}"); sys.exit(1)
          # VLAN addresses
          def addr(iface):
              rc,o,e = run(f"ip -4 -o addr show dev {iface}")
              if rc!=0: return None
              import re
              m = re.search(r'inet (\d+\.\d+\.\d+\.\d+)/(\d+)', o)
              return m.group(1)+"/"+m.group(2) if m else None
          checks = [("bond0.140", exp140+"/24"), ("bond1.141", exp141+"/24"),
                    ("bond0.143", exp143+"/24"), ("bond0.700", exp700+"/24")]
          for iface, want in checks:
              got = addr(iface)
              if got != want: print(f"P1_ADDR_{iface}_MISMATCH got={got} want={want}"); sys.exit(1)
          # exactly one default route via bond0.700
          rc,o,e = run("ip route show default")
          defs = [l for l in o.splitlines() if l.strip().startswith("default")]
          if len(defs) != 1: print(f"P1_DEFAULT_ROUTE_COUNT={len(defs)}"); sys.exit(1)
          if "192.168.194.1" not in defs[0] or "bond0.700" not in defs[0]:
              print(f"P1_DEFAULT_ROUTE_WRONG {defs[0]}"); sys.exit(1)
          # no default via 140/141/143
          for l in defs:
              for bad in ["172.30.140","172.30.141","172.30.143"]:
                  if bad in l: print(f"P1_DEFAULT_ROUTE_VIA_VLAN {l}"); sys.exit(1)
          print(f"P1_NET_OK {host} bond0={','.join(sorted(o.strip().split()))} ")
          print(f"P1_NET_OK {host}")
          PYEOF
      changed_when: false

    # ═══ P2 — containerd/kubelet/swap ═══
    - name: P2 — containerd 2.3.3 + kubelet v1.36.2 + swap 0
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import subprocess, sys, json
          def run(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          rc,o,e = run("containerd --version 2>/dev/null || ctr version 2>/dev/null")
          if "2.3.3" not in o and "2.3.3" not in e:
              rc2,o2,e2 = run("ctr version")
              if "2.3.3" not in o2:
                  # check containerd binary version via runc info
                  rc3,o3,e3 = run("containerd -v")
                  if "2.3.3" not in o3: print("P2_CONTAINERD_MISMATCH"); sys.exit(1)
          rc,o,e = run("kubelet --version")
          if "v1.36.2" not in o: print("P2_KUBELET_MISMATCH"); sys.exit(1)
          rc,o,e = run("swapon --show=NAME --noheadings")
          sw = [l for l in o.splitlines() if l.strip()]
          if len(sw) != 0: print(f"P2_SWAP_ACTIVE {sw}"); sys.exit(1)
          print("P2_OK containerd=2.3.3 kubelet=v1.36.2 swap=0")
          PYEOF
      changed_when: false

    # ═══ P3 — etcd/kube-vip/api ═══
    - name: P3 — etcd members/health + kube-vip + VIP owner + readyz/livez
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def run(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          def runj(c):
              r = subprocess.run(c, capture_output=True, text=True)
              if r.returncode != 0: return None
              try: return json.loads(r.stdout)
              except: return None
          # etcd members
          rc,o,e = run(KC + ["get","--raw=/api/v1/namespaces/kube-system/endpoints/etcd"])
          # use etcdctl inside etcd pod instead
          pods = runj(KC + ["-n","kube-system","get","pods","-l","component=etcd","-o","json"])
          if not pods: print("P3_ETCD_PODS_NONE"); sys.exit(1)
          items = pods.get("items",[])
          if len(items) != 3: print(f"P3_ETCD_POD_COUNT={len(items)}"); sys.exit(1)
          # member list via etcdctl on one pod
          etcdpod = items[0]["metadata"]["name"]
          rc,o,e = run(KC + ["-n","kube-system","exec",etcdpod,"--","etcdctl","--cacert","/etc/kubernetes/pki/etcd/ca.crt","--cert","/etc/kubernetes/pki/etcd/server.crt","--key","/etc/kubernetes/pki/etcd/server.key","member","list","-w","json"])
          if rc != 0: print(f"P3_ETCDCTL_FAIL {e[:200]}"); sys.exit(1)
          members = json.loads(o)
          names = [m.get("name","") for m in members.get("members",[])]
          if len(names) != 3: print(f"P3_ETCD_MEMBERS={len(names)}"); sys.exit(1)
          learners = [m for m in members.get("members",[]) if m.get("isLearner")]
          if len(learners) != 0: print(f"P3_ETCD_LEARNERS={len(learners)}"); sys.exit(1)
          # endpoint health
          rc,o,e = run(KC + ["-n","kube-system","exec",etcdpod,"--","etcdctl","--cacert","/etc/kubernetes/pki/etcd/ca.crt","--cert","/etc/kubernetes/pki/etcd/server.crt","--key","/etc/kubernetes/pki/etcd/server.key","endpoint","health","--cluster","-w","json"])
          if rc != 0: print(f"P3_ETCD_HEALTH_FAIL {e[:200]}"); sys.exit(1)
          ep = json.loads(o)
          healthy = [x for x in ep if str(x.get("health", x.get("Health",""))).lower() in ("true","1")]
          if len(healthy) != 3: print(f"P3_ETCD_HEALTHY={len(healthy)}/3"); sys.exit(1)
          # endpoint count = 3
          if len(ep) != 3: print(f"P3_ETCD_ENDPOINTS={len(ep)}"); sys.exit(1)
          # unique non-zero leader ID = 1 (from member list leader)
          rc2,o2,e2 = run(KC + ["-n","kube-system","exec",etcdpod,"--","etcdctl","--cacert","/etc/kubernetes/pki/etcd/ca.crt","--cert","/etc/kubernetes/pki/etcd/server.crt","--key","/etc/kubernetes/pki/etcd/server.key","endpoint","status","--cluster","-w","json"])
          if rc2 != 0: print("P3_ETCD_STATUS_FAIL"); sys.exit(1)
          st = json.loads(o2)
          leaders = set()
          for x in st:
              ldr = x.get("Status",{}).get("leader")
              if ldr:
                  try: lv = int(ldr) if not isinstance(ldr, int) else ldr
                  except: lv = int(str(ldr),16)
                  if lv != 0: leaders.add(lv)
          if len(leaders) != 1: print(f"P3_ETCD_LEADERS={len(leaders)}"); sys.exit(1)
          # GATE 1 — actual leader endpoint count == 1:
          # count endpoint records where Status.header.member_id == Status.leader
          the_leader = list(leaders)[0]
          actual = 0
          for x in st:
              mid = x.get("Status",{}).get("header",{}).get("member_id")
              if str(mid) == str(the_leader):
                  actual += 1
          if actual != 1: print(f"P3_ACTUAL_LEADER_ENDPOINTS={actual}"); sys.exit(1)
          # kube-vip pods 3/3 running+ready (static pods, match by name kube-vip-node-*)
          kv = runj(KC + ["-n","kube-system","get","pods","-o","json"])
          kvi = [p for p in kv.get("items",[]) if p["metadata"]["name"].startswith("kube-vip-node-")]
          if len(kvi) != 3: print(f"P3_KUBEVIP_COUNT={len(kvi)}"); sys.exit(1)
          running = [p for p in kvi if p.get("status",{}).get("phase")=="Running"]
          if len(running) != 3: print(f"P3_KUBEVIP_RUNNING={len(running)}"); sys.exit(1)
          def podready(p):
              cs = p.get("status",{}).get("containerStatuses",[])
              if not cs: return False
              return all(c.get("ready",False) for c in cs)
          ready = [p for p in running if podready(p)]
          if len(ready) != 3: print(f"P3_KUBEVIP_READY={len(ready)}"); sys.exit(1)
          # VIP owner aggregate is checked in the dedicated P3 VIP task below.
          # readyz/livez
          rc,o,e = run(KC + ["get","--raw=/readyz"])
          if "ok" not in o: print("P3_READYZ_FAIL"); sys.exit(1)
          rc,o,e = run(KC + ["get","--raw=/livez"])
          if "ok" not in o: print("P3_LIVEZ_FAIL"); sys.exit(1)
          print("P3_ETCD_KUBEVIP_OK")
          PYEOF
      changed_when: false

    # ═══ P3 — VIP owner (local per host) ═══
    - name: P3 — VIP owner local check
      ansible.builtin.shell:
        cmd: |
          C=$(ip -4 addr show 2>/dev/null | grep -c '172.30.140.100/32' || true)
          echo "VIP_OWNER_LOCAL=$C"
      register: vip_owner_local
      changed_when: false

    # ═══ P3 — VIP owner aggregate exactly 1 ═══
    - name: P3 — VIP owner aggregate exactly 1
      ansible.builtin.shell:
        cmd: |
          set -e
          TOTAL=0
          {% for h in groups['all'] %}
          V=$(echo "{{ hostvars[h].vip_owner_local.stdout }}" | grep -oE '[0-9]+' | head -1)
          TOTAL=$((TOTAL + V))
          {% endfor %}
          echo "P3_VIP_OWNER_AGGREGATE=$TOTAL"
          [ "$TOTAL" = "1" ] || { echo "P3_VIP_OWNER_WRONG"; exit 1; }
      changed_when: false
      delegate_to: node-01
      run_once: true

    # ═══ P4A — Calico/CoreDNS/IPPool/BGP ═══
    - name: P4A — calico + coredns + ippool + bgp
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def run(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          def runj(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode==0 else None
          nodes = runj(KC + ["get","nodes","-o","json"])
          n = nodes.get("items",[])
          ready_nodes = [x for x in n if any(c["type"]=="Ready" and c["status"]=="True" for c in x.get("status",{}).get("conditions",[]))]
          if len(n) != 3 or len(ready_nodes) != 3: print("P4A_NODES"); sys.exit(1)
          def deploy_state(name, want_d, want_a, want_r):
              d = runj(KC + ["-n","kube-system","get","deployment",name,"-o","json"])
              if not d: print(f"P4A_{name}_MISSING"); sys.exit(1)
              s = d.get("status",{})
              got = (s.get("replicas",0), s.get("availableReplicas",0), s.get("readyReplicas",0))
              if got != (want_d, want_a, want_r): print(f"P4A_{name}_STATE {got}"); sys.exit(1)
          deploy_state("calico-kube-controllers",1,1,1)
          deploy_state("coredns",2,2,2)
          # calico-node daemonset 3/3
          ds = runj(KC + ["-n","kube-system","get","ds","calico-node","-o","json"])
          s = ds.get("status",{})
          if s.get("numberReady",0) != 3 or s.get("desiredNumberScheduled",0) != 3:
              print(f"P4A_CALICO_NODE {s.get('numberReady')}/{s.get('desiredNumberScheduled')}"); sys.exit(1)
          # IPPool
          rc,o,e = run(KC + ["get","ippool","-o","json"])
          if rc != 0: print("P4A_IPPOOL_QUERY_FAIL"); sys.exit(1)
          pools = json.loads(o).get("items",[])
          if len(pools) != 1: print(f"P4A_IPPOOL_COUNT={len(pools)}"); sys.exit(1)
          spec = pools[0]["spec"]
          if spec.get("cidr") != "10.244.0.0/16": print("P4A_IPPOOL_CIDR"); sys.exit(1)
          if spec.get("ipipMode") != "Always": print("P4A_IPPOOL_IPIP"); sys.exit(1)
          if spec.get("natOutgoing") != True: print("P4A_IPPOOL_NAT"); sys.exit(1)
          if spec.get("disabled") not in (None, False): print("P4A_IPPOOL_DISABLED"); sys.exit(1)
          # IP_AUTODETECTION_METHOD
          node1 = runj(KC + ["-n","kube-system","get","ds","calico-node","-o","json"])
          env = {c["name"]: (c.get("value","") or (c.get("valueFrom",{}).get("fieldRef",{}).get("fieldPath",""))) for c in node1["spec"]["template"]["spec"]["containers"][0].get("env",[])}
          am = env.get("IP_AUTODETECTION_METHOD","")
          if am != "interface=bond0.140": print(f"P4A_AUTODETECT {am}"); sys.exit(1)
          # BGP peers: node-to-node mesh via node annotation IPv4Address
          nds = runj(KC + ["get","nodes","-o","json"])
          got = set()
          expect = {"172.30.140.101","172.30.140.102","172.30.140.103"}
          for nd in nds.get("items",[]):
              a = nd.get("metadata",{}).get("annotations",{}).get("projectcalico.org/IPv4Address","")
              ip = a.split("/")[0]
              if ip: got.add(ip)
          if got != expect: print(f"P4A_BGP_PEERS {got}"); sys.exit(1)
          print("P4A_OK calico 3/3 coredns 2/2 ippool 10.244/16 ipip=Always autodetect=bond0.140 bgp 3/3")
          PYEOF
      changed_when: false
      delegate_to: node-01
      run_once: true

    # ═══ P4B — networkpolicy ═══
    - name: P4B — validation ns NotFound + canonical fingerprint + TASK-018 fp
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess, sys, hashlib
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def run(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          def runj(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode==0 else None
          # p4b-netpol-validation NotFound
          rc,o,e = run(KC + ["get","namespace","p4b-netpol-validation"])
          if "NotFound" not in e: print("P4B_NS_EXISTS"); sys.exit(1)
          # canonical fingerprint
          rc,o,e = run(KC + ["get","networkpolicy","-A","-o","json"])
          if rc != 0: print("P4B_NP_QUERY_FAIL"); sys.exit(1)
          items = json.loads(o).get("items",[])
          parts = []
          for it in items:
              md = it.get("metadata",{})
              spec = it.get("spec",{})
              sh = hashlib.sha256(json.dumps(spec, sort_keys=True).encode()).hexdigest()
              parts.append((md.get("namespace",""), md.get("name",""), md.get("uid",""),
                            md.get("generation",0), sh))
          parts.sort(key=lambda x:(x[0],x[1]))
          canonical = hashlib.sha256(json.dumps(parts, sort_keys=True).encode()).hexdigest()
          print(f"P4B_CANONICAL_FP={canonical}")
          # TASK-018 PRE fingerprint method: md5 of full -A json
          rc,o,e = run(KC + ["get","networkpolicy","-A","-o","json"])
          md5 = hashlib.md5(o.encode()).hexdigest()
          print(f"P4B_TASK018_FP={md5}")
          if md5 != "f3624ec74cedbdda1cf3d526cb730843":
              print("P4B_TASK018_FP_MISMATCH"); sys.exit(1)
          print("P4B_OK")
          PYEOF
      changed_when: false
      delegate_to: node-01
      run_once: true

    # ═══ GATE 2 — P4B semantic source validation (read-only, localhost) ═══
    - name: P4B semantic source validation — parse canonical NetworkPolicy manifests
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import yaml, sys, json
          base = "/root/otus-diplom/ansible/playbooks/files/networkpolicy/"
          def load(f):
              with open(base + f) as fh:
                  return yaml.safe_load(fh)
          # baseline-default-deny-all
          d = load("baseline-default-deny-all.yaml")
          assert d["apiVersion"] == "networking.k8s.io/v1", "deny apiVersion"
          assert d["kind"] == "NetworkPolicy", "deny kind"
          assert d["metadata"]["name"] == "baseline-default-deny-all", "deny name"
          assert d["spec"]["podSelector"] == {}, "deny podSelector"
          pt = set(d["spec"].get("policyTypes", []))
          assert pt == {"Ingress","Egress"}, f"deny policyTypes {pt}"
          assert d["spec"].get("ingress", []) == [], "deny ingress"
          assert d["spec"].get("egress", []) == [], "deny egress"
          print("P4B_SRC_DENY_OK name=baseline-default-deny-all podSelector={} policyTypes={Ingress,Egress} ingress=[] egress=[]")
          # baseline-allow-dns-egress
          a = load("baseline-allow-dns-egress.yaml")
          assert a["apiVersion"] == "networking.k8s.io/v1", "dns apiVersion"
          assert a["kind"] == "NetworkPolicy", "dns kind"
          assert a["metadata"]["name"] == "baseline-allow-dns-egress", "dns name"
          spec = a["spec"]
          assert spec.get("podSelector") == {}, "dns podSelector"
          assert set(spec.get("policyTypes", [])) == {"Egress"}, "dns policyTypes"
          eg = spec.get("egress", [])
          assert len(eg) == 1, f"dns egress count {len(eg)}"
          rule = eg[0]
          # GATE — DNS rule exact keys == {"to","ports"}
          assert set(rule.keys()) == {"to","ports"}, f"dns rule keys {set(rule.keys())}"
          tos = rule.get("to", [])
          assert len(tos) == 1, f"dns to count {len(tos)}"
          to = tos[0]
          # GATE — peer exact keys == {"namespaceSelector","podSelector"}
          assert set(to.keys()) == {"namespaceSelector","podSelector"}, f"dns peer keys {set(to.keys())}"
          # namespaceSelector exact keys + matchLabels exact
          nsel = to["namespaceSelector"]
          assert set(nsel.keys()) == {"matchLabels"}, f"dns ns keys {set(nsel.keys())}"
          assert nsel["matchLabels"] == {"kubernetes.io/metadata.name":"kube-system"}, f"dns ns sel {nsel['matchLabels']}"
          # podSelector exact keys + matchLabels exact
          psel = to["podSelector"]
          assert set(psel.keys()) == {"matchLabels"}, f"dns pod keys {set(psel.keys())}"
          assert psel["matchLabels"] == {"k8s-app":"kube-dns"}, f"dns pod sel {psel['matchLabels']}"
          # ports exact len 2 + semantic set
          ports = rule.get("ports", [])
          assert len(ports) == 2, f"dns ports len {len(ports)}"
          pset = set((p.get("protocol"), p.get("port")) for p in ports)
          assert pset == {("UDP",53),("TCP",53)}, f"dns ports {pset}"
          # no ingress rules
          assert spec.get("ingress", []) == [], "dns has ingress"
          print("P4B_SRC_DNS_OK peer={namespaceSelector,podSelector} ns={matchLabels:kubernetes.io/metadata.name=kube-system} pod={matchLabels:k8s-app=kube-dns} rule={to,ports} ports=2 {UDP/53,TCP/53}")
          # validation-allow-client-egress-to-server
          ce = load("validation-allow-client-egress-to-server.yaml")
          assert ce["apiVersion"] == "networking.k8s.io/v1", "ce apiVersion"
          assert ce["kind"] == "NetworkPolicy", "ce kind"
          assert ce["metadata"]["name"] == "validation-allow-client-egress-to-server", "ce name"
          cs = ce["spec"]
          # GATE — policy podSelector exact keys == {"matchLabels"}, matchLabels exact
          cps = cs.get("podSelector",{})
          assert set(cps.keys()) == {"matchLabels"}, f"ce podSelector keys {set(cps.keys())}"
          assert cps["matchLabels"] == {"role":"client"}, f"ce podSelector {cps['matchLabels']}"
          assert set(cs.get("policyTypes",[])) == {"Egress"}, "ce policyTypes"
          ceg = cs.get("egress",[])
          assert len(ceg) == 1, "ce egress count"
          # GATE — egress rule exact keys == {"to","ports"}
          assert set(ceg[0].keys()) == {"to","ports"}, f"ce rule keys {set(ceg[0].keys())}"
          cto = ceg[0].get("to",[])
          assert len(cto) == 1, "ce to count"
          # GATE — peer exact keys == {"podSelector"}
          cpeer = cto[0]
          assert set(cpeer.keys()) == {"podSelector"}, f"ce peer keys {set(cpeer.keys())}"
          cpsel = cpeer["podSelector"]
          assert set(cpsel.keys()) == {"matchLabels"}, f"ce peer pod keys {set(cpsel.keys())}"
