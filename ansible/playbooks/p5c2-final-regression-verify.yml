          assert spset == {("TCP",8080)}, f"si ports {spset}"
          assert ss.get("egress",[]) == [], "si has egress"
          print("P4B_SRC_SERVER_INGRESS_OK pod={matchLabels:role=server} rule={from,ports} peer={podSelector:matchLabels role=client} port=TCP/8080 no-egress")
          print("P4B_SEMANTIC_SOURCE_OK 4/4 manifests (exact selector keys, fail-closed)")
