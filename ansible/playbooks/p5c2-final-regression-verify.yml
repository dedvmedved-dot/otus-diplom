          assert cpset == {("TCP",8080)}, f"ce ports {cpset}"
          assert cs.get("ingress",[]) == [], "ce has ingress"
          print("P4B_SRC_CLIENT_EGRESS_OK pod={matchLabels:role=client} rule={to,ports} peer={podSelector:matchLabels role=server} port=TCP/8080 no-ingress")
          # validation-allow-server-ingress-from-client
          si = load("validation-allow-server-ingress-from-client.yaml")
          assert si["apiVersion"] == "networking.k8s.io/v1", "si apiVersion"
          assert si["kind"] == "NetworkPolicy", "si kind"
          assert si["metadata"]["name"] == "validation-allow-server-ingress-from-client", "si name"
          ss = si["spec"]
          # GATE — policy podSelector exact keys == {"matchLabels"}, matchLabels exact
          sps = ss.get("podSelector",{})
          assert set(sps.keys()) == {"matchLabels"}, f"si podSelector keys {set(sps.keys())}"
          assert sps["matchLabels"] == {"role":"server"}, f"si podSelector {sps['matchLabels']}"
          assert set(ss.get("policyTypes",[])) == {"Ingress"}, "si policyTypes"
          sing = ss.get("ingress",[])
