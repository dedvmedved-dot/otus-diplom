    # ═══ P5C1/DRBD runtime ═══
    - name: DRBD runtime — 9.3.2 + transport tcp + kernel
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import subprocess, sys
          def run(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          rc,o,e = run("cat /sys/module/drbd/version 2>/dev/null")
          if "9.3.2" not in o: print(f"DRBD_VERSION={o.strip()}"); sys.exit(1)
          rc,o,e = run("lsmod | grep -c '^drbd_transport_tcp ' || true")
          if int(o.strip() or 0) < 1: print("DRBD_TCP_NOT_LOADED"); sys.exit(1)
          rc,o,e = run("uname -r")
          if "6.1.158-1-generic" not in o: print(f"KERNEL={o.strip()}"); sys.exit(1)
          # in-tree 8.4.11 not loaded
          rc,o,e = run("cat /sys/module/drbd/srcversion 2>/dev/null; modinfo drbd 2>/dev/null | grep srcversion")
          # loaded srcversion should differ from in-tree
          print(f"DRBD_OK 9.3.2 kernel={o.strip() if '6.1' in o else ''}")
          PYEOF
      changed_when: false

