          pods = runj(KC + ["-n","piraeus-datastore","get","pods","-l","app.kubernetes.io/component=linstor-satellite","-o","json"])
          items = pods.get("items",[])
          if len(items) != 3: print(f"SAT_POD_COUNT={len(items)}"); sys.exit(1)
          for p in items:
              spec = p["spec"]
              name = p["metadata"]["name"]
              if spec.get("hostNetwork") != True: print(f"SAT_HOSTNETWORK {name}"); sys.exit(1)
              if spec.get("dnsPolicy") != "ClusterFirstWithHostNet": print(f"SAT_DNS {name}"); sys.exit(1)
              if p.get("status",{}).get("phase") != "Running": print(f"SAT_NOT_RUNNING {name}"); sys.exit(1)
              cs = p.get("status",{}).get("containerStatuses",[])
              if not all(c.get("ready",False) for c in cs): print(f"SAT_NOT_READY {name}"); sys.exit(1)
              # VLAN141 inside pod
              node = spec.get("nodeName","")
              ipmap = {"node-01":"172.30.141.101","node-02":"172.30.141.102","node-03":"172.30.141.103"}
              want = ipmap.get(node,"")
              rc,o,e = run(KC + ["-n","piraeus-datastore","exec",name,"--","ip","-4","-o","addr","show","dev","bond1.141"])
              if want not in o: print(f"SAT_VLAN141_MISSING {name} {want}"); sys.exit(1)
          # LB_MAKEOPTS preserved
          lb = runj(KC + ["-n","piraeus-datastore","get","linstorsatelliteconfiguration","astra-drbd-loader","-o","json"])
          val = lb["spec"]["podTemplate"]["spec"]["initContainers"][0]["env"][0]["value"]
          if "CONFIG_GCC_PLUGINS=n" not in val or "CONFIG_GCC_PLUGIN_STACKLEAK=n" not in val:
              print("LB_MAKEOPTS_LOST"); sys.exit(1)
          print("SATELLITE_OK 3/3 hostNetwork=true dns=ClusterFirstWithHostNet vlan141 3/3 LB_MAKEOPTS preserved")
          PYEOF
      changed_when: false
      delegate_to: node-01
      run_once: true

    # ═══ NodeConnection + StorageClass ═══
    - name: NodeConnection + StorageClass exact
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess, sys
          KC = ["kubectl","--kubeconfig","/etc/kubernetes/admin.conf"]
          def run(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          def runj(c):
              r = subprocess.run(c, capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode==0 else None
          # NodeConnection
          nc = runj(KC + ["-n","piraeus-datastore","get","linstornodeconnection","p5c2-drbd-vlan141","-o","json"])
          if not nc: print("NC_MISSING"); sys.exit(1)
          conds = nc.get("status",{}).get("conditions",[])
          conf = [c for c in conds if c.get("type")=="Configured" and c.get("status")=="True"]
          if len(conf) != 1: print("NC_NOT_CONFIGURED"); sys.exit(1)
          paths = nc["spec"].get("paths",[])
          if paths and paths[0].get("interface") != "drbd141": print("NC_IFACE_WRONG"); sys.exit(1)
          props = nc["spec"].get("properties",[])
          proto = [p.get("value") for p in props if p.get("name")=="DrbdOptions/Net/protocol"]
          if proto != ["C"]: print("NC_PROTO_WRONG"); sys.exit(1)
          # StorageClass
          sc = runj(KC + ["get","storageclass","piraeus-r2","-o","json"])
          if not sc: print("SC_MISSING"); sys.exit(1)
          if sc.get("provisioner") != "linstor.csi.linbit.com": print("SC_PROV"); sys.exit(1)
          if sc.get("reclaimPolicy") != "Delete": print("SC_RECLAIM"); sys.exit(1)
          if sc.get("allowVolumeExpansion") != True: print("SC_EXPAND"); sys.exit(1)
          if sc.get("volumeBindingMode") != "WaitForFirstConsumer": print("SC_BIND"); sys.exit(1)
          # GATE 3 — StorageClass true exactness
          p = sc.get("parameters",{})
          expected_keys = {
              "csi.storage.k8s.io/fstype",
              "linstor.csi.linbit.com/disklessOnRemaining",
              "linstor.csi.linbit.com/disklessStoragePool",
              "linstor.csi.linbit.com/placementCount",
              "linstor.csi.linbit.com/resourceGroup",
              "linstor.csi.linbit.com/storagePool",
              "property.linstor.csi.linbit.com/DrbdOptions/Net/protocol",
          }
          if set(p.keys()) != expected_keys:
              print(f"SC_PARAM_KEYS_MISMATCH got={set(p.keys())} want={expected_keys}"); sys.exit(1)
          want = {"linstor.csi.linbit.com/storagePool":"piraeus-thin",
                  "linstor.csi.linbit.com/placementCount":"2",
                  "linstor.csi.linbit.com/resourceGroup":"piraeus-r2",
                  "linstor.csi.linbit.com/disklessStoragePool":"DfltDisklessStorPool",
                  "linstor.csi.linbit.com/disklessOnRemaining":"true",
                  "csi.storage.k8s.io/fstype":"ext4",
                  "property.linstor.csi.linbit.com/DrbdOptions/Net/protocol":"C"}
          for k,v in want.items():
              if p.get(k) != v: print(f"SC_PARAM {k}"); sys.exit(1)
          # source.hostDevices absent in SC (storageclass has no such field; verify none)
          # not default — both annotations must not be "true"
          ann = sc.get("metadata",{}).get("annotations",{})
          if ann.get("storageclass.kubernetes.io/is-default-class") == "true": print("SC_IS_DEFAULT"); sys.exit(1)
          if ann.get("storageclass.beta.kubernetes.io/is-default-class") == "true": print("SC_IS_DEFAULT_BETA"); sys.exit(1)
          print("NC_SC_OK nodeconnection Configured=True proto=C sc piraeus-r2 exact (7 params exact-set, not-default both annotations)")
          PYEOF
      changed_when: false
      delegate_to: node-01
      run_once: true

