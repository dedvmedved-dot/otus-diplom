          [ -f "$PRE" ] || { echo "P5B_PRE_EVIDENCE_MISSING"; exit 1; }
          python3 << PYEOF
          import subprocess, json, sys, re
          # current PV UUIDs / VG UUID / thin UUID across 3 nodes via ssh
