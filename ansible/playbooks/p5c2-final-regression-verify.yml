          for n in ["node-01","node-02","node-03"]:
              if n not in raw: print(f"LINSTOR_NODE_MISSING {n}"); sys.exit(1)
          # drbd141 interfaces
          for n, ip in [("node-01","172.30.141.101"),("node-02","172.30.141.102"),("node-03","172.30.141.103")]:
              rc,o,e = run(KC + ["-n","piraeus-datastore","exec","deploy/linstor-controller","--","linstor","node","interface","list",n])
              r2 = re.sub(r"\x1b\[[0-9;]*m","",o)
