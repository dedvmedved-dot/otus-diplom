    # ═══ P5B — composite final backing gate ═══
    - name: P5B — composite 6/6 + immutable IDs
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 << 'PYEOF'
          import json, subprocess, sys, re
          host = "{{ inventory_hostname }}"
          cands = {{ candidates[inventory_hostname] | to_json }}
          os_pv = {{ os_pv[inventory_hostname] | to_json }}
          exp_size = "{{ candidate_size }}"
          exp_model = "{{ candidate_model }}"
          def run(c):
              r = subprocess.run(c, shell=True, capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          rc,o,e = run("lsblk -b -d -n -o NAME,TYPE,SERIAL,WWN,MODEL,SIZE")
          lines = [l.split() for l in o.splitlines() if l.strip()]
          disks = []
          for l in lines:
              if len(l) >= 6 and l[1] == "disk":
                  disks.append({"name": l[0], "type": l[1], "serial": l[2], "wwn": l[3],
                                "model": l[4], "size": l[5]})
          # resolve 2 candidates by serial+wwn+model+exact size
          resolved = []
          for c in cands:
              for d in disks:
                  if d["serial"] == c["serial"] and d["wwn"] == c["wwn"] \
                     and d["model"] == exp_model and d["size"] == exp_size:
                      resolved.append("/dev/"+d["name"])
          if len(resolved) != 2: print(f"P5B_RESOLVE_FAIL {resolved}"); sys.exit(1)
          # vg_piraeus exactly once + pv_count=2
          rc,o,e = run("vgs --reportformat json -o vg_name,vg_uuid,vg_free,pv_count")
          vgs = json.loads(o)["report"][0]["vg"]
          vg_rows = [v for v in vgs if v["vg_name"]=="vg_piraeus"]
          if len(vg_rows) != 1: print("P5B_VG_COUNT"); sys.exit(1)
          vg = vg_rows[0]
          if vg.get("pv_count","") != "2": print(f"P5B_VG_PVCOUNT={vg.get('pv_count')}"); sys.exit(1)
          vg_uuid = vg.get("vg_uuid","")
          if not vg_uuid: print("P5B_VG_UUID_EMPTY"); sys.exit(1)
          vg_free_s = str(vg.get("vg_free","0"))
          m = re.search(r'(\d+(?:[.,]\d+)?)', vg_free_s)
          vg_free = float(m.group(1).replace(",",".")) if m else -1
          if vg_free <= 0: print("P5B_VG_FREE_ZERO"); sys.exit(1)
          # PV path set == candidate set, PV UUID set matches
          rc,o,e = run("pvs --reportformat json -o pv_name,vg_name,pv_uuid")
          pvs = json.loads(o)["report"][0]["pv"]
          vg_pvs = [p for p in pvs if p["vg_name"]=="vg_piraeus"]
          pv_paths = sorted(p["pv_name"] for p in vg_pvs)
          pv_uuids = sorted(p["pv_uuid"] for p in vg_pvs)
          if pv_paths != sorted(resolved): print(f"P5B_PV_PATH_MISMATCH {pv_paths} vs {resolved}"); sys.exit(1)
          # OS PV
          rc,o,e = run("pvs --reportformat json -o pv_name,vg_name,pv_uuid")
          allpv = json.loads(o)["report"][0]["pv"]
          osfound = [p for p in allpv if p["pv_name"]==os_pv[0] and p["vg_name"]==os_pv[1]]
          if len(osfound) != 1: print("P5B_OS_PV_MISSING"); sys.exit(1)
          # protected/non-candidate in vg_piraeus = 0
          if len(vg_pvs) != 2: print("P5B_PROTECTED_PV"); sys.exit(1)
          # thin_piraeus exactly once + type + active + data/meta <100
          rc,o,e = run("lvs --reportformat json -o vg_name,lv_name,lv_uuid,lv_attr,lv_size,data_percent,metadata_percent")
          lvs = json.loads(o)["report"][0]["lv"]
          thin_rows = [l for l in lvs if l["vg_name"]=="vg_piraeus" and l["lv_name"]=="thin_piraeus"]
          if len(thin_rows) != 1: print("P5B_THIN_COUNT"); sys.exit(1)
          thin = thin_rows[0]
          attr = thin.get("lv_attr","")
          if attr[0:1] != "t": print("P5B_THIN_TYPE"); sys.exit(1)
          if attr[4:5] != "a": print("P5B_THIN_NOT_ACTIVE"); sys.exit(1)
          def pct(x):
              try:
                  if x in ("","-"): return None
                  return float(str(x).replace(",",".").strip())
              except: return None
          dp = pct(thin.get("data_percent",""))
          mp = pct(thin.get("metadata_percent",""))
          if dp is not None and dp >= 100: print("P5B_THIN_DATA_FULL"); sys.exit(1)
          if mp is not None and mp >= 100: print("P5B_THIN_META_FULL"); sys.exit(1)
          thin_uuid = thin.get("lv_uuid","")
          thin_size = thin.get("lv_size","")
          print(f"P5B_OK {host} pv={pv_paths} vg_uuid={vg_uuid} thin_uuid={thin_uuid} thin_size={thin_size} attr={attr}")
          PYEOF
      changed_when: false

    # ═══ P5B immutable compare — run on localhost (PRE evidence lives on Hermes host) ═══
    - name: P5B — immutable ID compare vs TASK-018 PRE
      ansible.builtin.shell:
