---
# TASK-P7B2-R2 — Zero-mutation P7B2 final read-only verifier.
# NO ansible copy/template/file writes, NO remote helper file, NO /tmp import.
# Task 1 collects compact facts on node-01; Task 2 validates on controller via
# shared logic from repo; Task 3 node host-level checks are inline read-only.
# changed_when: false everywhere.

- name: "P7B2 final read-only verifier (zero-mutation)"
  hosts: all
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Collect compact cluster facts (read-only, node-01)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, subprocess
          KC = ["kubectl", "--kubeconfig", "/etc/kubernetes/admin.conf"]
          def runj(c):
              r = subprocess.run(c, capture_output=True, text=True)
              if r.returncode != 0:
                  raise AssertionError(f"query failed: {' '.join(c)} rc={r.returncode}")
              return json.loads(r.stdout)
          def run(c):
              r = subprocess.run(c, capture_output=True, text=True)
              if r.returncode != 0:
                  raise AssertionError(f"query failed: {' '.join(c)} rc={r.returncode}")
              return r.stdout

          nodes = runj(KC + ["get","nodes","-o","json"])["items"]
          vers = [it["status"]["nodeInfo"]["kubeletVersion"] for it in nodes]
          ready = [any(c["type"]=="Ready" and c["status"]=="True" for c in it["status"]["conditions"]) for it in nodes]

          mc = runj(KC + ["-n","metallb-system","get","deploy","controller","-o","json"])
          ms = runj(KC + ["-n","metallb-system","get","ds","speaker","-o","json"])
          ed = runj(KC + ["-n","envoy-gateway-system","get","deploy","envoy-gateway","-o","json"])
          gc = runj(KC + ["get","gatewayclass","eg","-o","json"])
          kvp = runj(KC + ["-n","kube-system","get","pod","kube-vip-node-01","-o","json"])
          kv_env = {e["name"]: e.get("value","") for e in kvp["spec"]["containers"][0]["env"]}
          gw = runj(KC + ["get","gateway","-A","-o","json"])["items"]
          hr = runj(KC + ["get","httproute","-A","-o","json"])["items"]
          deps = runj(KC + ["get","deploy","-A","-o","json"])["items"]
          mdep = runj(KC + ["-n","kube-system","get","deploy","metrics-server","-o","json"])
          pods = runj(KC + ["-n","kube-system","get","pods","-l","k8s-app=metrics-server","-o","json"])["items"]
          c0 = pods[0]["spec"]["containers"][0]
          api = runj(KC + ["get","apiservice","v1beta1.metrics.k8s.io","-o","json"])
          csrs = runj(KC + ["get","csr","-o","json"])["items"]

          data = {
            "versions": vers,
            "ready": ready,
            "metallb_controller_ready": mc["status"].get("availableReplicas",0),
            "metallb_speaker_ready": ms["status"].get("numberReady",0),
            "envoy_ready": ed["status"].get("availableReplicas",0),
            "gatewayclass_accepted": [c["status"] for c in gc["status"]["conditions"] if c["type"]=="Accepted"],
            "kubevip_svc_enable": kv_env.get("svc_enable",""),
            "kubevip_address": kv_env.get("address",""),
            "gateway_count": len(gw),
            "httproute_count": len(hr),
            "velero_names": [d["metadata"]["name"] for d in deps if "velero" in d["metadata"]["name"]],
            "ms_ready": mdep["status"].get("availableReplicas",0),
            "ms_replicas": mdep["spec"]["replicas"],
            "ms_image": c0.get("image",""),
            "ms_args": c0.get("args", []),
            "ms_imageID": pods[0]["status"]["containerStatuses"][0]["imageID"],
            "apiservice_available": [c["status"] for c in api["status"]["conditions"] if c["type"]=="Available"],
            "nodemetrics": runj(KC + ["get","--raw","/apis/metrics.k8s.io/v1beta1/nodes"]),
            "top_nodes": run(KC + ["top","nodes"]),
            "top_pods": run(KC + ["top","pods","-A"]),
            "csr_pending": [c for c in csrs if c["spec"].get("signerName")=="kubernetes.io/kubelet-serving"
                            and not any(x.get("type") in ("Approved","Denied") for x in c["status"].get("conditions",[]))],
          }
          print(json.dumps(data))
          PYEOF
      register: cluster_facts
      changed_when: false
      delegate_to: node-01
      run_once: true

    - name: Controller-side validation via shared logic (read-only, localhost)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import json, os, sys, glob, subprocess
          root = subprocess.run(["git","rev-parse","--show-toplevel"], capture_output=True, text=True).stdout.strip()
          sys.path.insert(0, os.path.join(root, "ansible", "tools"))
          import p7b2_verify_logic as V
          raw = r'''{{ hostvars['node-01']['cluster_facts']['stdout'] }}'''
          d = json.loads(raw)

          assert all(v == "v1.36.2" for v in d["versions"]), "k8s drift"
          print("P7B2_K8S_OK")
          assert len(d["versions"]) == 3 and all(d["ready"]), "node count/ready"
          print("P7B2_NODES_READY")
          assert d["metallb_controller_ready"] == 1 and d["metallb_speaker_ready"] == 3, "metallb"
          print("P7B2_P6B_PRESERVED")
          assert d["envoy_ready"] == 1 and d["gatewayclass_accepted"] and d["gatewayclass_accepted"][0]=="True", "envoy/gatewayclass"
          print("P7B2_P6C_PRESERVED")
          assert d["kubevip_svc_enable"] == "false" and d["kubevip_address"] == "172.30.140.100", "kube-vip"
          assert d["gateway_count"] == 0 and d["httproute_count"] == 0, "residue"
          print("P7B2_P6D_KUBECTL_OK")
          V.validate_velero(d["velero_names"])
          print("P7B2_VELERO_ABSENT")
          V.validate_deploy(d["ms_ready"], d["ms_replicas"])
          print("P7B2_METRICS_SERVER_OK")
          V.validate_image(d["ms_image"], d["ms_imageID"])
          print("P7B2_IMAGE_DIGEST_OK")
          V.validate_args(d["ms_args"])
          print("P7B2_INSECURE_FLAGS_ABSENT")
          V.validate_apiservice(d["apiservice_available"][0] if d["apiservice_available"] else "False")
          print("P7B2_APISERVICE_OK")
          V.validate_nodemetrics(d["nodemetrics"])
          print("P7B2_NODE_METRICS_OK")
          V.validate_freshness(d["nodemetrics"])
          print("P7B2_METRICS_FRESHNESS_OK")
          V.validate_top_nodes(d["top_nodes"])
          print("P7B2_TOP_NODES_OK")
          V.validate_top_pods(d["top_pods"])
          print("P7B2_TOP_PODS_OK")
          V.validate_csr(d["csr_pending"])
          print("P7B2_CSR_STATE_OK")
          V.validate_readme(open(os.path.join(root,"README.md")).read())
          print("P7B2_README_STATUS_OK")

          p7b2_dir = None
          for x in glob.glob(os.path.join(root,"evidence","P7","*task-p7b2-metrics-server-secure-deployment")):
              p7b2_dir = x
          assert p7b2_dir, "P7B2 evidence dir not found"
          def rd(fn):
              return open(os.path.join(p7b2_dir, fn)).read()
          old_uid = new_uid = ""
          for line in rd("43-recovery-before.txt").splitlines():
              if "uid=" in line: old_uid = line.split("uid=",1)[1].split()[0]
          for line in rd("45-recovery-after.txt").splitlines():
              if "uid=" in line: new_uid = line.split("uid=",1)[1].split()[0]
          apisvc = rd("46-recovery-metrics-api.txt")
          top_out = rd("47-recovery-top-nodes.txt")
          V.validate_recovery(old_uid, new_uid,
              "YES" if "APISERVICE_RECOVERED=YES" in apisvc else "NO",
              "YES" if "METRICS_API_RECOVERED=YES" in apisvc else "NO", top_out)
          print("P7B2_RECOVERY_UID_CHANGE_OK")
          print("P7B2_RECOVERY_APISERVICE_OK")
          print("P7B2_RECOVERY_METRICS_OK")
          print("P7B2_RECOVERY_TOP_NODES_OK")
          PYEOF
      changed_when: false
      delegate_to: localhost
      connection: local
      run_once: true

    - name: Node kubelet TLS + P6D route + P7A VLAN143 (read-only, inline, all nodes)
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          import subprocess, socket
          host = socket.gethostname()
          cfg = open("/var/lib/kubelet/config.yaml").read()
          assert "serverTLSBootstrap: true" in cfg, "serverTLSBootstrap"
          assert "rotateCertificates: true" in cfg, "rotateCertificates"
          print("P7B2_SERVER_TLS_BOOTSTRAP_OK")
          print("P7B2_ROTATE_CERTIFICATES_OK")
          cert = "/var/lib/kubelet/pki/kubelet-server-current.pem"
          v = subprocess.run(["openssl","verify","-CAfile","/etc/kubernetes/pki/ca.crt",cert],capture_output=True,text=True)
          assert v.returncode==0, "cluster-CA trust"
          print("P7B2_KUBELET_CLUSTER_CA_TRUST_OK")
          san = subprocess.run(["openssl","x509","-in",cert,"-noout","-ext","subjectAltName"],capture_output=True,text=True).stdout
          assert host in san, "DNS SAN"
          print("P7B2_KUBELET_DNS_SAN_OK")
          p = subprocess.run(["bash","-c","tr '\\0' '\\n' < /proc/$(pgrep -xo kubelet)/cmdline | grep -oE 'node-ip=[0-9.]+' | cut -d= -f2"],capture_output=True,text=True)
          ip = p.stdout.strip()
          assert ip and ip in san, "IP SAN"
          print("P7B2_KUBELET_IP_SAN_OK")
          t = subprocess.run(["openssl","s_client","-connect",f"{ip}:10250","-verify_return_error","-CAfile","/etc/kubernetes/pki/ca.crt","-verify_ip",ip],input="",capture_output=True,text=True)
          assert t.returncode==0, "TLS IP"
          print("P7B2_KUBELET_TLS_INTERNALIP_OK")
          h = subprocess.run(["openssl","s_client","-connect",f"{ip}:10250","-servername",host,"-verify_hostname",host,"-verify_return_error","-CAfile","/etc/kubernetes/pki/ca.crt"],input="",capture_output=True,text=True)
          assert h.returncode==0, "TLS hostname"
          print("P7B2_KUBELET_TLS_HOSTNAME_OK")
          rr = subprocess.run(["ip","route","show","172.30.20.0/24"],capture_output=True,text=True)
          assert "172.30.20.0/24 via 172.30.140.1 dev bond0.140" in rr.stdout, "P6D route"
          print("P7B2_P6D_PRESERVED")
          b = subprocess.run(["ip","-br","addr","show","bond0.143"],capture_output=True,text=True)
          assert "bond0.143" in b.stdout and "172.30.143" in b.stdout, "VLAN143"
          print("P7B2_P7A_PRESERVED")
          PYEOF
      changed_when: false

    - name: P7B2 final PASS gate after all host-level checks
      ansible.builtin.shell:
        cmd: |
          python3 << 'PYEOF'
          print("P7A_NO_METRICS_SERVER_ASSERTION=SUPERSEDED_BY_P7B2")
          print("P7B1_NO_METRICS_SERVER_ASSERTION=SUPERSEDED_BY_P7B2")
          print("P7B2_ALL_HOST_LEVEL_GATES_COMPLETED=YES")
          print("P7B2_FINAL_READONLY_VERIFIER_PASS")
          PYEOF
      changed_when: false
      delegate_to: localhost
      connection: local
      run_once: true
