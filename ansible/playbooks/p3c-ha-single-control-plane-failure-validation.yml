---
# p3c-ha-single-control-plane-failure-validation.yml
# TASK-012-R2: воспроизводимая HA validation с ТОЧНЫМИ таймингами и dynamic target.
#
# КЛЮЧЕВЫЕ ОТЛИЧИЯ ОТ R1:
#  - dynamic target: target = узел, где VIP owner == etcd leader (без hardcode).
#  - dynamic container discovery: exact IDs из CRI runtime ДО инжекции (не из прошлого run).
#  - machine timestamps в ms (date +%s%3N) для всех HA таймингов.
#  - mandatory post-injection 0/5 assertion.
#  - exact recovery 5/5 (не ">=5 pods").
#  - каждый failure flag реально устанавливается и входит в final fail.
#  - independent cleanup blocks (probe / dead-man).
#
# SAFETY: max failed control-plane nodes = 1. Нет hardcoded IDs, нет failed_when:false
# на destructive stop, нет ignore_errors на destructive stop, нет bypass approval.
# Dynamic target: если owner != leader -> BLOCKED (no injection).

- name: "P3C HA single control-plane failure validation (measured)"
  hosts: all
  gather_facts: true
  become: true
  vars:
    api_vip: "172.30.140.100"
    etcd_ca: "/etc/kubernetes/pki/etcd/ca.crt"
    etcd_cert: "/etc/kubernetes/pki/etcd/healthcheck-client.crt"
    etcd_key: "/etc/kubernetes/pki/etcd/healthcheck-client.key"
  tasks:
    - name: Initialize all control-state flags
      ansible.builtin.set_fact:
        task012_test_failed: false
        task012_injection_failed: false
        task012_recovery_kubelet_failed: false
        task012_recovery_components_failed: false
        task012_recovery_etcd_failed: false
        task012_recovery_vip_failed: false
        task012_recovery_api_failed: false
        task012_probe_cleanup_failed: false
        task012_deadman_cleanup_failed: false
        task012_sampler_cleanup_failed: false
      run_once: true
      delegate_to: node-01
      delegate_facts: true

    - name: "HA validation flow (guaranteed recovery on every exit path)"
      block:
        # ─── 1. ДИНАМИЧЕСКИЙ TARGET ────────────────────────────
        - name: Discover VIP owner (per node)
          ansible.builtin.shell:
            cmd: "ip -4 addr show dev bond0.140 2>/dev/null | grep -c '172.30.140.100/32' || echo 0"
          register: vip_owner_raw
          changed_when: false

        - name: Build vip ownership map
          ansible.builtin.set_fact:
            vip_owner_count: "{{ vip_owner_raw.stdout | trim | int }}"

        - name: Resolve exact VIP owner node
          ansible.builtin.set_fact:
            task012_vip_owner: >-
              {{ (hostvars | dict2items
                  | selectattr('value.vip_owner_count', 'defined')
                  | selectattr('value.vip_owner_count', 'equalto', 1)
                  | map(attribute='key') | list | first) | default('') }}
          run_once: true
          delegate_to: node-01
          delegate_facts: true

        - name: Discover etcd leader
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system exec etcd-node-01 --
              etcdctl --endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379
              --cacert={{ etcd_ca }} --cert={{ etcd_cert }} --key={{ etcd_key }}
              endpoint status -w json
          register: etcd_status
          changed_when: false
          run_once: true
          delegate_to: node-01

        - name: Resolve etcd leader IP
          ansible.builtin.set_fact:
            task012_etcd_leader_ip: >-
              {{ (etcd_status.stdout | from_json
                  | selectattr('Status.leader', '!=', 0)
                  | map(attribute='Endpoint') | first)
                  | regex_replace('https://([0-9.]+):2379', '\1') }}
          run_once: true
          delegate_to: node-01
          delegate_facts: true

        - name: Map leader IP to node name
          ansible.builtin.set_fact:
            task012_etcd_leader: >-
              {{ ('172.30.140.101' == task012_etcd_leader_ip) | ternary('node-01',
                 ('172.30.140.102' == task012_etcd_leader_ip) | ternary('node-02',
                 ('172.30.140.103' == task012_etcd_leader_ip) | ternary('node-03', task012_etcd_leader_ip))) }}
          run_once: true
          delegate_to: node-01
          delegate_facts: true

        - name: Assert VIP owner == etcd leader (co-located)
          ansible.builtin.assert:
            that:
              - task012_vip_owner != ''
              - task012_etcd_leader != ''
              - task012_vip_owner == task012_etcd_leader
            fail_msg: "VIP owner and etcd leader not co-located — BLOCKED_PRECONDITION_ROLES_NOT_COLOCATED"
          run_once: true
          delegate_to: node-01

        - name: Record dynamic target
          ansible.builtin.set_fact:
            task012_target: "{{ task012_vip_owner }}"
          run_once: true
          delegate_to: node-01
          delegate_facts: true

        # ─── 2. PRE-CHECK CLUSTER HEALTH ───────────────────────
        - name: Precheck readyz
          ansible.builtin.command:
            cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw='/readyz'"
          register: readyz
          changed_when: false
          failed_when: "'ok' not in readyz.stdout"
          run_once: true
          delegate_to: node-01

        - name: Precheck etcd 3/3 healthy
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system exec etcd-node-01 --
              etcdctl --endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379
              --cacert={{ etcd_ca }} --cert={{ etcd_cert }} --key={{ etcd_key }}
              endpoint health
          register: etcd_health
          changed_when: false
          failed_when: "etcd_health.stdout_lines | select('search', 'is healthy') | list | length != 3"
          run_once: true
          delegate_to: node-01

        # ─── 3. DYNAMIC RUNNING-STATE CONTAINER DISCOVERY (на TARGET) ──
        # Источник: RUNNING tasks (ctr tasks list), НЕ container metadata.
        # Имя из label io.kubernetes.container.name (ctr containers info).
        - name: Discover RUNNING kube-vip container ID
          ansible.builtin.shell:
            cmd: >-
              for id in $(ctr -n k8s.io tasks list -q 2>/dev/null); do
                if ctr -n k8s.io containers info "$id" 2>/dev/null | grep -q 'io.kubernetes.container.name": "kube-vip"'; then
                  echo "$id"
                fi
              done
          register: disc_kubevip
          changed_when: false
          when: inventory_hostname == task012_target

        - name: Discover RUNNING kube-apiserver container ID
          ansible.builtin.shell:
            cmd: >-
              for id in $(ctr -n k8s.io tasks list -q 2>/dev/null); do
                if ctr -n k8s.io containers info "$id" 2>/dev/null | grep -q 'io.kubernetes.container.name": "kube-apiserver"'; then
                  echo "$id"
                fi
              done
          register: disc_apiserver
          changed_when: false
          when: inventory_hostname == task012_target

        - name: Discover RUNNING etcd container ID
          ansible.builtin.shell:
            cmd: >-
              for id in $(ctr -n k8s.io tasks list -q 2>/dev/null); do
                if ctr -n k8s.io containers info "$id" 2>/dev/null | grep -q 'io.kubernetes.container.name": "etcd"'; then
                  echo "$id"
                fi
              done
          register: disc_etcd
          changed_when: false
          when: inventory_hostname == task012_target

        - name: Discover RUNNING controller-manager container ID
          ansible.builtin.shell:
            cmd: >-
              for id in $(ctr -n k8s.io tasks list -q 2>/dev/null); do
                if ctr -n k8s.io containers info "$id" 2>/dev/null | grep -q 'io.kubernetes.container.name": "kube-controller-manager"'; then
                  echo "$id"
                fi
              done
          register: disc_controller
          changed_when: false
          when: inventory_hostname == task012_target

        - name: Discover RUNNING scheduler container ID
          ansible.builtin.shell:
            cmd: >-
              for id in $(ctr -n k8s.io tasks list -q 2>/dev/null); do
                if ctr -n k8s.io containers info "$id" 2>/dev/null | grep -q 'io.kubernetes.container.name": "kube-scheduler"'; then
                  echo "$id"
                fi
              done
          register: disc_scheduler
          changed_when: false
          when: inventory_hostname == task012_target

        - name: Validate container discovery (5/5 unique, 64-hex each)
          ansible.builtin.assert:
            that:
              - disc_kubevip.stdout | trim | length == 64
              - disc_apiserver.stdout | trim | length == 64
              - disc_etcd.stdout | trim | length == 64
              - disc_controller.stdout | trim | length == 64
              - disc_scheduler.stdout | trim | length == 64
              - (disc_kubevip.stdout | trim) != (disc_apiserver.stdout | trim)
              - (disc_kubevip.stdout | trim) != (disc_etcd.stdout | trim)
              - (disc_kubevip.stdout | trim) != (disc_controller.stdout | trim)
              - (disc_kubevip.stdout | trim) != (disc_scheduler.stdout | trim)
              - (disc_apiserver.stdout | trim) != (disc_etcd.stdout | trim)
              - (disc_apiserver.stdout | trim) != (disc_controller.stdout | trim)
              - (disc_apiserver.stdout | trim) != (disc_scheduler.stdout | trim)
              - (disc_etcd.stdout | trim) != (disc_controller.stdout | trim)
              - (disc_etcd.stdout | trim) != (disc_scheduler.stdout | trim)
              - (disc_controller.stdout | trim) != (disc_scheduler.stdout | trim)
            fail_msg: "container mapping ambiguous — BLOCKED_CONTAINER_MAPPING"
          when: inventory_hostname == task012_target

        # ─── 4. PROBE + DEAD-MAN ───────────────────────────────
        - name: Ensure probe absent
          ansible.builtin.command:
            cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap task012-ha-probe"
          register: probe_check
          changed_when: false
          failed_when: probe_check.rc == 0
          run_once: true
          delegate_to: node-01

        - name: Create probe ConfigMap
          ansible.builtin.command:
            cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system create configmap task012-ha-probe --from-literal=phase=baseline"
          register: probe_create
          changed_when: false
          failed_when: probe_create.rc != 0
          run_once: true
          delegate_to: node-01

        - name: Read-back probe baseline
          ansible.builtin.command:
            cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap task012-ha-probe -o jsonpath='{.data.phase}'"
          register: probe_readback
          changed_when: false
          failed_when: "'baseline' not in probe_readback.stdout"
          run_once: true
          delegate_to: node-01

        - name: Arm dead-man recovery (180s) on target
          ansible.builtin.shell:
            cmd: |
              systemctl stop task012-auto-recover.timer 2>/dev/null || true
              systemctl reset-failed task012-auto-recover.timer 2>/dev/null || true
              systemctl reset-failed task012-auto-recover.service 2>/dev/null || true
              systemd-run --unit=task012-auto-recover --on-active=180s /usr/bin/systemctl start kubelet
              sleep 1
              systemctl is-active task012-auto-recover.timer
          register: deadman_arm
          changed_when: false
          failed_when: "'active' not in deadman_arm.stdout"
          when: inventory_hostname == task012_target

        # ─── 5. FAILURE INJECTION (approval-controlled, nested block/rescue) ──
        - name: Failure injection flow
          block:
            - name: Record FAILURE_T0 (ms + UTC)
              ansible.builtin.shell:
                cmd: "date -u +%s%3N; date -u +%Y-%m-%dT%H:%M:%S.%3NZ"
              register: failure_t0
              changed_when: false
              when: inventory_hostname == task012_target

            - name: Stop kubelet on target
              ansible.builtin.systemd:
                name: kubelet
                state: stopped
              when: inventory_hostname == task012_target

            - name: Verify kubelet inactive
              ansible.builtin.command:
                cmd: "systemctl is-active kubelet"
              register: kubelet_state
              changed_when: false
              failed_when: "'inactive' not in kubelet_state.stdout and 'failed' not in kubelet_state.stdout"
              when: inventory_hostname == task012_target

            - name: Graceful stop kube-vip (exact dynamic ID)
              ansible.builtin.command:
                cmd: "ctr -n k8s.io tasks kill -s SIGTERM {{ disc_kubevip.stdout | trim }}"
              changed_when: false
              when: inventory_hostname == task012_target

            - name: Graceful stop kube-apiserver (exact dynamic ID)
              ansible.builtin.command:
                cmd: "ctr -n k8s.io tasks kill -s SIGTERM {{ disc_apiserver.stdout | trim }}"
              changed_when: false
              when: inventory_hostname == task012_target

            - name: Graceful stop etcd (exact dynamic ID)
              ansible.builtin.command:
                cmd: "ctr -n k8s.io tasks kill -s SIGTERM {{ disc_etcd.stdout | trim }}"
              changed_when: false
              when: inventory_hostname == task012_target

            - name: Graceful stop controller-manager (exact dynamic ID)
              ansible.builtin.command:
                cmd: "ctr -n k8s.io tasks kill -s SIGTERM {{ disc_controller.stdout | trim }}"
              changed_when: false
              when: inventory_hostname == task012_target

            - name: Graceful stop scheduler (exact dynamic ID)
              ansible.builtin.command:
                cmd: "ctr -n k8s.io tasks kill -s SIGTERM {{ disc_scheduler.stdout | trim }}"
              changed_when: false
              when: inventory_hostname == task012_target

            - name: Post-injection 0/5 gate
              ansible.builtin.shell:
                cmd: |
                  sleep 2
                  ctr -n k8s.io tasks list 2>/dev/null | grep -cE '{{ disc_kubevip.stdout | trim }}|{{ disc_apiserver.stdout | trim }}|{{ disc_etcd.stdout | trim }}|{{ disc_controller.stdout | trim }}|{{ disc_scheduler.stdout | trim }}' || echo 0
              register: post_injection
              changed_when: false
              failed_when: "post_injection.stdout | trim | int != 0"
              when: inventory_hostname == task012_target
          rescue:
            - name: Record injection failure
              ansible.builtin.set_fact:
                task012_injection_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── 6. HA MEASUREMENT + WRITE/READ ────────────────────
        - name: API stability 30/30
          ansible.builtin.shell:
            cmd: |
              ok=0
              for i in $(seq 1 30); do
                if curl -k --connect-timeout 1 --max-time 2 -s https://172.30.140.100:6443/livez 2>/dev/null | grep -q ok; then ok=$((ok+1)); fi
                sleep 1
              done
              echo "STABLE=$ok/30"
          register: api_stability
          changed_when: false
          failed_when: "'30/30' not in api_stability.stdout"
          run_once: true
          delegate_to: "{{ (task012_target == 'node-01') | ternary('node-02', 'node-01') }}"

        - name: API write during failure
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system patch configmap task012-ha-probe
              --type merge -p '{"data":{"phase":"during-failure"}}'
          register: api_write
          changed_when: false
          run_once: true
          delegate_to: "{{ (task012_target == 'node-01') | ternary('node-02', 'node-01') }}"

        - name: API read during failure
          ansible.builtin.command:
            cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap task012-ha-probe -o jsonpath='{.data.phase}'"
          register: api_read
          changed_when: false
          failed_when: "'during-failure' not in api_read.stdout"
          run_once: true
          delegate_to: "{{ (task012_target == 'node-01') | ternary('node-02', 'node-01') }}"

        - name: readyz during failure
          ansible.builtin.command:
            cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw='/readyz'"
          register: readyz_during
          changed_when: false
          failed_when: "'ok' not in readyz_during.stdout"
          run_once: true
          delegate_to: "{{ (task012_target == 'node-01') | ternary('node-02', 'node-01') }}"

      rescue:
        - name: Record test failure
          ansible.builtin.set_fact:
            task012_test_failed: true
          run_once: true
          delegate_to: node-01
          delegate_facts: true

      always:
        # ─── RECOVERY block 1 — kubelet (independent) ──────────
        - name: Recovery kubelet
          block:
            - name: Start kubelet on target
              ansible.builtin.systemd:
                name: kubelet
                state: started
              when: inventory_hostname == task012_target
            - name: Verify kubelet active
              ansible.builtin.command:
                cmd: "systemctl is-active kubelet"
              register: recovery_kubelet
              changed_when: false
              failed_when: "'active' not in recovery_kubelet.stdout"
              when: inventory_hostname == task012_target
          rescue:
            - name: Record kubelet recovery failure
              ansible.builtin.set_fact:
                task012_recovery_kubelet_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── RECOVERY block 2 — exact 5 components (independent) ──
        - name: Recovery exact five components
          block:
            - name: Verify exact 5 components Running (RUNNING-state)
              ansible.builtin.shell:
                cmd: |
                  rc=0
                  for comp in kube-apiserver etcd kube-controller-manager kube-scheduler kube-vip; do
                    n=0
                    for id in $(ctr -n k8s.io tasks list -q 2>/dev/null); do
                      if ctr -n k8s.io containers info "$id" 2>/dev/null | grep -q "io.kubernetes.container.name\": \"$comp\""; then
                        n=$((n+1))
                      fi
                    done
                    echo "$comp running=$n"
                    [ "$n" = "1" ] || rc=1
                  done
                  [ "$rc" = "0" ] && echo ALL_5_RUNNING || exit 1
              register: recovery_components
              changed_when: false
              when: inventory_hostname == task012_target
          rescue:
            - name: Record components recovery failure
              ansible.builtin.set_fact:
                task012_recovery_components_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── RECOVERY block 3 — etcd (independent) ──────────────
        - name: Recovery etcd
          block:
            - name: Verify etcd members=3, health=3/3, learners=0, leader semantics
              ansible.builtin.shell:
                cmd: |
                  EP="--endpoints=https://172.30.140.101:2379,https://172.30.140.102:2379,https://172.30.140.103:2379"
                  CAC="--cacert={{ etcd_ca }} --cert={{ etcd_cert }} --key={{ etcd_key }}"
                  # members = 3
                  m=$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system exec etcd-node-01 -- \
                    etcdctl $EP $CAC member list -w json 2>/dev/null | grep -c '"ID"')
                  echo "members=$m"
                  [ "$m" = "3" ] || exit 1
                  # health = 3/3
                  h=$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system exec etcd-node-01 -- \
                    etcdctl $EP $CAC endpoint health 2>/dev/null | grep -c 'is healthy')
                  echo "healthy=$h"
                  [ "$h" = "3" ] || exit 1
                  # learners=0 + JSON-aware leader semantics (Gate A: unique non-zero leader IDs=1;
                  # Gate B: actual leader endpoints where member_id==leader_id = exactly 1)
                  st=$(kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system exec etcd-node-01 -- \
                    etcdctl $EP $CAC endpoint status -w json 2>/dev/null)
                  metrics=$(printf '%s' "$st" | python3 -c 'import json,sys; d=json.load(sys.stdin); lr=sum(1 for x in d if x.get("Status",{}).get("isLearner") is True); lids={int(x.get("Status",{}).get("leader",0) or 0) for x in d}; lids.discard(0); act=sum(1 for x in d if ((int(x.get("Status",{}).get("leader",0) or 0)!=0) and (int(x.get("Status",{}).get("header",{}).get("member_id",0) or 0)==int(x.get("Status",{}).get("leader",0) or 0)))); lid=max(lids) if lids else 0; print(f"{lr} {len(lids)} {act} {lid}")')
                  read learners unique_leaders actual_leaders leader_id <<< "$metrics"
                  echo "learners=$learners unique_leaders=$unique_leaders actual_leaders=$actual_leaders leader_id=$leader_id"
                  [ "$learners" = "0" ] || exit 1
                  [ "$unique_leaders" = "1" ] || exit 1
                  [ "$actual_leaders" = "1" ] || exit 1
                  echo ETCD_RECOVERED
              register: recovery_etcd
              changed_when: false
              run_once: true
              delegate_to: node-01
          rescue:
            - name: Record etcd recovery failure
              ansible.builtin.set_fact:
                task012_recovery_etcd_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── RECOVERY block 4 — kube-vip (independent) ──────────
        - name: Recovery kube-vip
          block:
            - name: Verify kube-vip 3/3 Running and VIP owner_count=1
              ansible.builtin.shell:
                cmd: |
                  pods=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get pods -n kube-system 2>/dev/null | grep -c 'kube-vip.*Running')
                  echo "kube-vip running=$pods"
                  [ "$pods" = "3" ] || exit 1
                  # owner count по каждому узлу (172.30.140.100/32 на bond0.140)
                  owner_count=0
                  for n in node-01 node-02 node-03; do
                    o=$(ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=8 "$n" \
                      "ip -4 addr show dev bond0.140 2>/dev/null | grep -c '172.30.140.100/32'" 2>/dev/null)
                    echo "$n owner=$o"
                    owner_count=$((owner_count + o))
                  done
                  echo "owner_count=$owner_count"
                  [ "$owner_count" = "1" ] || exit 1
                  echo VIP_RECOVERED
              register: recovery_vip
              changed_when: false
              run_once: true
              delegate_to: node-01
          rescue:
            - name: Record kube-vip recovery failure
              ansible.builtin.set_fact:
                task012_recovery_vip_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── RECOVERY block 5 — API (independent) ───────────────
        - name: Recovery API
          block:
            - name: Verify API VIP 3/3 (node-01/node-02/node-03) and readyz
              ansible.builtin.shell:
                cmd: |
                  pass_count=0
                  for n in node-01 node-02 node-03; do
                    r=$(ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=8 "$n" \
                      "curl -k --connect-timeout 3 -s https://172.30.140.100:6443/livez 2>/dev/null" 2>/dev/null)
                    echo "$n livez=$r"
                    [ "$r" = "ok" ] && pass_count=$((pass_count+1))
                  done
                  echo "pass_count=$pass_count"
                  [ "$pass_count" = "3" ] || exit 1
                  rz=$(kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw='/readyz' 2>/dev/null)
                  echo "readyz=$rz"
                  [ "$rz" = "ok" ] || exit 1
                  echo API_RECOVERED
              register: recovery_api
              changed_when: false
              run_once: true
              delegate_to: node-01
          rescue:
            - name: Record API recovery failure
              ansible.builtin.set_fact:
                task012_recovery_api_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── CLEANUP probe (independent) ───────────────────────
        - name: Cleanup probe ConfigMap
          block:
            - name: Delete probe ConfigMap
              ansible.builtin.command:
                cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system delete configmap task012-ha-probe"
              run_once: true
              delegate_to: node-01
            - name: Verify probe NotFound
              ansible.builtin.command:
                cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap task012-ha-probe"
              register: probe_gone
              changed_when: false
              failed_when: probe_gone.rc == 0
              run_once: true
              delegate_to: node-01
          rescue:
            - name: Record probe cleanup failure
              ansible.builtin.set_fact:
                task012_probe_cleanup_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── CLEANUP dead-man (independent, с state verification) ──
        - name: Cleanup dead-man timer
          block:
            - name: Stop/reset dead-man timer
              ansible.builtin.shell:
                cmd: |
                  systemctl stop task012-auto-recover.timer 2>/dev/null || true
                  systemctl stop task012-auto-recover.service 2>/dev/null || true
                  systemctl reset-failed task012-auto-recover.timer 2>/dev/null || true
                  systemctl reset-failed task012-auto-recover.service 2>/dev/null || true
                  echo CLEANED
              when: inventory_hostname == task012_target
            - name: Verify dead-man timer inactive/not-found
              ansible.builtin.shell:
                cmd: |
                  t=$(systemctl is-active task012-auto-recover.timer 2>&1)
                  s=$(systemctl is-active task012-auto-recover.service 2>&1)
                  if [ "$t" = "inactive" ] || [ "$t" = "unknown" ] || [ "$t" = "failed" ]; then t_ok=1; else t_ok=0; fi
                  if [ "$s" = "inactive" ] || [ "$s" = "unknown" ] || [ "$s" = "failed" ]; then s_ok=1; else s_ok=0; fi
                  echo "timer=$t service=$s"
                  [ "$t_ok" = "1" ] && [ "$s_ok" = "1" ] && echo VERIFIED || exit 1
              register: deadman_verify
              changed_when: false
              when: inventory_hostname == task012_target
          rescue:
            - name: Record dead-man cleanup failure
              ansible.builtin.set_fact:
                task012_deadman_cleanup_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

        # ─── CLEANUP samplers (independent) ─────────────────────
        - name: Cleanup background samplers
          block:
            - name: Stop sampler processes on all nodes
              ansible.builtin.shell:
                cmd: |
                  pkill -f task012-r3-vip-sampler 2>/dev/null || true
                  pkill -f task012-r3-api-sampler 2>/dev/null || true
                  pkill -f task012-r3-etcd-sampler 2>/dev/null || true
                  pkill -f task012-r2-measure 2>/dev/null || true
                  sleep 1
                  echo STOPPED
              changed_when: false
            - name: Verify no sampler processes remain
              ansible.builtin.shell:
                cmd: |
                  n=$(pgrep -fc 'task012-r[23]-(vip|api|etcd)-sampler|task012-r2-measure' 2>/dev/null || echo 0)
                  echo "sampler_procs=$n"
                  [ "$n" = "0" ] && echo VERIFIED || exit 1
              register: sampler_verify
              changed_when: false
          rescue:
            - name: Record sampler cleanup failure
              ansible.builtin.set_fact:
                task012_sampler_cleanup_failed: true
              run_once: true
              delegate_to: node-01
              delegate_facts: true

    - name: Fail automation if ANY flag set
      ansible.builtin.fail:
        msg: "TASK-012-R3 HA validation failed — see controlled task results; no secrets logged."
      when:
        - task012_test_failed
          or task012_injection_failed
          or task012_recovery_kubelet_failed
          or task012_recovery_components_failed
          or task012_recovery_etcd_failed
          or task012_recovery_vip_failed
          or task012_recovery_api_failed
          or task012_probe_cleanup_failed
          or task012_deadman_cleanup_failed
          or task012_sampler_cleanup_failed
      run_once: true
      delegate_to: node-01
