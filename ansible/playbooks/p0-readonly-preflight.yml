---
# p0-readonly-preflight.yml
# STRICTLY READ-ONLY P0 preflight discovery WITH controller-side evidence capture.
#
# Guarantees (TASK-003):
#   * NO target-node state is modified. No copy/template/file/lineinfile/package/
#     apt/yum/service/systemd, and no remote shell used to WRITE anything.
#   * All commands run read-only; every command task uses `changed_when: false`.
#   * rc/stdout/stderr are captured for every command (nothing hidden, stderr kept).
#   * Missing LVM tooling (pvs/vgs/lvs) is recorded as a factual result, not lost.
#   * Evidence files are written ONLY on the Ansible controller (localhost) via
#     delegate_to: localhost. NO evidence file is ever created on a target node.
#
# Usage (only after authorized access is configured):
#   ansible-playbook -i inventory/hosts.yaml \
#     ansible/playbooks/p0-readonly-preflight.yml \
#     -e "evidence_ts=$(date -u +%Y%m%dT%H%M%SZ)"
#
# If evidence_ts is not supplied, it defaults to the controller time at run start.

- name: P0 read-only preflight discovery (with controller-side evidence)
  hosts: pak_portal
  gather_facts: true
  become: true            # sudo needed for lsblk/by-id/lvm read-only visibility
  any_errors_fatal: false

  vars:
    # Timestamp is resolved once, on the controller, at play start.
    evidence_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    evidence_root: "{{ playbook_dir }}/../../evidence/P0/{{ evidence_ts }}-infrastructure-discovery"
    node_evidence_dir: "{{ evidence_root }}/{{ inventory_hostname }}"

    # Approved read-only command set. Keyed by output filename (no extension).
    # failable: true  -> tolerate non-zero rc (e.g. LVM tooling absent) and STILL
    #                    record rc/stdout/stderr as the factual result.
    p0_commands:
      hostnamectl:   { cmd: "hostnamectl",              failable: false }
      uname:         { cmd: "uname -a",                 failable: false }
      os-release:    { cmd: "cat /etc/os-release",      failable: false }
      timedatectl:   { cmd: "timedatectl status",       failable: false }
      ip-address:    { cmd: "ip -br address",           failable: false }
      ip-link:       { cmd: "ip -br link",              failable: false }
      ip-route:      { cmd: "ip route",                 failable: false }
      lsblk:         { cmd: "lsblk -O",                 failable: false }
      disk-by-id:    { cmd: "ls -l /dev/disk/by-id/",   failable: false }
      lscpu:         { cmd: "lscpu",                    failable: false }
      memory:        { cmd: "free -h",                  failable: false }
      findmnt:       { cmd: "findmnt",                  failable: false }
      pvs:           { cmd: "pvs",                      failable: true  }
      vgs:           { cmd: "vgs",                      failable: true  }
      lvs:           { cmd: "lvs",                      failable: true  }

  tasks:
    - name: Ensure controller-side per-node evidence directory exists
      ansible.builtin.file:
        path: "{{ node_evidence_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: false

    - name: Run approved read-only discovery commands on target nodes
      # command module does NOT invoke a shell and changes nothing here.
      ansible.builtin.command: "{{ item.value.cmd }}"
      changed_when: false
      failed_when: false          # capture rc factually; do not abort on non-zero
      loop: "{{ p0_commands | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: p0_results

    - name: Write each command's rc/stdout/stderr to controller evidence
      ansible.builtin.copy:
        dest: "{{ node_evidence_dir }}/{{ item.item.key }}.txt"
        mode: "0644"
        content: |
          # node: {{ inventory_hostname }}
          # command: {{ item.item.value.cmd }}
          # captured_utc: {{ evidence_ts }}
          # rc: {{ item.rc }}
          # --- STDOUT ---
          {{ item.stdout | default('') }}
          # --- STDERR ---
          {{ item.stderr | default('') }}
      delegate_to: localhost
      become: false
      loop: "{{ p0_results.results }}"
      loop_control:
        label: "{{ item.item.key }} (rc={{ item.rc }})"

    - name: Write safe per-node facts summary to controller evidence
      ansible.builtin.copy:
        dest: "{{ node_evidence_dir }}/_facts-summary.txt"
        mode: "0644"
        content: |
          host: {{ inventory_hostname }}
          distribution: {{ ansible_distribution | default('UNKNOWN') }} {{ ansible_distribution_version | default('') }}
          kernel: {{ ansible_kernel | default('UNKNOWN') }}
          architecture: {{ ansible_architecture | default('UNKNOWN') }}
          processor_cores: {{ ansible_processor_cores | default('UNKNOWN') }}
          processor_count: {{ ansible_processor_count | default('UNKNOWN') }}
          memtotal_mb: {{ ansible_memtotal_mb | default('UNKNOWN') }}
          captured_utc: {{ evidence_ts }}
      delegate_to: localhost
      become: false

- name: Consolidate P0 discovery summary on controller
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    evidence_ts: "{{ hostvars[groups['pak_portal'][0]].evidence_ts | default(lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ')) }}"
    evidence_root: "{{ playbook_dir }}/../../evidence/P0/{{ evidence_ts }}-infrastructure-discovery"
  tasks:
    - name: Ensure summary directory exists
      ansible.builtin.file:
        path: "{{ evidence_root }}/summary"
        state: directory
        mode: "0755"

    - name: Write discovery run summary
      ansible.builtin.copy:
        dest: "{{ evidence_root }}/summary/run-summary.txt"
        mode: "0644"
        content: |
          P0 infrastructure-discovery run
          captured_utc: {{ evidence_ts }}
          nodes: {{ groups['pak_portal'] | default([]) | join(', ') }}
          note: read-only discovery; no target-node state modified.
