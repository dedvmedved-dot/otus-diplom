# P8C Portal Deployment + Service + Barman metrics Service + migration Job.
# Image digest pinned at build time (G2 supply chain) — never a mutable tag.
# DB password/auth verifier arrive via secretKeyRef; public DB CA via projection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
  labels:
    app.kubernetes.io/name: pak-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pak-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pak-portal
    spec:
      serviceAccountName: portal-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: portal
        image: ghcr.io/dedvmedved-dot/otus-diplom-portal@sha256:REPLACE_WITH_VERIFIED_DIGEST
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: mgmt
          containerPort: 8081
        env:
        - name: PORTAL_NAMESPACE
          value: portal
        - name: PORTAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portal-db-app
              key: password
        - name: PORTAL_AUTH_USERNAME
          value: portal-operator
        - name: PORTAL_AUTH_VERIFIER
          valueFrom:
            secretKeyRef:
              name: portal-ui-auth
              key: password-sha256
        - name: PORTAL_DB_CA_FILE
          value: /etc/portal/db/ca.crt
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        startupProbe:
          httpGet:
            path: /startupz
            port: mgmt
          failureThreshold: 12
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: mgmt
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: mgmt
          periodSeconds: 20
        volumeMounts:
        - name: sa-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: db-ca
          mountPath: /etc/portal/db/ca.crt
          subPath: ca.crt
          readOnly: true
      volumes:
      - name: sa-token
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
      - name: db-ca
        secret:
          secretName: portal-db-ca
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pak-portal
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: portal-db-metrics
  namespace: portal
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: portal-db
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
    protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: portal-migrate-0001
  namespace: portal
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pak-portal-migrator
    spec:
      serviceAccountName: portal-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ghcr.io/dedvmedved-dot/otus-diplom-portal@sha256:REPLACE_WITH_VERIFIED_DIGEST
        imagePullPolicy: IfNotPresent
        args: ["migrate"]
        env:
        - name: PORTAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portal-db-app
              key: password
        - name: PORTAL_DB_CA_FILE
          value: /etc/portal/db/ca.crt
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: db-ca
          mountPath: /etc/portal/db/ca.crt
          subPath: ca.crt
          readOnly: true
      volumes:
      - name: db-ca
        secret:
          secretName: portal-db-ca
          items:
          - key: ca.crt
            path: ca.crt
